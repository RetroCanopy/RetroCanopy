<script>
(() => {
'use strict';
// ===================== CONSTANTS (world units) =====================
const W = 600, H = 900, CX = 300, CY = 300;      // board interior; arch centre
const RW = 300;                                   // outer arch wall radius
const BR = 6;                                     // ball radius
const PIN_R = 2.2;
const RAIL_R = 284, RAIL_X = CX - RAIL_R;         // inner launch rail (x=16)
const LANE_R = 294, LANE_X = CX - LANE_R, LANE_Y0 = 880;
const THETA_END = Math.PI * 1.22;                 // where the inner rail ends (upper-left)
const L1 = LANE_Y0 - CY, L2 = LANE_R * (THETA_END - Math.PI);
const G = 900;                                    // board gravity (tilted glass)
const SUB = 360, DT = 1 / SUB;                    // fixed physics step
const MAX_BALLS = 40, FIRE_INTERVAL = 0.25;       // 4 balls / second
const MOUTH_Y = 790, DRAIN_Y = 872;
const FEVER_TIME = 10;
const START_BALLS = 50;
const BEST_KEY = 'rc_pachinko_best_v1';

const POCKETS = [
  { x: 110, hw: 9.5, bh: 30, type: 'x2', balls: 2, pts: 200, col: [255, 60, 210], label: 'x2' },
  { x: 205, hw: 8, bh: 27, type: 'x5', balls: 5, pts: 500, col: [0, 235, 255], label: 'x5' },
  { x: 300, hw: 7, bh: 34, type: 'jp', balls: 15, pts: 1500, col: [255, 205, 60], label: 'JACKPOT' },
  { x: 395, hw: 8, bh: 27, type: 'x5', balls: 5, pts: 500, col: [0, 235, 255], label: 'x5' },
  { x: 490, hw: 9.5, bh: 30, type: 'x2', balls: 2, pts: 200, col: [255, 60, 210], label: 'x2' },
];
for (const p of POCKETS) p.flash = 0;
const GATE_CLOSED = 6.6, GATE_OPEN = 12, GATE_FEVER = 16, GATE_CYCLE = 6, GATE_OPEN_T = 1.6;
let RUB_FRAC = 0.2;
try { const q = new URLSearchParams(location.search).get('rub'); if (q) RUB_FRAC = parseFloat(q); } catch (_) {}

const WINDMILLS = [
  { x: 168, y: 232 }, { x: 300, y: 214 }, { x: 432, y: 232 },
  { x: 142, y: 382 }, { x: 300, y: 372 }, { x: 458, y: 382 },
];
const BLADE_L = 18, BLADE_R = 2.6, HUB_R = 5, WM_I = 260, RING_R = 38;

// ===================== PIN LAYOUT =====================
const pins = [];
(function buildPins() {
  const fixed = [];
  // rings of pins around each windmill
  for (const w of WINDMILLS) {
    for (let k = 0; k < 12; k++) {
      const a = k / 12 * Math.PI * 2 + Math.PI / 12;
      fixed.push([w.x + Math.cos(a) * RING_R, w.y + Math.sin(a) * RING_R]);
    }
  }
  // jackpot head nails and pocket guards
  fixed.push([286, 768], [314, 768]);
  fixed.push([300, 742]);
  for (const px of [205, 395]) fixed.push([px - 16, 770], [px + 16, 770]);
  for (const px of [110, 490]) fixed.push([px, 764]);
  const ok = (x, y) => {
    if (y < 52) return false;
    if (y < CY) { if (Math.hypot(x - CX, y - CY) > 264) return false; }
    else if (x < 36 || x > 580) return false;
    if (y > 750) return false;
    for (const w of WINDMILLS) if (Math.hypot(x - w.x, y - w.y) < RING_R + 14) return false;
    return true;
  };
  const grid = [];
  let row = 0;
  for (let y = 60; y <= 750; y += 22, row++) {
    const off = (row % 2) * 14;
    for (let x = 22 + off; x <= 590; x += 28) if (ok(x, y)) grid.push([x, y]);
  }
  const all = fixed.slice();
  for (const g of grid) {
    let clash = false;
    for (const f of all) if (Math.hypot(g[0] - f[0], g[1] - f[1]) < 18) { clash = true; break; }
    if (!clash) all.push(g);
  }
  for (const p of all) pins.push({ x: p[0], y: p[1] });
})();
// spatial hash for pins is built after segment clearance (below)

// static segments: inner rail arc + vertical rail, right return rubber
const GUIDE_R = [452, 602, 716], GUIDE_L = [432, 582, 702];
const RUB_TH = -Math.PI * RUB_FRAC;
const RUB = [CX + 301 * Math.cos(RUB_TH), CY + 301 * Math.sin(RUB_TH), CX + 272 * Math.cos(RUB_TH + 0.03), CY + 272 * Math.sin(RUB_TH + 0.03)];
const SEGS = [];
(function buildSegs() {
  const n = 14;
  let px = CX + RAIL_R * Math.cos(Math.PI), py = CY + RAIL_R * Math.sin(Math.PI);
  for (let i = 1; i <= n; i++) {
    const th = Math.PI + (THETA_END - Math.PI) * i / n;
    const x = CX + RAIL_R * Math.cos(th), y = CY + RAIL_R * Math.sin(th);
    SEGS.push([px, py, x, y, 2, 0.35]); px = x; py = y;
  }
  SEGS.push([RAIL_X, CY, RAIL_X, 900, 2, 0.35]);
  SEGS.push([RUB[0], RUB[1], RUB[2], RUB[3], 3, 0.6]);   // return rubber on the arch (upper right)
  // wall guides: push wall-huggers back into the pin field
  for (const y of GUIDE_R) SEGS.push([600, y, 576, y + 16, 2.2, 0.35]);
  for (const y of GUIDE_L) SEGS.push([RAIL_X, y, RAIL_X + 22, y + 15, 2.2, 0.35]);
})();
// keep pins clear of segments (no wedge gaps)
for (let i = pins.length - 1; i >= 0; i--) {
  const p = pins[i];
  for (const s of SEGS) {
    const ex = s[2] - s[0], ey = s[3] - s[1];
    let t = ((p.x - s[0]) * ex + (p.y - s[1]) * ey) / (ex * ex + ey * ey); t = Math.max(0, Math.min(1, t));
    if (Math.hypot(p.x - s[0] - ex * t, p.y - s[1] - ey * t) < 17.5) { pins.splice(i, 1); break; }
  }
}
const CELL = 24, GC = Math.ceil(W / CELL) + 1, GR = Math.ceil(H / CELL) + 1;
const pinGrid = Array.from({ length: GC * GR }, () => []);
for (const p of pins) pinGrid[((p.y / CELL) | 0) * GC + ((p.x / CELL) | 0)].push(p);

// ===================== STATE =====================
let rnd = Math.random;
const world = { balls: [], t: 0, wm: WINDMILLS.map(w => ({ x: w.x, y: w.y, a: Math.random() * 6, w: 0 })) };
const game = { balls: START_BALLS, score: 0, over: false, fever: 0, overT: 0, fired: 0, started: false, best: 0, jackpots: 0 };
try { game.best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10) || 0; } catch (_) {}
let SIM = false, simStats = null;
const input = { power: 0.55, dialHeld: false, spaceHeld: false, fireAcc: FIRE_INTERVAL, pointerId: null, lastAng: 0, auto: false };
const popups = [];
const params = new URLSearchParams(location.search);
if (params.get('autoplay') === '1') input.auto = true;

// ===================== AUDIO =====================
let actx = null, master = null, muted = false, lastTick = 0;
try { muted = localStorage.getItem('rc_pachinko_muted') === '1'; } catch (_) {}
function ensureAudio() {
  try {
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      actx = new AC(); master = actx.createGain(); master.gain.value = muted ? 0 : 0.55; master.connect(actx.destination);
    }
    if (actx.state === 'suspended') actx.resume();
  } catch (_) {}
}
function tone(f, dur, type, vol, when, f2) {
  if (!actx || muted || SIM) return;
  const t0 = actx.currentTime + (when || 0);
  const o = actx.createOscillator(), gn = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
  gn.gain.setValueAtTime(0.0001, t0); gn.gain.exponentialRampToValueAtTime(vol, t0 + 0.004);
  gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(gn); gn.connect(master); o.start(t0); o.stop(t0 + dur + 0.02);
}
function sTick(v) {
  if (!actx || muted || SIM) return;
  const now = performance.now(); if (now - lastTick < 32) return; lastTick = now;
  tone(2600 + rnd() * 2200, 0.035, 'triangle', Math.min(0.05, v / 9000));
}
function sLaunch() { tone(220, 0.07, 'sine', 0.05, 0, 90); }
function sPocket(t) {
  const seq = t === 'x2' ? [880, 1175] : [988, 1319, 1760];
  seq.forEach((f, i) => { tone(f, 0.18, 'square', 0.045, i * 0.07); tone(f * 2, 0.12, 'sine', 0.03, i * 0.07); });
}
function sJackpot() {
  const seq = [523, 659, 784, 1047, 784, 1047, 1319, 1568];
  seq.forEach((f, i) => { tone(f, 0.22, 'square', 0.06, i * 0.09); tone(f / 2, 0.22, 'sawtooth', 0.025, i * 0.09); });
  tone(2093, 0.6, 'sine', 0.05, seq.length * 0.09);
}
function sDrain() { tone(150, 0.1, 'sine', 0.025, 0, 80); }
function sFoul() { tone(400, 0.08, 'triangle', 0.03, 0, 300); }

// ===================== PHYSICS =====================
function gateHW() {
  if (game.fever > 0 && !SIM) return GATE_FEVER;
  if (SIM && simStats && simStats.fever) return GATE_FEVER;
  const ph = world.t % GATE_CYCLE;
  let o = 0;
  if (ph < GATE_OPEN_T) { const u = ph / GATE_OPEN_T; o = Math.min(1, Math.min(u, 1 - u) * 6); }
  return GATE_CLOSED + (GATE_OPEN - GATE_CLOSED) * o;
}
function pocketHW(p) { return p.type === 'jp' ? gateHW() : p.hw; }

function spawnBall(power) {
  const v0 = 1200 + power * 360 + (rnd() - 0.5) * 16;
  world.balls.push({ mode: 0, lp: 0, v0, x: LANE_X, y: LANE_Y0, vx: 0, vy: 0, still: 0, age: 0, dead: false });
}

function hitCircle(b, cx, cy, r, e, jit) {
  const dx = b.x - cx, dy = b.y - cy, rr = r + BR, d2 = dx * dx + dy * dy;
  if (d2 >= rr * rr || d2 < 1e-9) return 0;
  const d = Math.sqrt(d2); let nx = dx / d, ny = dy / d;
  b.x = cx + nx * rr; b.y = cy + ny * rr;
  const vn = b.vx * nx + b.vy * ny;
  if (vn >= 0) return 0;
  if (jit) {
    const a = (rnd() - 0.5) * jit, c = Math.cos(a), s = Math.sin(a);
    const jx = nx * c - ny * s, jy = nx * s + ny * c;
    if (b.vx * jx + b.vy * jy < 0) { nx = jx; ny = jy; }
  }
  const vn2 = b.vx * nx + b.vy * ny, tx = -ny, ty = nx, vt = (b.vx * tx + b.vy * ty) * 0.97;
  b.vx = nx * (-vn2 * e) + tx * vt; b.vy = ny * (-vn2 * e) + ty * vt;
  return -vn;
}
function hitSeg(b, ax, ay, bx, by, r, e) {
  const ex = bx - ax, ey = by - ay, l2 = ex * ex + ey * ey;
  let t = ((b.x - ax) * ex + (b.y - ay) * ey) / l2; t = t < 0 ? 0 : t > 1 ? 1 : t;
  return hitCircle(b, ax + ex * t, ay + ey * t, r, e, 0);
}

function onPocket(b, p) {
  b.dead = true;
  if (SIM) { simStats[p.type]++; return; }
  const fever = game.fever > 0;
  const pts = p.pts * (fever ? 2 : 1);
  game.balls += p.balls; game.score += pts; p.flash = 1;
  popups.push({ x: p.x, y: MOUTH_Y - 22, text: '+' + p.balls + ' BALLS', sub: '+' + pts.toLocaleString(), col: p.col, t: 0 });
  if (p.type === 'jp') {
    game.jackpots++;
    if (!fever) { game.fever = FEVER_TIME; sJackpot(); }
    else sPocket('x5');
  } else sPocket(p.type);
}
function onDrain(b) { b.dead = true; if (SIM) { simStats.drain++; return; } sDrain(); }
function onFoul(b) {
  b.dead = true;
  if (SIM) { simStats.foul++; return; }
  game.balls++; sFoul();
  popups.push({ x: 40, y: 760, text: 'RETURN', sub: '', col: [160, 230, 255], t: 0 });
}

function physStep(dt) {
  world.t += dt;
  const balls = world.balls;
  const ghw = gateHW();
  for (let i = 0; i < balls.length; i++) {
    const b = balls[i];
    if (b.dead) continue;
    if (b.mode === 0) {               // ---- kinematic launch lane ----
      const v2 = b.v0 * b.v0 - 2 * G * (LANE_Y0 - b.y);
      if (v2 <= 400) { onFoul(b); continue; }
      b.lp += Math.sqrt(v2) * dt;
      if (b.lp < L1) { b.x = LANE_X; b.y = LANE_Y0 - b.lp; }
      else {
        let th = Math.PI + (b.lp - L1) / LANE_R;
        const rel = th >= THETA_END; if (rel) th = THETA_END;
        b.x = CX + LANE_R * Math.cos(th); b.y = CY + LANE_R * Math.sin(th);
        if (rel) {
          const v = Math.sqrt(Math.max(0, b.v0 * b.v0 - 2 * G * (LANE_Y0 - b.y)));
          b.vx = -Math.sin(th) * v; b.vy = Math.cos(th) * v; b.mode = 1;
        }
      }
      continue;
    }
    // ---- free flight ----
    b.age += dt;
    b.vy += G * dt;
    const damp = 1 - 0.06 * dt; b.vx *= damp; b.vy *= damp;
    b.x += b.vx * dt; b.y += b.vy * dt;
    // outer arch / right wall
    if (b.y < CY) {
      const dx = b.x - CX, dy = b.y - CY, d = Math.hypot(dx, dy), lim = RW - BR;
      if (d > lim) {
        const nx = dx / d, ny = dy / d; b.x = CX + nx * lim; b.y = CY + ny * lim;
        const vn = b.vx * nx + b.vy * ny; if (vn > 0) { b.vx -= 1.3 * vn * nx; b.vy -= 1.3 * vn * ny; }
      }
    } else {
      if (b.x > W - BR) { b.x = W - BR; if (b.vx > 0) b.vx *= -0.35; }
      if (b.x < BR) { b.x = BR; if (b.vx < 0) b.vx *= -0.35; }
    }
    // rails / rubbers
    for (let s = 0; s < SEGS.length; s++) { const g = SEGS[s]; hitSeg(b, g[0], g[1], g[2], g[3], g[4], g[5]); }
    // pins
    const reach = BR + PIN_R;
    const gx0 = Math.max(0, ((b.x - reach) / CELL) | 0), gx1 = Math.min(GC - 1, ((b.x + reach) / CELL) | 0);
    const gy0 = Math.max(0, ((b.y - reach) / CELL) | 0), gy1 = Math.min(GR - 1, ((b.y + reach) / CELL) | 0);
    for (let gy = gy0; gy <= gy1; gy++) for (let gx = gx0; gx <= gx1; gx++) {
      const cell = pinGrid[gy * GC + gx];
      for (let k = 0; k < cell.length; k++) {
        const p = cell[k];
        const v = hitCircle(b, p.x, p.y, PIN_R, 0.5 + (rnd() - 0.5) * 0.16, 0.14);
        if (v > 160) sTick(v);
      }
    }
    // windmills
    for (let k = 0; k < world.wm.length; k++) {
      const w = world.wm[k];
      const dx = b.x - w.x, dy = b.y - w.y, lim = BLADE_L + BLADE_R + BR;
      if (dx * dx + dy * dy > lim * lim) continue;
      hitCircle(b, w.x, w.y, HUB_R, 0.4, 0.1);
      for (let q = 0; q < 4; q++) {
        const ang = w.a + q * Math.PI / 2, tx = Math.cos(ang), ty = Math.sin(ang);
        const ddx = b.x - w.x, ddy = b.y - w.y;
        let pr = ddx * tx + ddy * ty; pr = pr < HUB_R ? HUB_R : pr > BLADE_L ? BLADE_L : pr;
        const qx = w.x + tx * pr, qy = w.y + ty * pr;
        const ex = b.x - qx, ey = b.y - qy, dd = Math.hypot(ex, ey), rr = BLADE_R + BR;
        if (dd >= rr || dd < 1e-6) continue;
        const nx = ex / dd, ny = ey / dd;
        b.x = qx + nx * rr; b.y = qy + ny * rr;
        const rx = qx - w.x, ry = qy - w.y;
        const rvx = b.vx + w.w * ry, rvy = b.vy - w.w * rx;
        const vn = rvx * nx + rvy * ny;
        if (vn < 0) {
          const rn = rx * ny - ry * nx;
          const j = -(1 + 0.45) * vn / (1 + rn * rn / WM_I);
          b.vx += j * nx; b.vy += j * ny; w.w -= j * rn / WM_I;
          if (-vn > 160) sTick(-vn);
        }
      }
    }
    // pockets: rim posts, shoulders, cup walls
    if (b.y > MOUTH_Y - 20) {
      for (let k = 0; k < POCKETS.length; k++) {
        const p = POCKETS[k];
        if (Math.abs(b.x - p.x) > p.bh + 12) continue;
        const hw = p.type === 'jp' ? ghw : p.hw, po = hw + 3;
        hitCircle(b, p.x - po, MOUTH_Y, 3, 0.4, 0.1);
        hitCircle(b, p.x + po, MOUTH_Y, 3, 0.4, 0.1);
        hitSeg(b, p.x - po, MOUTH_Y, p.x - p.bh, MOUTH_Y + 12, 1.5, 0.3);
        hitSeg(b, p.x + po, MOUTH_Y, p.x + p.bh, MOUTH_Y + 12, 1.5, 0.3);
        hitSeg(b, p.x - p.bh, MOUTH_Y + 12, p.x - p.bh, 880, 1.5, 0.3);
        hitSeg(b, p.x + p.bh, MOUTH_Y + 12, p.x + p.bh, 880, 1.5, 0.3);
        if (b.y > MOUTH_Y + 3 && Math.abs(b.x - p.x) < po) { onPocket(b, p); break; }

    }
    if (b.y > DRAIN_Y) { onDrain(b); continue; }
    if (SIM && !b.h && b.y > 770) { b.h = 1; simStats.hist[Math.max(0, Math.min(11, (b.x / 50) | 0))]++; }
    if (b.x < RAIL_X && b.y > CY) { onFoul(b); continue; }
    // stuck guard
    if (b.vx * b.vx + b.vy * b.vy < 100) {
      b.still += dt;
      if (b.still > 0.8) { b.vx += (rnd() - 0.5) * 120; b.vy -= 40; b.still = 0; }
    } else b.still = 0;
    if (b.age > 30) onDrain(b);
  }
  // ball-ball
  for (let i = 0; i < balls.length; i++) {
    const a = balls[i]; if (a.dead || a.mode === 0) continue;
    for (let j = i + 1; j < balls.length; j++) {
      const c = balls[j]; if (c.dead || c.mode === 0) continue;
      const dx = c.x - a.x, dy = c.y - a.y, d2 = dx * dx + dy * dy;

    }
  }

  const wd = 1 - 0.35 * dt;
  for (const w of world.wm) { w.w *= wd; if (w.w > 30) w.w = 30; if (w.w < -30) w.w = -30; w.a += w.w * dt; }
  // compact
  let n = 0; for (let i = 0; i < balls.length; i++) if (!balls[i].dead) balls[n++] = balls[i];
  balls.length = n;
}

function simulate(n, pMin, pMax, opts) {
  opts = opts || {};
  const saved = { balls: world.balls, t: world.t, wm: world.wm };
  world.balls = []; world.t = 0; world.wm = WINDMILLS.map(w => ({ x: w.x, y: w.y, a: Math.random() * 6, w: 0 }));
  SIM = true; simStats = { x2: 0, x5: 0, jp: 0, drain: 0, foul: 0, fever: !!opts.fever, hist: new Array(12).fill(0) };
  let fired = 0, acc = 0, steps = 0;
  const pmin = pMin == null ? 0 : pMin, pmax = pMax == null ? 1 : pMax;
  try {
    while ((fired < n || world.balls.length) && steps < 5e7) {
      if (fired < n) { acc += DT; if (acc >= FIRE_INTERVAL && world.balls.length < MAX_BALLS) { acc -= FIRE_INTERVAL; spawnBall(pmin + (pmax - pmin) * Math.random()); fired++; } }
      physStep(DT); steps++;

  } finally { SIM = false; }
  const s = simStats; simStats = null;
  world.balls = saved.balls; world.t = saved.t; world.wm = saved.wm;
  const valid = n - s.foul;
  const ret = (s.x2 * 2 + s.x5 * 5 + s.jp * 15 + s.foul) / n;
  return { n, x2: s.x2, x5: s.x5, jp: s.jp, drain: s.drain, foul: s.foul, hist: s.hist.join(','),
    rate_x2: +(s.x2 / n * 100).toFixed(2), rate_x5: +(s.x5 / n * 100).toFixed(2), rate_jp: +(s.jp / n * 100).toFixed(2),
    rate_drain: +(s.drain / n * 100).toFixed(2), rate_foul: +(s.foul / n * 100).toFixed(2), returnPerBall: +ret.toFixed(3), simSeconds: +(steps * DT).toFixed(1), valid };
}

  g.beginPath(); g.arc(x, y, cr, 0, Math.PI * 2); g.fillStyle = cap; g.fill();
  g.strokeStyle = 'rgba(0,240,255,0.85)'; g.lineWidth = 2; g.shadowColor = '#00f0ff'; g.shadowBlur = 10; g.stroke(); g.shadowBlur = 0;

  g.beginPath(); g.moveTo(x + ic * cr * 0.45, y + is * cr * 0.45); g.lineTo(x + ic * cr * 0.9, y + is * cr * 0.9); g.stroke(); g.shadowBlur = 0;

  g.shadowBlur = 0;
  // hint
  if (!game.started && !game.over) {
    const a = 0.55 + 0.45 * Math.sin(time * 5);
    g.font = '800 ' + Math.max(11, r * 0.22) + 'px Orbitron, sans-serif'; g.fillStyle = 'rgba(255,214,90,' + a + ')';
    g.shadowColor = 'rgba(255,200,60,1)'; g.shadowBlur = 12;
    g.textAlign = 'right';
    g.fillText(portrait ? 'HOLD & TURN' : 'HOLD & TURN THE DIAL', x - r * 1.75, y - r * 0.2);
    g.font = '600 ' + Math.max(10, r * 0.18) + 'px Outfit, sans-serif';
    g.fillText(portrait ? 'to launch \u2192' : 'or hold SPACE \u2192', x - r * 1.75, y + r * 0.22);
    g.shadowBlur = 0;
  }
  g.restore();
}

function ledText(g, text, ghost, x, y, w, h) {
  g.save(); g.textAlign = 'right'; g.textBaseline = 'middle';
  const fs = h * 0.6; g.font = '700 ' + fs + 'px Orbitron, sans-serif';
  g.fillStyle = 'rgba(255,60,210,0.10)'; g.fillText(ghost, x + w - h * 0.25, y + h / 2 + 1);
  g.fillStyle = '#ff5ad9'; g.shadowColor = '#ff3ccf'; g.shadowBlur = 12;
  g.fillText(text, x + w - h * 0.25, y + h / 2 + 1);
  g.restore();
}

let shownScore = 0;
function drawHud(g) {
  const b = hudBoxes();
  shownScore += (game.score - shownScore) * 0.2; if (Math.abs(game.score - shownScore) < 1) shownScore = game.score;
  ledText(g, String(game.balls), '888', b.balls.x, b.balls.y, b.balls.w, b.bh);
  ledText(g, Math.round(shownScore).toLocaleString('en-US'), '88,888', b.score.x, b.score.y, b.score.w, b.bh);
}

function frame(time) {
  const t = time / 1000;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(staticCv, 0, 0);
  // board dynamic layer (world transform)
  ctx.setTransform(dpr * S, 0, 0, dpr * S, dpr * OX, dpr * OY);
  ctx.save(); archPath(ctx, RW, 905); ctx.clip();
  for (const w of world.wm) drawWindmill(ctx, w);
  drawPockets(ctx, t);
  // balls
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const half = ballSprite.width / 2;
  for (const b of world.balls) ctx.drawImage(ballSprite, (OX + b.x * S) * dpr - half, (OY + b.y * S) * dpr - half);
  // glass sheen
  ctx.setTransform(dpr * S, 0, 0, dpr * S, dpr * OX, dpr * OY);
  const sh = ctx.createLinearGradient(0, 0, 600, 900);
  sh.addColorStop(0, 'rgba(255,255,255,0.10)'); sh.addColorStop(0.28, 'rgba(255,255,255,0.02)'); sh.addColorStop(0.32, 'rgba(255,255,255,0.08)');
  sh.addColorStop(0.36, 'rgba(255,255,255,0.0)'); sh.addColorStop(1, 'rgba(255,255,255,0.03)');
  ctx.fillStyle = sh; ctx.fillRect(0, 0, 600, 905);
  ctx.restore();
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(CX, CY, RW - 8, Math.PI * 1.08, Math.PI * 1.45); ctx.stroke();
  // fever rim flash
  if (game.fever > 0) {
    const ph = Math.floor(t * 8) % 2;
    archPath(ctx, RW + 10, 926); ctx.strokeStyle = ph ? '#ff3ccf' : '#ffd65a'; ctx.lineWidth = 5; ctx.shadowColor = ctx.strokeStyle; ctx.shadowBlur = 30; ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const sc = 1 + 0.06 * Math.sin(t * 10);
    ctx.save(); ctx.translate(300, 120); ctx.scale(sc, sc);
    ctx.font = '900 40px Orbitron, sans-serif'; ctx.lineWidth = 6; ctx.strokeStyle = '#2a0640'; ctx.strokeText('FEVER!', 0, 0);
    ctx.fillStyle = ph ? '#ffe17a' : '#ff6ae0'; ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 24; ctx.fillText('FEVER!', 0, 0);
    ctx.restore();
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; rr(ctx, 200, 150, 200, 8, 4); ctx.fill();
    ctx.fillStyle = '#ffd65a'; rr(ctx, 200, 150, 200 * game.fever / FEVER_TIME, 8, 4); ctx.fill();
    ctx.font = '700 11px Orbitron, sans-serif'; ctx.fillStyle = '#fff'; ctx.fillText('GATE OPEN \u2022 POINTS x2', 300, 172);
  }
  // popups
  for (const p of popups) {
    const a = Math.max(0, 1 - p.t / 1.4), yy = p.y - p.t * 40;
    ctx.globalAlpha = a; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '900 15px Orbitron, sans-serif'; ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(10,2,24,0.9)';
    const px = Math.max(60, Math.min(540, p.x));
    ctx.strokeText(p.text, px, yy); ctx.fillStyle = rgba(p.col, 1); ctx.shadowColor = rgba(p.col, 1); ctx.shadowBlur = 10; ctx.fillText(p.text, px, yy);
    if (p.sub) { ctx.font = '700 11px Orbitron, sans-serif'; ctx.shadowBlur = 0; ctx.strokeText(p.sub, px, yy + 16); ctx.fillStyle = '#ffffff'; ctx.fillText(p.sub, px, yy + 16); }
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  }
  ctx.restore();
  // screen space UI
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (game.fever > 0) {
    const a = 0.08 + 0.06 * Math.sin(t * 12);
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const fg = ctx.createRadialGradient(vw / 2, vh / 2, 50, vw / 2, vh / 2, Math.max(vw, vh) * 0.7);
    fg.addColorStop(0, 'rgba(255,60,210,0)'); fg.addColorStop(1, 'rgba(255,60,210,' + a + ')');
    ctx.fillStyle = fg; ctx.fillRect(0, 0, vw, vh); ctx.restore();
  }
  drawHud(ctx);
  drawDial(ctx, t);
}

// ===================== GAME LOOP =====================
let lastT = 0, acc = 0;
function canFire() { return !game.over && game.balls > 0 && world.balls.length < MAX_BALLS; }
function tick(now) {
  if (!lastT) lastT = now;
  let dt = (now - lastT) / 1000; lastT = now;
  if (dt > 0.05) dt = 0.05;
  if (input.auto) { input.power = 0.55 + 0.4 * Math.sin(now / 1900); }
  const firing = (input.dialHeld || input.spaceHeld || input.auto) && !game.over;
  if (firing) {
    input.fireAcc += dt;
    if (input.fireAcc >= FIRE_INTERVAL) {
      if (canFire()) { input.fireAcc = 0; game.balls--; game.fired++; game.started = true; spawnBall(input.power); sLaunch(); }
      else input.fireAcc = FIRE_INTERVAL;
    }
  } else input.fireAcc = Math.min(input.fireAcc + dt, FIRE_INTERVAL);
  acc += dt;
  while (acc >= DT) { physStep(DT); acc -= DT; }
  if (game.fever > 0) game.fever = Math.max(0, game.fever - dt);
  for (const p of POCKETS) p.flash = Math.max(0, p.flash - dt * 1.8);
  for (let i = popups.length - 1; i >= 0; i--) { popups[i].t += dt; if (popups[i].t > 1.4) popups.splice(i, 1); }
  if (!game.over && game.started && game.balls <= 0 && world.balls.length === 0) {
    game.overT += dt; if (game.overT > 1.2) endGame();
  } else game.overT = 0;
  frame(now);
  requestAnimationFrame(tick);
}

function awardTickets(tickets) {
  let newXp = 0;
  try {
    const xp = parseInt(localStorage.getItem('rc_canopy_xp') || '0', 10) || 0;
    newXp = xp + tickets * 10;
    localStorage.setItem('rc_canopy_xp', String(newXp));
    const user = (localStorage.getItem('rc_current_user_v1') || '').trim();
    if (user) {
      const db = JSON.parse(localStorage.getItem('rc_accounts_db_v2') || '{}') || {};
      const key = user.toLowerCase();
      if (db && db[key]) { db[key].xp = Math.max(db[key].xp || 0, newXp); localStorage.setItem('rc_accounts_db_v2', JSON.stringify(db)); }
    }
  } catch (_) {}
  return newXp;
}
function endGame() {
  game.over = true; input.dialHeld = false; input.spaceHeld = false; input.auto = false;
  const tickets = Math.floor(game.score / 100);
  const newBest = game.score > game.best;
  if (newBest) { game.best = game.score; try { localStorage.setItem(BEST_KEY, String(game.best)); } catch (_) {} }
  const xp = awardTickets(tickets);
  document.getElementById('rScore').textContent = game.score.toLocaleString('en-US');
  document.getElementById('rTix').textContent = '+' + tickets.toLocaleString('en-US');
  document.getElementById('rBest').textContent = game.best.toLocaleString('en-US');
  document.getElementById('rWallet').textContent = Math.floor(xp / 10).toLocaleString('en-US');
  document.getElementById('rNew').style.display = newBest && game.score > 0 ? 'block' : 'none';
  document.getElementById('results').classList.add('show');
}
function newGame() {
  Object.assign(game, { balls: START_BALLS, score: 0, over: false, fever: 0, overT: 0, fired: 0, started: false, jackpots: 0 });
  world.balls.length = 0; popups.length = 0; shownScore = 0;
  document.getElementById('results').classList.remove('show');
}
document.getElementById('again').addEventListener('click', () => { ensureAudio(); newGame(); });

// ===================== INPUT =====================
function onDial(px, py) { return Math.hypot(px - dial.x, py - dial.y) < dial.r * 1.7; }
cv.addEventListener('pointerdown', e => {
  ensureAudio();
  if (game.over) return;
  if (onDial(e.clientX, e.clientY)) {
    input.dialHeld = true; input.pointerId = e.pointerId;
    input.lastAng = Math.atan2(e.clientY - dial.y, e.clientX - dial.x);
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    e.preventDefault();
  }
});
cv.addEventListener('pointermove', e => {
  if (!input.dialHeld || e.pointerId !== input.pointerId) return;
  const dx = e.clientX - dial.x, dy = e.clientY - dial.y;
  const a = Math.atan2(dy, dx);
  if (Math.hypot(dx, dy) > dial.r * 0.25) {
    let d = a - input.lastAng; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2;
    input.power = Math.max(0, Math.min(1, input.power + d / (Math.PI * 1.5)));
  }
  input.lastAng = a;
});
const release = e => { if (e.pointerId === input.pointerId) { input.dialHeld = false; input.pointerId = null; } };
cv.addEventListener('pointerup', release); cv.addEventListener('pointercancel', release); cv.addEventListener('lostpointercapture', release);
cv.addEventListener('wheel', e => { e.preventDefault(); input.power = Math.max(0, Math.min(1, input.power - e.deltaY * 0.0006)); }, { passive: false });
window.addEventListener('keydown', e => {
  if (e.code === 'Space') { ensureAudio(); if (game.over) { if (!e.repeat) newGame(); } else input.spaceHeld = true; e.preventDefault(); }
  else if (e.code === 'ArrowUp' || e.code === 'ArrowRight') { input.power = Math.min(1, input.power + 0.02); e.preventDefault(); }
  else if (e.code === 'ArrowDown' || e.code === 'ArrowLeft') { input.power = Math.max(0, input.power - 0.02); e.preventDefault(); }
  else if (e.code === 'KeyM') toggleMute();
});
window.addEventListener('keyup', e => { if (e.code === 'Space') input.spaceHeld = false; });
window.addEventListener('blur', () => { input.spaceHeld = false; input.dialHeld = false; });
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
const muteBtn = document.getElementById('muteBtn');
function toggleMute() {
  muted = !muted; try { localStorage.setItem('rc_pachinko_muted', muted ? '1' : '0'); } catch (_) {}
  if (master) master.gain.value = muted ? 0 : 0.55;
  muteBtn.innerHTML = muted ? '&#128263;' : '&#128266;';
}
muteBtn.innerHTML = muted ? '&#128263;' : '&#128266;';
muteBtn.addEventListener('click', () => { ensureAudio(); toggleMute(); muteBtn.blur(); });

window.addEventListener('resize', layout);
layout();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => renderStatic());
requestAnimationFrame(tick);
})();
</script>
