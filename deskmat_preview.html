<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Retrocanopy â€” Desk Mats &amp; Mousepads | Vault Drop</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800;900&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #000000;
      --neon-pink: #ff2d95;
      --neon-purple: #9d4edd;
      --neon-blue: #00d4ff;
      --sunset-orange: #ffae00;
      --text-color: #ffffff;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background: #000000;
      color: #ffffff;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow-x: hidden;
      user-select: none;
    }

    /* â”€â”€ 1. MINIMAL FLOATING SITE HEADER â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
    .site-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 300;
      padding: 18px 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(to bottom, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
      pointer-events: none;
    }

    .site-header > * {
      pointer-events: auto;
    }

    .brand-link {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .nav-logo {
      width: 40px;
      height: 40px;
      object-fit: contain;
      mix-blend-mode: screen;
      transition: transform 0.3s ease;
    }

    .brand-link:hover .nav-logo {
      transform: scale(1.08);
    }

    .nav-wordmark {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.2rem;
      font-weight: 900;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .brand-text-base {
      background: linear-gradient(to bottom, var(--sunset-orange) 10%, var(--neon-pink) 90%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 10px rgba(255, 45, 149, 0.5));
    }

    .flicker-letter {
      background: linear-gradient(to bottom, var(--sunset-orange) 10%, var(--neon-pink) 90%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 10px rgba(255, 45, 149, 0.5));
      animation: smooth-neon-pulse 6s infinite ease-in-out;
    }

    @keyframes smooth-neon-pulse {
      0%, 100% { opacity: 1; }
      48% { opacity: 0.95; }
      51% { opacity: 0.42; }
      54% { opacity: 0.78; }
      57% { opacity: 0.48; }
      62% { opacity: 1; }
    }

    .nav-center {
      display: flex;
      align-items: center;
      gap: 28px;
      background: rgba(10, 12, 22, 0.65);
      backdrop-filter: blur(12px);
      padding: 8px 24px;
      border-radius: 999px;
    }

    .nav-center a {
      color: var(--muted);
      text-decoration: none;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      transition: color 0.2s ease, text-shadow 0.2s ease;
    }

    .nav-center a:hover,
    .nav-center a.active {
      color: #ffffff;
      text-shadow: 0 0 12px rgba(255, 45, 149, 0.8);
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .cart-pill {
      background: rgba(255, 45, 149, 0.14);
      color: #ffffff;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      padding: 8px 18px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .cart-pill:hover {
      background: rgba(255, 45, 149, 0.32);
      box-shadow: 0 0 18px rgba(255, 45, 149, 0.5);
    }

    /* â”€â”€ 2. CENTER-STAGE FLOATING SHOWROOM â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
    .showroom-viewport {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      perspective: 1300px;
      overflow: hidden;
    }

    .ambient-aura {
      position: absolute;
      width: 680px;
      height: 420px;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(255, 45, 149, 0.08) 0%, rgba(0, 212, 255, 0.04) 45%, transparent 72%);
      filter: blur(45px);
      pointer-events: none;
      z-index: 1;
    }

    /* Left & Right Floating Arrows */
    .glide-arrow {
      position: fixed;
      top: 46%;
      transform: translateY(-50%);
      z-index: 260;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(12, 15, 26, 0.65);
      backdrop-filter: blur(10px);
      border: none;
      color: #cbd5e1;
      font-family: 'Orbitron', sans-serif;
      font-size: 1.15rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.22s ease;
    }

    .glide-arrow:hover {
      color: #ffffff;
      background: rgba(255, 45, 149, 0.25);
      box-shadow: 0 0 22px rgba(255, 45, 149, 0.45);
      transform: translateY(-50%) scale(1.08);
    }

    .glide-prev { left: 36px; }
    .glide-next { right: 36px; }

    /* Center Floating Mat (NO border, NO base) */
    .mat-levitate-wrapper {
      z-index: 2;
      animation: floatLevitate 4.1s ease-in-out infinite;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 86px;
    }

    .center-mat-img {
      width: min(80vw, 860px);
      max-height: 58vh;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 40px 50px rgba(0, 0, 0, 0.96));
      transition: transform 0.16s ease-out, width 0.3s ease, opacity 0.18s ease;
      pointer-events: none;
    }

    .center-mat-img.is-small {
      width: min(64vw, 450px);
    }

    @keyframes floatLevitate {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
    }

    /* â”€â”€ 3. FLOATING BOTTOM HUD DOCK â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
    .hud-stack {
      position: fixed;
      bottom: 24px;
      z-index: 250;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    /* Top Row of HUD: Size Toggle + 5 Floating Thumbnails */
    .hud-selector-strip {
      display: flex;
      align-items: center;
      gap: 20px;
      background: rgba(10, 12, 20, 0.68);
      backdrop-filter: blur(16px);
      padding: 8px 18px;
      border-radius: 999px;
    }

    .size-switch {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .size-pill {
      background: transparent;
      border: none;
      color: var(--muted);
      font-family: 'Orbitron', sans-serif;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 7px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .size-pill:hover {
      color: #ffffff;
    }

    .size-pill.active {
      background: rgba(255, 45, 149, 0.22);
      color: #ffffff;
      box-shadow: 0 0 14px rgba(255, 45, 149, 0.35);
    }

    .strip-divider {
      width: 1px;
      height: 22px;
      background: rgba(255, 255, 255, 0.12);
    }

    .mini-thumbs {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .mini-thumb {
      cursor: pointer;
      opacity: 0.38;
      transition: all 0.22s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .mini-thumb:hover {
      opacity: 0.8;
      transform: translateY(-2px);
    }

    .mini-thumb.active {
      opacity: 1;
      transform: translateY(-3px);
    }

    .mini-thumb img {
      height: 28px;
      width: auto;
      object-fit: contain;
    }

    .mini-bar {
      width: 14px;
      height: 2px;
      border-radius: 2px;
      background: transparent;
    }

    .mini-thumb.active .mini-bar {
      background: var(--neon-blue);
      box-shadow: 0 0 8px var(--neon-blue);
    }

    /* Bottom Row of HUD: Product Title, Specs, Price, Add to Bag */
    .hud-dock {
      display: flex;
      align-items: center;
      gap: 28px;
      background: rgba(10, 12, 20, 0.78);
      backdrop-filter: blur(18px);
      padding: 13px 28px;
      border-radius: 999px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.88);
    }

    .hud-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 240px;
    }

    .hud-kicker {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--neon-blue);
    }

    .hud-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #ffffff;
    }

    .hud-specs {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .hud-divider {
      width: 1px;
      height: 28px;
      background: rgba(255, 255, 255, 0.1);
    }

    .hud-price {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.25rem;
      font-weight: 900;
      background: linear-gradient(to right, var(--sunset-orange), var(--neon-pink));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hud-buy-btn {
      background: linear-gradient(135deg, var(--sunset-orange) 0%, var(--neon-pink) 100%);
      border: none;
      color: #000000;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.74rem;
      font-weight: 900;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 12px 24px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 45, 149, 0.45);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .hud-buy-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 28px rgba(255, 45, 149, 0.8);
    }

    @media (max-width: 820px) {
      .site-header { padding: 14px 20px; }
      .nav-center, .hud-specs, .hud-divider { display: none; }
      .hud-dock { padding: 14px 20px; gap: 16px; }
      .glide-prev { left: 12px; }
      .glide-next { right: 12px; }
    }
  </style>
  <link rel="stylesheet" href="merch_minimal.css?v=120">
  <link rel="stylesheet" href="merch_zoom.css?v=4">
  <script src="merch_zoom.js?v=100" defer></script>
</head>
<body>

  <!-- 1. MINIMAL FLOATING SITE HEADER -->
  <header class="site-header">
    <a href="index.html" class="brand-link">
      <img src="assets/logo.png" alt="Retrocanopy Logo" class="nav-logo">
      <div class="nav-wordmark">
        <span class="brand-text-base">RETROCAN</span><span class="flicker-letter">O</span><span class="brand-text-base">PY</span>
      </div>
    </a>

    <nav class="nav-center">
      <a href="index.html" class="nav-home-btn">&#8962; Home</a>
      <a href="hat_preview.html">Hat</a>
      <a href="deskmat_preview.html" class="active">Desk Mats</a>
      <a href="hoodie_preview.html">Hoodies</a>
      <a href="tee_preview.html">Tees</a>
      <a href="joggers_preview.html">Joggers</a>
      <a href="longsleeve_preview.html">Long-Sleeves</a>
      <a href="gearbag_preview.html">Misc</a>
    </nav>

    <div class="nav-right">
      <a href="index.html" class="nav-home-pill">&#8962; Home</a>
      <button class="cart-pill" id="bagBtn">Bag (0)</button>
    </div>
  </header>

  <!-- 2. CENTER-STAGE FLOATING SHOWROOM -->
  <main class="showroom-viewport">
    <div class="ambient-aura"></div>

    <button class="glide-arrow glide-prev" onclick="stepMat(-1)" aria-label="Previous Mat">&#8592;</button>

    <div class="mat-levitate-wrapper">
      <img class="center-mat-img" id="centerMatImg" src="assets/merch/deskmat_topdown_1.png?v=3" alt="Floating Desk Mat">
    </div>

    <button class="glide-arrow glide-next" onclick="stepMat(1)" aria-label="Next Mat">&#8594;</button>
  </main>

  <!-- 3. FLOATING BOTTOM HUD DOCK -->
  <footer class="hud-stack">
    <!-- Top Strip: Size Format Switch + Minimalist Dots -->
    <div class="hud-selector-strip">
      <div class="size-switch">
        <button class="size-pill active" id="pillXxl" onclick="switchSize('xxl')">XXL Mat</button>
        <button class="size-pill" id="pillSmall" onclick="switchSize('small')">Compact Pad</button>
      </div>

      <div class="strip-divider"></div>

      <div class="mini-thumbs" id="thumbStrip"></div>
    </div>

    <!-- Bottom Dock: Live Item Info + Price + Add to Bag -->
    <div class="hud-dock">
      <div class="hud-info">
        <span class="hud-kicker" id="hudKicker">RC-201</span>
        <span class="hud-title" id="hudTitle">Classic Sunset Grid XXL</span>
      </div>

      <div class="hud-divider"></div>

      <div class="hud-specs" id="hudSpecs">
        <span>900 Ã— 400 Ã— 4mm</span>
        <span>â€¢</span>
        <span>Micro-Woven Cloth</span>
        <span>â€¢</span>
        <span>Matte-Black Stitched Edge</span>
      </div>

      <div class="hud-divider"></div>

      <div class="hud-price" id="hudPrice">$38</div>

      <button class="hud-buy-btn" onclick="addToBag(this)">Add to Bag</button>
    </div>
  </footer>

  <script>
    const surfaceData = {
      xxl: {
        label: 'XXL BATTLE STATION MAT',
        specs: '<span>900 Ã— 400 Ã— 4mm</span><span>â€¢</span><span>Micro-Woven Cloth</span><span>â€¢</span><span>Matte-Black Stitched Edge</span>',
        price: '$38',
        items: [
          { model: 'RC-201', title: 'Classic Sunset Grid XXL', src: 'assets/merch/deskmat_topdown_1.png?v=3' },
          { model: 'RC-202', title: 'Signature Type XXL', src: 'assets/merch/deskmat_topdown_2.png?v=3' },
          { model: 'RC-203', title: 'Outrun Wireframe Horizon XXL', src: 'assets/merch/deskmat_topdown_3.png?v=3' },
          { model: 'RC-204', title: 'Pro-Esports Stealth XXL', src: 'assets/merch/deskmat_topdown_4.png?v=3' },
          { model: 'RC-205', title: 'Starry Synthwave Cosmos XXL', src: 'assets/merch/deskmat_topdown_5.png?v=3' }
        ]
      },
      small: {
        label: 'COMPACT GAMING MOUSEPAD',
        specs: '<span>350 Ã— 300 Ã— 4mm</span><span>â€¢</span><span>Precision Cloth</span><span>â€¢</span><span>Matte-Black Stitched Edge</span>',
        price: '$22',
        items: [
          { model: 'RC-211', title: 'Classic Full Emblem Pad', src: 'assets/merch/mousepad_small_1.png?v=3' },
          { model: 'RC-212', title: 'Minimalist Stealth Icon Pad', src: 'assets/merch/mousepad_small_2.png?v=3' },
          { model: 'RC-213', title: 'Dual Cyan/Magenta Grid Pad', src: 'assets/merch/mousepad_small_3.png?v=3' },
          { model: 'RC-214', title: 'Corner-Badge Pro Aim Pad', src: 'assets/merch/mousepad_small_4.png?v=3' },
          { model: 'RC-215', title: 'Starry Outrun Horizon Pad', src: 'assets/merch/mousepad_small_5.png?v=3' }
        ]
      }
    };

    let currentSize = 'xxl';
    let currentIdx = 0;
    let bagCount = 0;

    const centerMatImg = document.getElementById('centerMatImg');
    const hudKicker = document.getElementById('hudKicker');
    const hudTitle = document.getElementById('hudTitle');
    const hudSpecs = document.getElementById('hudSpecs');
    const hudPrice = document.getElementById('hudPrice');
    const thumbStrip = document.getElementById('thumbStrip');
    const pillXxl = document.getElementById('pillXxl');
    const pillSmall = document.getElementById('pillSmall');
    const bagBtn = document.getElementById('bagBtn');

    function updateShowroom() {
      const group = surfaceData[currentSize];
      const item = group.items[currentIdx];

      centerMatImg.src = item.src;
      centerMatImg.classList.toggle('is-small', currentSize === 'small');

      hudKicker.textContent = item.model;
      hudTitle.textContent = item.title;
      hudSpecs.innerHTML = group.specs;
      hudPrice.textContent = group.price;

      pillXxl.classList.toggle('active', currentSize === 'xxl');
      pillSmall.classList.toggle('active', currentSize === 'small');

      thumbStrip.innerHTML = '';
      group.items.forEach((it, idx) => {
        const div = document.createElement('div');
        div.className = 'mini-thumb' + (idx === currentIdx ? ' active' : '');
        div.title = `${it.model} â€” ${it.title}`;
        div.onclick = () => {
          currentIdx = idx;
          updateShowroom();
        };
        thumbStrip.appendChild(div);
      });
    }

    function switchSize(size) {
      currentSize = size;
      updateShowroom();
    }

    function stepMat(dir) {
      const len = surfaceData[currentSize].items.length;
      currentIdx = (currentIdx + dir + len) % len;
      updateShowroom();
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') stepMat(1);
      if (e.key === 'ArrowLeft') stepMat(-1);
    });

    window.addEventListener('mousemove', (e) => {
      const x = (e.clientX / window.innerWidth - 0.5) * 2;
      const y = (e.clientY / window.innerHeight - 0.5) * 2;
      centerMatImg.style.transform = `rotateY(${x * 8}deg) rotateX(${-y * 6}deg)`;
    });

    function addToBag(btn) {
      bagCount++;
      bagBtn.textContent = `Bag (${bagCount})`;
      const orig = btn.textContent;
      btn.textContent = 'Added âœ“';
      setTimeout(() => { btn.textContent = orig; }, 900);
    }

    updateShowroom();
  </script>
</body>
</html>
