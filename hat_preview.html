<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Retrocanopy — Official Snapback Hat | Vault Drop</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800;900&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #000000;
      --neon-pink: #ff2d95;
      --neon-purple: #9d4edd;
      --neon-blue: #00d4ff;
      --sunset-orange: #ffae00;
      --text-color: #ffffff;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background: #000000;
      color: #ffffff;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow-x: hidden;
      user-select: none;
    }

    /* ── MINIMAL FLOATING SITE HEADER ─────────────────────────────────── */
    .site-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 300;
      padding: 18px 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(to bottom, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
      pointer-events: none;
    }

    .site-header > * {
      pointer-events: auto;
    }

    .brand-link {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .nav-logo {
      width: 40px;
      height: 40px;
      object-fit: contain;
      mix-blend-mode: screen;
      transition: transform 0.3s ease;
    }

    .brand-link:hover .nav-logo {
      transform: scale(1.08);
    }

    .nav-wordmark {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.2rem;
      font-weight: 900;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .brand-text-base {
      background: linear-gradient(to bottom, var(--sunset-orange) 10%, var(--neon-pink) 90%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 10px rgba(255, 45, 149, 0.5));
    }

    .flicker-letter {
      background: linear-gradient(to bottom, var(--sunset-orange) 10%, var(--neon-pink) 90%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 10px rgba(255, 45, 149, 0.5));
      animation: smooth-neon-pulse 6s infinite ease-in-out;
    }

    @keyframes smooth-neon-pulse {
      0%, 100% { opacity: 1; }
      48% { opacity: 0.95; }
      51% { opacity: 0.42; }
      54% { opacity: 0.78; }
      57% { opacity: 0.48; }
      62% { opacity: 1; }
    }

    .nav-center {
      display: flex;
      align-items: center;
      gap: 28px;
      background: rgba(10, 12, 22, 0.65);
      backdrop-filter: blur(12px);
      padding: 8px 24px;
      border-radius: 999px;
    }

    .nav-center a {
      color: var(--muted);
      text-decoration: none;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      transition: color 0.2s ease, text-shadow 0.2s ease;
    }

    .nav-center a:hover,
    .nav-center a.active {
      color: #ffffff;
      text-shadow: 0 0 12px rgba(255, 45, 149, 0.8);
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .cart-pill {
      background: rgba(255, 45, 149, 0.14);
      color: #ffffff;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      padding: 8px 18px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .cart-pill:hover {
      background: rgba(255, 45, 149, 0.32);
      box-shadow: 0 0 18px rgba(255, 45, 149, 0.5);
    }

    /* ── CENTER-STAGE FLOATING SHOWROOM ───────────────────────────────── */
    .showroom-viewport {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      perspective: 1200px;
      overflow: hidden;
    }

    /* Subtle Ambient Aura Behind Floating Hat (No base, no border) */
    .ambient-aura {
      position: absolute;
      width: 460px;
      height: 460px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 45, 149, 0.08) 0%, rgba(0, 212, 255, 0.04) 45%, transparent 70%);
      filter: blur(40px);
      pointer-events: none;
      z-index: 1;
    }

    /* -- CONCEPT 2: 360� 3D HOLOGRAPHIC MERCH & HAT SHOWROOM ----------- */
    .showroom-3d-floor {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 34vh;
      perspective: 680px;
      transform-style: preserve-3d;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .showroom-3d-floor-horizon {
      position: absolute;
      top: 0;
      left: -10%;
      width: 120%;
      height: 2px;
      background: linear-gradient(90deg, transparent 0%, rgba(0, 212, 255, 0.7) 22%, rgba(255, 45, 149, 0.9) 50%, rgba(0, 212, 255, 0.7) 78%, transparent 100%);
      box-shadow: 0 0 18px rgba(0, 212, 255, 0.8), 0 0 36px rgba(255, 45, 149, 0.65);
    }

    .showroom-3d-floor-grid {
      position: absolute;
      top: 0;
      left: -50%;
      width: 200%;
      height: 520%;
      transform-origin: 50% 0%;
      transform: perspective(460px) rotateX(64deg);
      background-image:
        repeating-linear-gradient(90deg, rgba(0, 212, 255, 0.34) 0px, rgba(0, 212, 255, 0.34) 1.5px, transparent 1.5px, transparent 54px),
        repeating-linear-gradient(0deg, rgba(255, 45, 149, 0.30) 0px, rgba(255, 45, 149, 0.30) 1.5px, transparent 1.5px, transparent 42px);
    }

    .hat-levitate-wrapper {
      position: relative;
      z-index: 3;
      animation: floatLevitate 3.8s ease-in-out infinite;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 54px;
      transform-style: preserve-3d;
    }

    /* 360� Glowing Cyan & Magenta Holographic Turntable Orbit Rings */
    .holo-360-orbit-system {
      position: absolute;
      width: min(82vw, 560px);
      height: min(82vw, 560px);
      pointer-events: none;
      transform-style: preserve-3d;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    .holo-orbit-ring-1 {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid rgba(0, 212, 255, 0.72);
      box-shadow: 0 0 24px rgba(0, 212, 255, 0.55), inset 0 0 18px rgba(0, 212, 255, 0.3);
      transform: rotateX(74deg) rotateZ(0deg);
      animation: orbitSpin1 14s linear infinite;
    }

    .holo-orbit-ring-2 {
      position: absolute;
      width: 82%;
      height: 82%;
      border-radius: 50%;
      border: 2px dashed rgba(255, 45, 149, 0.78);
      box-shadow: 0 0 24px rgba(255, 45, 149, 0.55);
      transform: rotateX(74deg) rotateY(12deg) rotateZ(0deg);
      animation: orbitSpin2 10s linear infinite reverse;
    }

    .holo-pedestal-emitter {
      position: absolute;
      bottom: -36px;
      width: 58%;
      height: 26px;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.9) 0%, rgba(0, 212, 255, 0.65) 38%, rgba(255, 45, 149, 0.45) 72%, transparent 100%);
      border: 2px solid #00d4ff;
      box-shadow: 0 0 32px #00d4ff, 0 0 58px rgba(255, 45, 149, 0.75);
    }

    .holo-360-badge {
      position: absolute;
      bottom: -52px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.68rem;
      font-weight: 900;
      letter-spacing: 0.18em;
      color: #00d4ff;
      background: rgba(6, 12, 24, 0.92);
      border: 1.5px solid #00d4ff;
      padding: 4px 14px;
      border-radius: 999px;
      box-shadow: 0 0 18px rgba(0, 212, 255, 0.65);
    }

    @keyframes orbitSpin1 {
      0% { transform: rotateX(74deg) rotateZ(0deg); }
      100% { transform: rotateX(74deg) rotateZ(360deg); }
    }
    @keyframes orbitSpin2 {
      0% { transform: rotateX(70deg) rotateY(8deg) rotateZ(0deg); }
      100% { transform: rotateX(70deg) rotateY(8deg) rotateZ(360deg); }
    }

    .hat-3d-rotor {
      position: relative;
      transform-style: preserve-3d;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease-out;
    }

    .hat-3d-rotor.auto-orbit {
      animation: hat360Turntable 11s ease-in-out infinite alternate;
    }

    @keyframes hat360Turntable {
      0% { transform: rotateY(-28deg) rotateX(6deg); }
      50% { transform: rotateY(0deg) rotateX(-4deg) scale(1.03); }
      100% { transform: rotateY(28deg) rotateX(6deg); }
    }

    .hat-img {
      position: relative;
      z-index: 2;
      width: min(74vw, 500px);
      height: auto;
      object-fit: contain;
      filter:
        drop-shadow(2px 0 0 rgba(0, 212, 255, 0.42))
        drop-shadow(-2px 0 0 rgba(255, 45, 149, 0.42))
        drop-shadow(0 36px 44px rgba(0, 0, 0, 0.96));
      transition: transform 0.15s ease-out, filter 0.35s ease;
      pointer-events: none;
    }

    /* Blender 3D Cyan Wireframe Mesh Pass Overlay */
    .hat-wireframe-pass {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      z-index: 3;
      pointer-events: none;
      opacity: 0;
      mix-blend-mode: screen;
      filter: invert(1) brightness(1.9) sepia(1) hue-rotate(145deg) saturate(6) contrast(2.2) drop-shadow(0 0 12px #00d4ff);
      clip-path: inset(0 100% 0 0);
      transition: opacity 0.35s ease, clip-path 0.65s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .hat-levitate-wrapper.wireframe-active .hat-wireframe-pass {
      opacity: 0.78;
      clip-path: inset(0 44% 0 0);
      animation: wireframeSweep 4.2s ease-in-out infinite alternate;
    }

    @keyframes wireframeSweep {
      0% { clip-path: inset(0 65% 0 0); }
      100% { clip-path: inset(0 20% 0 0); }
    }

    .showroom-3d-controls {
      position: fixed;
      bottom: 104px;
      z-index: 255;
      display: flex;
      gap: 10px;
    }

    .showroom-3d-pill {
      background: rgba(8, 12, 24, 0.85);
      border: 1.5px solid rgba(0, 212, 255, 0.55);
      color: #b8f5ff;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.64rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 7px 15px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 0 16px rgba(0, 212, 255, 0.25);
      transition: all 0.2s ease;
    }

    .showroom-3d-pill.active,
    .showroom-3d-pill:hover {
      background: rgba(0, 212, 255, 0.22);
      border-color: #ff2d95;
      color: #ffffff;
      box-shadow: 0 0 22px rgba(255, 45, 149, 0.55);
    }

    @keyframes floatLevitate {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-22px); }
    }

    /* ── FLOATING BOTTOM HUD BAR (Ultra-Clean Borderless Dock) ────────── */
    .hud-dock {
      position: fixed;
      bottom: 32px;
      z-index: 250;
      display: flex;
      align-items: center;
      gap: 32px;
      background: rgba(10, 12, 20, 0.72);
      backdrop-filter: blur(18px);
      padding: 14px 28px;
      border-radius: 999px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85);
    }

    .hud-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .hud-kicker {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--neon-blue);
    }

    .hud-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.98rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #ffffff;
    }

    .hud-specs {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .hud-divider {
      width: 1px;
      height: 28px;
      background: rgba(255, 255, 255, 0.1);
    }

    .hud-price {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.25rem;
      font-weight: 900;
      background: linear-gradient(to right, var(--sunset-orange), var(--neon-pink));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hud-buy-btn {
      background: linear-gradient(135deg, var(--sunset-orange) 0%, var(--neon-pink) 100%);
      border: none;
      color: #000000;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.74rem;
      font-weight: 900;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 12px 24px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 45, 149, 0.45);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .hud-buy-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 28px rgba(255, 45, 149, 0.8);
    }

    @media (max-width: 768px) {
      .site-header {
        padding: 14px 20px;
      }
      .nav-center {
        display: none;
      }
      .hud-dock {
        flex-direction: column;
        gap: 12px;
        border-radius: 24px;
        padding: 16px 22px;
        width: 90vw;
        text-align: center;
      }
      .hud-divider, .hud-specs {
        display: none;
      }
    }
  </style>
  <link rel="stylesheet" href="merch_minimal.css?v=120">
  <link rel="stylesheet" href="merch_zoom.css?v=4">
  <script src="merch_zoom.js?v=100" defer></script>
</head>
<body>

  <!-- 1. MINIMAL FLOATING SITE HEADER -->
  <header class="site-header">
    <a href="index.html" class="brand-link">
      <img src="assets/logo.png" alt="Retrocanopy Logo" class="nav-logo">
      <div class="nav-wordmark">
        <span class="brand-text-base">RETROCAN</span><span class="flicker-letter">O</span><span class="brand-text-base">PY</span>
      </div>
    </a>

    <nav class="nav-center">
      <a href="index.html" class="nav-home-btn">&#8962; Home</a>
      <a href="hat_preview.html" class="active">Hats</a>
      <a href="deskmat_preview.html">Desk Mats</a>
      <a href="hoodie_preview.html">Hoodies</a>
      <a href="tee_preview.html">Tees</a>
      <a href="joggers_preview.html">Joggers</a>
      <a href="longsleeve_preview.html">Long-Sleeves</a>
      <a href="gearbag_preview.html">Misc</a>
    </nav>

    <div class="nav-right">
      <a href="index.html" class="nav-home-pill">&#8962; Home</a>
      <button class="cart-pill" id="bagBtn">Bag (0)</button>
    </div>
  </header>

  <!-- 2. CENTER-STAGE 3D HOLOGRAPHIC SHOWROOM -->
  <main class="showroom-viewport" id="stage">
    <div class="ambient-aura"></div>
    <div class="showroom-3d-floor" aria-hidden="true">
      <div class="showroom-3d-floor-horizon"></div>
      <div class="showroom-3d-floor-grid"></div>
    </div>

    <button class="glide-arrow glide-prev" onclick="stepItem(-1)" aria-label="Previous Hat">&#8592;</button>

    <div class="hat-levitate-wrapper" id="hatLevitateWrap">
      <div class="hat-3d-rotor" id="hat3dRotor">
        <img class="hat-img" id="hatImg" src="assets/merch/hat_front_floating.png?v=94" alt="Retrocanopy Floating Hat">
      </div>
    </div>

    <button class="glide-arrow glide-next" onclick="stepItem(1)" aria-label="Next Hat">&#8594;</button>
  </main>

  <!-- 3. FLOATING BOTTOM HUD DOCK -->
  <footer class="hud-stack">
    <div class="hud-selector-strip">
      <div class="mini-thumbs" id="thumbStrip"></div>
    </div>

    <div class="hud-dock">
      <div class="hud-info">
        <span class="hud-kicker" id="hudKicker">RC-101</span>
        <span class="hud-title" id="hudTitle">Classic Sunset Grid Snapback</span>
      </div>

      <div class="hud-divider"></div>

      <div class="hud-specs" id="hudSpecs">
        <span>6-Panel Structured Crown</span>
        <span>�</span>
        <span>3D Puff Front Emblem</span>
        <span>�</span>
        <span>One Size Adjustable</span>
      </div>

      <div class="hud-divider"></div>

      <div class="hud-price" id="hudPrice">$32</div>

      <button class="hud-buy-btn" onclick="addToBag(this)">Add to Bag</button>
    </div>
  </footer>

  <script>
    const hatOptions = [
      {
        model: 'RC-101',
        title: 'Classic Sunset Grid Snapback',
        price: '$32',
        specs: '<span>6-Panel Structured Crown</span><span>�</span><span>3D Puff Sunset Emblem</span><span>�</span><span>One Size Adjustable</span>',
        src: 'assets/merch/hat_front_floating.png?v=94'
      },
      {
        model: 'RC-102',
        title: 'Dual Cyan & Magenta Grid Snapback',
        price: '$32',
        specs: '<span>6-Panel Structured Crown</span><span>�</span><span>Split-Neon 3D Puff Crest</span><span>�</span><span>One Size Adjustable</span>',
        src: 'assets/merch/hat_opt2.png?v=94'
      },
      {
        model: 'RC-103',
        title: 'Outrun Wireframe Mountains Snapback',
        price: '$32',
        specs: '<span>6-Panel Structured Crown</span><span>�</span><span>Beveled Outrun Mountain Patch</span><span>�</span><span>One Size Adjustable</span>',
        src: 'assets/merch/hat_opt3.png?v=94'
      },
      {
        model: 'RC-104',
        title: 'Starry Synthwave Cosmos Snapback',
        price: '$32',
        specs: '<span>6-Panel Structured Crown</span><span>�</span><span>3D Nebula &amp; Moon Embroidery</span><span>�</span><span>One Size Adjustable</span>',
        src: 'assets/merch/hat_opt4.png?v=94'
      },
      {
        model: 'RC-105',
        title: 'Valkyrie Gold & Crimson Samurai Snapback',
        price: '$32',
        specs: '<span>6-Panel Structured Crown</span><span>�</span><span>3D Samurai Kabuto Crest</span><span>�</span><span>One Size Adjustable</span>',
        src: 'assets/merch/hat_opt5.png?v=94'
      },
      {
        model: 'RC-106',
        title: '1984 Arcade Champion Laurels Snapback',
        price: '$32',
        specs: '<span>6-Panel Structured Crown</span><span>�</span><span>3D Laurel &amp; Tree Crest</span><span>�</span><span>One Size Adjustable</span>',
        src: 'assets/merch/hat_opt6.png?v=94'
      }
    ];

    let currentIdx = 0;
    let bagCount = 0;
    const hatImg = document.getElementById('hatImg');
    const hat3dRotor = document.getElementById('hat3dRotor');
    const hatLevitateWrap = document.getElementById('hatLevitateWrap');
    const hudKicker = document.getElementById('hudKicker');
    const hudTitle = document.getElementById('hudTitle');
    const hudSpecs = document.getElementById('hudSpecs');
    const hudPrice = document.getElementById('hudPrice');
    const thumbStrip = document.getElementById('thumbStrip');
    const bagBtn = document.getElementById('bagBtn');

    function updateShowroom() {
      const item = hatOptions[currentIdx];
      hatImg.src = item.src;
      hudKicker.textContent = item.model;
      hudTitle.textContent = item.title;
      hudSpecs.innerHTML = item.specs;
      if (hudPrice) {
        hudPrice.setAttribute('data-orig-price', item.price.replace('$', ''));
        hudPrice.textContent = item.price;
      }

      if (thumbStrip) {
        thumbStrip.innerHTML = '';
        hatOptions.forEach((it, idx) => {
          const div = document.createElement('div');
          div.className = 'mini-thumb' + (idx === currentIdx ? ' active' : '');
          div.title = `${it.model} � ${it.title}`;
          div.onclick = () => {
            currentIdx = idx;
            updateShowroom();
          };
          thumbStrip.appendChild(div);
        });
      }
    }

    function stepItem(dir) {
      const len = hatOptions.length;
      currentIdx = (currentIdx + dir + len) % len;
      updateShowroom();
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') stepItem(1);
      if (e.key === 'ArrowLeft') stepItem(-1);
    });

    window.addEventListener('mousemove', (e) => {
      const x = (e.clientX / window.innerWidth - 0.5) * 2;
      const y = (e.clientY / window.innerHeight - 0.5) * 2;
      hatImg.style.transform = `rotateY(${x * 16}deg) rotateX(${-y * 10}deg)`;
    });

    function addToBag(btn) {
      bagCount++;
      bagBtn.textContent = `Bag (${bagCount})`;
      const orig = btn.textContent;
      btn.textContent = 'Added ?';
      setTimeout(() => { btn.textContent = orig; }, 900);
    }

    updateShowroom();
  </script>
</body>
</html>
