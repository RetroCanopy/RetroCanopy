<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <link rel="icon" type="image/png" href="assets/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #05040a;
      color: #fff;
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 16px 24px;
      gap: 12px;
    }
    .bar {
      width: 100%;
      max-width: 1840px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 20px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.22);
    }
    .brand-strip {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .brand-strip img {
      width: 42px;
      height: 42px;
      object-fit: contain;
      border-radius: 10px;
      background: rgba(8, 7, 16, 0.9);
      border: 1px solid rgba(245, 196, 81, 0.55);
      padding: 3px;
    }
    .bar h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.95rem;
      color: #ffae00;
      letter-spacing: 0.05em;
    }
    .bar-btns {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn {
      padding: 9px 16px;
      border-radius: 999px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.7rem;
      font-weight: 800;
      text-decoration: none;
      border: 1px solid rgba(255,255,255,0.28);
      background: rgba(255,255,255,0.1);
      color: #fff;
      cursor: pointer;
    }
    .btn.primary {
      background: linear-gradient(135deg, #00f59b, #00d4ff);
      color: #04100c;
      border: none;
    }
    .live-frame-wrap {
      width: 100%;
      max-width: 1840px;
      height: calc(100vh - 96px);
      border-radius: 20px;
      overflow: hidden;
      border: 1.5px solid rgba(245, 196, 81, 0.45);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.85);
      background: #0d0b14;
    }
    .live-frame-wrap iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="bar">
    <div class="brand-strip">

    </div>
    <div class="bar-btns">
      <a class="btn primary" href="admin.html">Open Direct Owner's Hub (admin.html) &rarr;</a>
      <a class="btn" href="owners_hub_concepts.html">&larr; All 20 Concepts</a>

  </div>
  <div class="live-frame-wrap">
    <iframe src="admin.html?v=209" title="RetroCanopy Owner's Hub Concept #2 Live"></iframe>
  </div>
