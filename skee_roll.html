<script>
(() => {
'use strict';

// Mark internal navigation so returning to index.html / games.html is seamless
try {
  sessionStorage.setItem('rc_intro_seen', '1');
  sessionStorage.setItem('rc_from_internal', '1');
} catch (_) {}

/* ============================================================================
   1. EXACT CALIBRATED COORDINATE SYSTEM (Matches skee_roll_84_bg_clean.jpg 1376x768)
   ============================================================================ */
const CW = 1376, CH = 768;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// Load clean high-resolution 1984 Tokyo Arcade cabinet plate (1376 x 768)
const bgImg = new Image();
let bgLoaded = false;
bgImg.onload = () => { bgLoaded = true; };
bgImg.src = 'assets/concept_gallery/skee_roll_84_bg_clean.jpg?v=2';

/* ============================================================================
   2. 3D PHYSICS & PERSPECTIVE CALIBRATED TO THE ARTWORK RINGS & WOOD LANE
   ============================================================================
   World units (meters):
   - X: lateral (-LH .. +LH), where 0 is centerline X = 688 px
   - Z: depth along alley:
       Z0 = 0.25m (ball release point -> screen Y = 528)
       HZ0 = 2.55m (launch ramp lip -> screen Y = 408)
       ZP = 2.62m (target board base -> screen Y = 402)
       Target board inclined at PH = 31 deg from ZP to Z_TOP
*/
const LH = 0.285;              // Lane inner half-width
const RB = 0.044;              // Ball radius
const Z0 = 0.25;               // Ball spawn depth
const HZ0 = 2.40;              // Ramp curve start
const ZP = 2.62;               // Ramp lip / Board base
const RAMP_H = 0.068;          // Ramp height rise
const PH = 31 * Math.PI / 180; // Board tilt angle
const CPH = Math.cos(PH), SPH = Math.sin(PH);
const BL = 1.18;               // Board length in board-space v
const G = 9.81;
const BALLS = 9;
const DT = 1 / 240;

// Target Board Pockets & Concentric Rings (board coordinates u, v in meters)
// Mapped so P(x,y,z) projects onto the exact glowing neon rings of skee_roll_84_bg_clean.jpg!
const RINGS = [
  { s: 100, col: '#ff4fd8', label: '100', cx: 0, cy: 0.905, rx: 0.092, ry: 0.064, holeY: 0.905, holeR: 0.068 },
  { s: 50,  col: '#29e6ff', label: '50',  cx: 0, cy: 0.770, rx: 0.098, ry: 0.064, holeY: 0.770, holeR: 0.068 },
  { s: 40,  col: '#ff3ad8', label: '40',  cx: 0, cy: 0.625, rx: 0.112, ry: 0.068, holeY: 0.625, holeR: 0.068 },
  { s: 30,  col: '#29e6ff', label: '30',  cx: 0, cy: 0.565, rx: 0.185, ry: 0.175, holeY: 0.465, holeR: 0.068 },
  { s: 20,  col: '#7b68ff', label: '20',  cx: 0, cy: 0.525, rx: 0.315, ry: 0.305, holeY: 0.318, holeR: 0.072 },
  { s: 10,  col: '#ff2fd0', label: '10',  cx: 0, cy: 0.485, rx: 0.445, ry: 0.425, holeY: 0.145, holeR: 0.076 }
];

// Upper-Left and Upper-Right 100 Gold Jackpot Corner Cups
const CUPS = [
  { u: -0.325, v: 0.945, r: 0.086, s: 100, col: '#ffd23a', label: 'L-100' },
  { u:  0.325, v: 0.945, r: 0.086, s: 100, col: '#ffd23a', label: 'R-100' }
];

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;

function surf(z) {
  if (z <= HZ0) return 0;
  const u = clamp((z - HZ0) / (ZP - HZ0), 0, 1);
  // True upward-curving parabolic ski-jump ramp (steepest at the lip z = ZP)
  return RAMP_H * u * u;
}
function dsurf(z) {
  if (z <= HZ0 || z > ZP) return 0;
  const L = ZP - HZ0, u = clamp((z - HZ0) / L, 0, 1);
  return 2 * RAMP_H * u / L;
}
function BW(u, v, h = 0) {
  return [
    u,
    RAMP_H + v * SPH + h * CPH,
    ZP + v * CPH - h * SPH
  ];
}
function bc(b) {
  const dy = b.y - RAMP_H, dz = b.z - ZP;
  return {
    u: b.x,
    v: dy * SPH + dz * CPH,
    h: dy * CPH - dz * SPH,
    vu: b.vx,
    vv: b.vy * SPH + b.vz * CPH,
    vh: b.vy * CPH - b.vz * SPH
  };
}
function setB(b, u, v, h, vu, vv, vh) {
  b.x = u;
  b.y = RAMP_H + v * SPH + h * CPH;
  b.z = ZP + v * CPH - h * SPH;
  b.vx = vu;
  b.vy = vv * SPH + vh * CPH;
  b.vz = vv * CPH - vh * SPH;
}

/* Seamless C1-Continuous 3D -> 1376x768 Artwork Projection
   Matches:
   - Lane bottom (z = -0.35) -> y = 665, half-width = 503px
   - Ball spawn (z = 0.25) -> y = 528, half-width = 335px
   - Ramp lip (z = 2.62, y = RAMP_H) -> y = 400, scaleX = 392 (zero seam between lane & board!)
   - Board rings (v = 0.145..0.945) -> y = 372..212
*/
function P(x, y, z) {
  if (z <= ZP) {
    // Lane & Ramp perspective projection anchored so z=ZP, y=RAMP_H lands at (688 + x*392, 400)
    const u = clamp((z - (-0.35)) / (ZP - (-0.35)), -0.25, 1.0);
    const k = 1 / (1 + 3.495 * Math.max(0, u));
    const syBase = 324.2 + (665 - 324.2) * k; // syBase(u=0)=665, syBase(u=1)=400.0
    const scaleX = (503 * k) / LH;            // scaleX(u=1) = 392.4
    const dh = Math.max(0, y - surf(z));
    const liftY = dh * lerp(scaleX * 0.82, 260, clamp(u, 0, 1));
    return {
      x: 688 + x * scaleX,
      y: syBase - liftY,
      s: scaleX
    };
  }
  // Above/beyond ramp lip -> Board projection matching artwork target bowl seamlessly from (688, 400)
  const dy = y - RAMP_H, dz = z - ZP;
  const v = dy * SPH + dz * CPH;
  const h = Math.max(0, dy * CPH - dz * SPH);
  const sy = 400 - v * 196 - h * 260;
  const scaleX = lerp(392.4, 274, clamp(v / 1.0, 0, 1.2));
  return {
    x: 688 + x * scaleX,
    y: sy,
    s: scaleX * 0.85
  };
}

// Convert client pointer X/Y into canvas (1376x768) coordinates
function clientToCanvas(clientX, clientY) {
  const rect = cv.getBoundingClientRect();
  return {
    x: (clientX - rect.left) * (CW / Math.max(1, rect.width)),
    y: (clientY - rect.top) * (CH / Math.max(1, rect.height))
  };
}

function laneXAtClient(clientX) {
  const pt = clientToCanvas(clientX, 0);
  const p0 = P(0, RB, Z0);
  return (pt.x - 688) / p0.s;
}

/* ============================================================================
   3. SYNTHWAVE WEB AUDIO ENGINE (Multi-Layered FM Chimes, Roll Rumble & Fanfare)
   ============================================================================ */
const Snd = (() => {
  let ac = null, muted = false, rollGain = null, rollFilter = null;
  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
    // Filtered wood-alley rolling rumble
    const buf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const d = buf.getChannelData(0);
    let b0 = 0, b1 = 0, b2 = 0;
    for (let i = 0; i < d.length; i++) {
      const w = Math.random() * 2 - 1;
      b0 = 0.99 * b0 + w * 0.05;
      b1 = 0.96 * b1 + w * 0.12;
      b2 = 0.85 * b2 + w * 0.22;
      d[i] = (b0 + b1 + b2) * 0.3;
    }
    const src = ac.createBufferSource();
    src.buffer = buf; src.loop = true;
    rollFilter = ac.createBiquadFilter();
    rollFilter.type = 'bandpass';
    rollFilter.frequency.value = 165;
    rollFilter.Q.value = 2.4;
    rollGain = ac.createGain();
    rollGain.gain.value = 0;
    src.connect(rollFilter).connect(rollGain).connect(ac.destination);
    src.start();
  }
  function setMute(m) {
    muted = m;
    if (rollGain && ac) rollGain.gain.setTargetAtTime(0, ac.currentTime, 0.03);
  }
  function roll(speedNorm) {
    if (!ac || muted) return;
    const t = ac.currentTime;
    const g = clamp(speedNorm, 0, 1) * 0.22;
    rollFilter.frequency.setTargetAtTime(110 + clamp(speedNorm, 0, 1.3) * 210, t, 0.03);
    rollGain.gain.setTargetAtTime(g, t, 0.025);
  }
  function tone(freq, dur, type = 'sine', gain = 0.14, delay = 0, slideTo = 0) {
    if (!ac || muted) return;
    const t = ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slideTo > 0) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(gain, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(ac.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function hit(g = 0.14, f = 220) {
    tone(f, 0.06, 'triangle', clamp(g, 0.03, 0.25), 0, f * 0.55);
  }
  function launchWhoosh() {
    tone(140, 0.16, 'sine', 0.14, 0, 320);
  }
  function score(pts, mult = 1) {
    if (pts <= 0) {
      tone(140, 0.22, 'sawtooth', 0.08, 0, 82);
      return;
    }
    const base = pts >= 100 ? [523.25, 659.25, 783.99, 1046.5, 1318.5]
               : pts >= 50  ? [440, 554.37, 659.25, 880]
               : pts >= 30  ? [392, 493.88, 587.33]
                            : [329.63, 440];
    base.forEach((f, i) => {
      tone(f * (mult > 1 ? 1.06 : 1), 0.26, 'triangle', 0.15, i * 0.055);
      if (pts >= 50) tone(f * 2, 0.22, 'sine', 0.07, i * 0.055 + 0.015);
    });
  }
  function tick() {
    tone(1480, 0.035, 'square', 0.055, 0, 1960);
  }
  return { init, setMute, get muted() { return muted; }, roll, hit, launchWhoosh, score, tick };
})();

/* ============================================================================
   4. AUTHENTIC 3D SKEE-BALL PHYSICS (Parabolic Ski-Jump, Curved Backboard & Rims)
   ============================================================================ */
function makeBall(v0, ang, x0 = 0, spin = 0) {
  const cleanV0 = clamp(v0, 3.85, 8.6);
  const cleanAng = clamp(ang, -0.28, 0.28);
  return {
    st: 'lane',
    x: clamp(x0, -(LH - RB - 0.015), LH - RB - 0.015),
    y: RB,
    z: Z0,
    // Controlled lateral travel down the narrow wood lane so angled shots clear the rails cleanly
    vx: cleanV0 * Math.sin(cleanAng) * 0.35,
    vy: 0,
    vz: cleanV0 * Math.cos(cleanAng),
    ang: cleanAng,
    spin: clamp(spin, -1, 1), // Lateral curve hook ("English")
    t: 0,
    boardT: 0,
    done: false,
    pts: 0,
    kind: null,
    targetLabel: '',
    contact: true,
    rotP: 0,
    rotY: 0
  };
}

function findEnclosingRing(u, v) {
  for (const C of CUPS) {
    if (Math.hypot(u - C.u, v - C.v) <= C.r * 1.45) {
      return { kind: 'cup', target: C, pts: C.s, label: C.label, col: C.col, cx: C.u, cy: C.v, hr: C.r };
    }
  }
  if (v > 0.80 && Math.abs(u) > 0.17) {
    const C = u < 0 ? CUPS[0] : CUPS[1];
    return { kind: 'cup', target: C, pts: C.s, label: C.label, col: C.col, cx: C.u, cy: C.v, hr: C.r };
  }
  for (const R of RINGS) {
    const eDist = Math.hypot((u - R.cx) / R.rx, (v - R.cy) / R.ry);
    if (eDist <= 1.04) {
      return { kind: 'ring', target: R, pts: R.s, label: R.label, col: R.col, cx: R.cx, cy: R.holeY, hr: R.holeR };
    }
  }
  const R10 = RINGS[RINGS.length - 1];
  return { kind: 'ring', target: R10, pts: 10, label: '10', col: R10.col, cx: 0, cy: R10.holeY, hr: R10.holeR };
}

function classifyLandingRing(u, v) {
  return findEnclosingRing(u, v);
}

function stepBall(b, dt, onEvt) {
  if (b.done) return;
  b.t += dt;
  const spd = Math.hypot(b.vx, b.vy, b.vz);
  b.rotP += (spd / RB) * dt;
  b.rotY += b.spin * 9 * dt;

  if (b.st === 'lane') {
    const s = dsurf(b.z), c = 1 / Math.hypot(1, s);
    const ax = b.spin * 0.12;
    const az = -G * s * c * 0.45 - 0.02 * b.vz;
    b.vx += ax * dt;
    b.vz += az * dt;
    if (b.vz < 2.2) b.vz = 2.2;
    b.x += b.vx * dt;
    b.z += b.vz * dt;
    b.y = surf(b.z) + RB;

    const wall = LH - RB;
    if (b.x < -wall) { b.x = -wall; b.vx = -b.vx * 0.52; onEvt && onEvt('rail', Math.abs(b.vx)); }
    if (b.x >  wall) { b.x =  wall; b.vx = -b.vx * 0.52; onEvt && onEvt('rail', Math.abs(b.vx)); }

    if (b.z >= ZP) {
      // True parabolic ski-jump launch off the ramp lip (25 deg above the 31 deg target board!)
      // Carries the ball's aimed angle (b.ang) out across the full width of the target board!
      const sp = b.vz * 0.525;
      const launchPitch = PH + (25 * Math.PI / 180);
      b.vx = sp * Math.sin(b.ang) * 1.45 + b.spin * 0.22;
      b.vy = sp * Math.sin(launchPitch);
      b.vz = sp * Math.cos(launchPitch);
      b.y = RAMP_H + RB * CPH;
      b.z = ZP - RB * SPH;
      b.st = 'board';
      b.contact = false;
      b.boardT = 0;
      onEvt && onEvt('launch', sp);
    }
    return;
  }

  // Board / Airborne state
  b.boardT += dt;
  const prevC = bc(b);
  b.vx += b.spin * (b.contact ? 0.25 : 0.55) * dt;
  b.vy -= G * dt;
  b.x += b.vx * dt;
  b.y += b.vy * dt;
  b.z += b.vz * dt;

  let c = bc(b);
  let { u, v, h, vu, vv, vh } = c;

  // Curved Padded Top Backboard Arch & Side Arena Walls (encloses L-100, 100, and R-100 cleanly)
  const bw = 0.425;
  if (u < -bw) { u = -bw; vu = Math.abs(vu) * 0.42; onEvt && onEvt('wall', vu); }
  if (u >  bw) { u =  bw; vu = -Math.abs(vu) * 0.42; onEvt && onEvt('wall', -vu); }
  const topV = 1.035 - 0.28 * (u * u);
  if (v > topV) {
    v = topV;
    let nx = 0.56 * u, nv = 1.0;
    const nl = Math.hypot(nx, nv) || 1;
    nx /= nl; nv /= nl;
    const vn = vu * nx + vv * nv;
    if (vn > 0) {
      vu -= (1 + 0.35) * vn * nx;
      vv -= (1 + 0.35) * vn * nv;
      onEvt && onEvt('wall', vn);
    }
  }

  // Board floor contact, 3D ring catch-cup rim deflections & physical roll into pocket holes
  if (h <= RB) {
    if (!b.contact && vh < -0.20) {
      // First board impact absorbs excess skid and bounces realistically
      vu *= 0.68;
      vv *= 0.62;
      onEvt && onEvt('land', -vh);
    }
    h = RB;
    vh = vh < -0.25 ? -vh * 0.28 : 0;
    b.contact = true;

    // Lower board lip barrier
    const botV = 0.06 + 0.25 * (u * u);
    if (v < botV) {
      v = botV;
      vv = Math.abs(vv) * 0.35;
    }

    const enc = findEnclosingRing(u, v);
    if (enc.kind === 'ring') {
      const R = enc.target;
      const prevEDist = Math.hypot((prevC.u - R.cx) / R.rx, (prevC.v - R.cy) / R.ry);
      const currEDist = Math.hypot((u - R.cx) / R.rx, (v - R.cy) / R.ry);
      // Lower cradle of the active ring catches the ball and curves it physically toward its pocket hole
      if (prevEDist <= 1.02 && currEDist > 0.985 && v <= R.cy + R.ry * 0.25) {
        let nx = (u - R.cx) / (R.rx * R.rx);
        let nv = (v - R.cy) / (R.ry * R.ry);
        const nl = Math.hypot(nx, nv) || 1;
        nx /= nl; nv /= nl;
        const angE = Math.atan2((v - R.cy) / R.ry, (u - R.cx) / R.rx);
        u = R.cx + Math.cos(angE) * R.rx * 0.982;
        v = R.cy + Math.sin(angE) * R.ry * 0.982;
        const vn = vu * nx + vv * nv;
        if (vn > 0) {
          vu -= (1 + 0.32) * vn * nx;
          vv -= (1 + 0.32) * vn * nv;
          if (Math.abs(vn) > 0.22) onEvt && onEvt('rim', Math.abs(vn));
        }
      }
    }

    // Dished ring trough + downhill gravity guiding the ball physically into the hole (zero teleporting!)
    const tx = enc.cx, ty = enc.cy, hr = enc.hr;
    const du = tx - u, dv = ty - v;
    const dist = Math.hypot(du, dv);

    const gravV = v > ty ? -2.8 : 1.8;
    vv += gravV * dt;
    const pull = 4.2 + (1 - Math.min(1, dist / 0.25)) * 5.0;
    vu += (du / (dist + 1e-4)) * pull * dt;
    vv += (dv / (dist + 1e-4)) * pull * dt;
    vu -= vu * 2.2 * dt;
    vv -= vv * 2.0 * dt;

    // Score only when the ball physically rolls right over the pocket opening!
    if (dist < hr * 0.45 && Math.hypot(vu, vv) < 1.95) {
      const w = BW(u, v, RB * 0.25);
      b.x = w[0]; b.y = w[1]; b.z = w[2];
      b.done = true;
      b.pts = enc.pts;
      b.kind = enc.kind === 'cup' ? 'cup' : 'hole';
      b.targetLabel = enc.label;
      onEvt && onEvt('score', enc.pts);
      return;
    }
  } else {
    b.contact = false;
  }

  setB(b, u, v, h, vu, vv, vh);

  // Fallback safety if ball ever exceeds 4.5s
  if (b.t > 4.5) {
    const enc = findEnclosingRing(u, v);
    const w = BW(u, v, RB * 0.25);
    b.x = w[0]; b.y = w[1]; b.z = w[2];
    b.done = true; b.pts = enc.pts; b.kind = 'hole'; b.targetLabel = enc.label;
    onEvt && onEvt('score', enc.pts);
  }
}

function simulate(v0, ang = 0, x0 = 0, spin = 0) {
  const b = makeBall(v0, ang, x0, spin);
  let steps = 0;
  while (!b.done && steps < 240 * 5) { stepBall(b, DT, null); steps++; }
  return { pts: b.pts, kind: b.kind, label: b.targetLabel, t: b.t, x: b.x, y: b.y, z: b.z };
}

// Sub-frame interpolated, arc-length resampled 3D trajectory predictor (zero frame-jump!)
function predictTrajectory(v0, ang, x0, spin, zStart = Z0) {
  const b = makeBall(v0, ang, x0, spin);
  b.z = zStart;
  b.y = surf(Math.max(0, zStart)) + RB;

  const rawPts = [{ x: b.x, y: b.y, z: b.z }];
  let prevX = b.x, prevY = b.y, prevZ = b.z, prevH = RB;
  let landU = b.x, landV = 0.5;

  for (let i = 0; i < 360 && !b.done; i++) {
    prevX = b.x; prevY = b.y; prevZ = b.z;
    if (b.st === 'board') prevH = bc(b).h;

    stepBall(b, DT, null);

    if (b.st === 'board') {
      const curC = bc(b);
      if (b.contact || (curC.h <= RB && curC.vh <= 0)) {
        // Exact sub-step linear interpolation where airborne ball touches h === RB
        const denom = Math.max(1e-6, prevH - curC.h);
        const frac = clamp((prevH - RB) / denom, 0, 1);
        const lx = lerp(prevX, b.x, frac);
        const ly = lerp(prevY, b.y, frac);
        const lz = lerp(prevZ, b.z, frac);
        rawPts.push({ x: lx, y: ly, z: lz });
        const dy = ly - RAMP_H, dz = lz - ZP;
        landU = lx;
        landV = dy * SPH + dz * CPH;
        break;
      }
    }
    rawPts.push({ x: b.x, y: b.y, z: b.z });
  }

  // Uniform arc-length resampling into 24 smooth points so dots never hop or bunch up
  const cumLen = [0];
  for (let i = 1; i < rawPts.length; i++) {
    const a = rawPts[i - 1], c = rawPts[i];
    cumLen.push(cumLen[i - 1] + Math.hypot(c.x - a.x, c.y - a.y, c.z - a.z));
  }
  const totalLen = cumLen[cumLen.length - 1] || 1e-4;
  const N = 22;
  const pts = [];
  let idx = 0;
  for (let k = 0; k <= N; k++) {
    const targetD = (k / N) * totalLen;
    while (idx < cumLen.length - 2 && cumLen[idx + 1] < targetD) idx++;
    const segLen = Math.max(1e-6, cumLen[idx + 1] - cumLen[idx]);
    const t = clamp((targetD - cumLen[idx]) / segLen, 0, 1);
    const p0 = rawPts[idx], p1 = rawPts[idx + 1];
    pts.push({
      x: lerp(p0.x, p1.x, t),
      y: lerp(p0.y, p1.y, t),
      z: lerp(p0.z, p1.z, t)
    });
  }

  const targetRing = classifyLandingRing(landU, landV);
  return { pts, end: pts[pts.length - 1], targetRing };
}

/* ============================================================================
   5. RETROCANOPY WALLET, XP & SUPABASE SYNC
   ============================================================================ */
const BEST_KEY = 'rc_skee_best_v1';
const XP_KEY = 'rc_canopy_xp';
const SPENT_KEY = 'rc_tickets_spent_v1';

let bestScore = Math.max(0, parseInt(localStorage.getItem(BEST_KEY) || '0', 10) || 0);
function getAvailableWalletTickets() {
  const xp = Math.max(0, parseInt(localStorage.getItem(XP_KEY) || '0', 10) || 0);
  const flightBest = Math.max(0, parseInt(localStorage.getItem('rc_synth_flight_best') || '0', 10) || 0);
  const spent = Math.max(0, parseInt(localStorage.getItem(SPENT_KEY) || '0', 10) || 0);
  return Math.max(0, Math.floor(Math.max(xp, flightBest) / 10) - spent);
}
let walletTickets = getAvailableWalletTickets();

function awardPointsAndTickets(ptsEarned) {
  if (ptsEarned <= 0) return;
  try {
    const prevXp = Math.max(0, parseInt(localStorage.getItem(XP_KEY) || '0', 10) || 0);
    const nextXp = prevXp + ptsEarned;
    localStorage.setItem(XP_KEY, String(nextXp));

    // Also update active customer account in rc_accounts_db_v2 & Supabase if logged in
    const curUser = (localStorage.getItem('rc_current_user_v1') || '').trim();
    if (curUser) {
      const dbRaw = JSON.parse(localStorage.getItem('rc_accounts_db_v2') || '{}') || {};
      const k = curUser.toLowerCase();
      if (dbRaw[k]) {
        dbRaw[k].xp = Math.max(dbRaw[k].xp || 0, nextXp);
        dbRaw[k].bestScore = Math.max(dbRaw[k].bestScore || 0, S.score);
        dbRaw[k].updatedAt = new Date().toISOString();
        localStorage.setItem('rc_accounts_db_v2', JSON.stringify(dbRaw));
      }
      const client = window.db || (typeof db !== 'undefined' ? db : null);
      if (client && dbRaw[k]) {
        client.from('arcade_accounts').upsert([{
          username_key: k,
          username: dbRaw[k].username || curUser,
          xp: dbRaw[k].xp,
          best_score: dbRaw[k].bestScore,
          updated_at: new Date().toISOString()
        }], { onConflict: 'username_key' }).then(() => {}).catch(() => {});
      }
    }
  } catch (_) {}
  walletTickets = getAvailableWalletTickets();
}

function spawnFireworks(x, y, col, count = 34) {
  for (let i = 0; i < count; i++) {
    const a = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.3;
    const sp = 90 + Math.random() * 260;
    S.particles.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 60,
      r: 2.5 + Math.random() * 3.5,
      col: i % 3 === 0 ? '#ffffff' : (i % 2 === 0 ? col : '#ffd23a'),
      life: 0,
      maxLife: 0.55 + Math.random() * 0.45
    });
  }
  S.shockwaves.push({ x, y, col, t: 0, maxR: 95 });
}

function onEvent(type, val) {
  if (type === 'rail' || type === 'wall') Snd.hit(val * 0.08, 190);
  else if (type === 'rim') Snd.hit(val * 0.11, 520);
  else if (type === 'land') Snd.hit(val * 0.09, 150);
  else if (type === 'launch') Snd.launchWhoosh();
  else if (type === 'score') {
    const b = S.ball;
    const basePts = b.pts;
    const isBonusHit = (b.targetLabel === S.bonusTarget);

    // Update Hot Streak Multiplier (40+ pts builds streak: 1x -> 2x -> 3x Fireball!)
    if (basePts >= 40) {
      S.streak++;
      S.mult = S.streak >= 3 ? 3 : (S.streak >= 2 ? 2 : 1);
      S.maxMult = Math.max(S.maxMult, S.mult);
    } else {
      S.streak = 0;
      S.mult = 1;
    }

    const totalMult = S.mult * (isBonusHit ? 2 : 1);
    const finalPts = basePts * totalMult;

    S.score += finalPts;
    S.results.push(finalPts);
    const totalTix = Math.floor(S.score / 100);
    const newTix = totalTix - S.dispTarget;
    S.dispTarget = totalTix;
    if (newTix > 0) {
      S.ticketPulse = 1.0;
      // 1 wallet ticket = 10 XP in rc_canopy_xp, so each ticket earned (1 per 100 pts) adds 10 XP
      awardPointsAndTickets(newTix * 10);
    }
    Snd.score(basePts, totalMult);

    const p = P(b.x, b.y, b.z);
    const col = basePts >= 100 ? '#ffd23a' : basePts >= 50 ? '#00f0ff' : '#ff3ad8';
    spawnFireworks(p.x, p.y, col, basePts >= 100 ? 52 : 30);

    const tag = totalMult > 1 ? `+${finalPts} (${totalMult}X!)` : `+${finalPts}`;
    S.popups.push({
      x: p.x,
      y: p.y - 12,
      txt: isBonusHit ? `⚡ BONUS ${tag}` : (basePts >= 100 ? `★ JACKPOT ${tag} ★` : tag),
      col,
      t: 0,
      big: basePts >= 50 || totalMult > 1
    });

    S.flash = { label: b.targetLabel, pts: basePts, col, t: 0 };
    S.capture = { x: b.x, y: b.y, z: b.z, t: 0, pts: basePts };
    S.state = 'scored';
    S.wait = 0.85;
  }
}

function launch(v0, ang) {
  if (S.state !== 'ready') return;
  S.ball = makeBall(v0, ang, S.aimX, S.spin);
  S.state = 'rolling';
  S.trail = [];
  S.charging = false;
}

function nextBall() {
  S.ball = null;
  S.capture = null;
  S.ballIdx++;
  if (S.ballIdx >= BALLS) endGame();
  else {
    S.state = 'ready';
    S.rollIn = 0;
    pickNextBonusTarget();
  }
}

function endGame() {
  S.state = 'over';
  S.overT = 0;
  Snd.roll(0);
  if (S.score > bestScore) {
    bestScore = S.score;
    try { localStorage.setItem(BEST_KEY, String(bestScore)); } catch (_) {}
  }
  walletTickets = getAvailableWalletTickets();
}

function showResults() {
  document.getElementById('mTitle').textContent =
    S.score >= 600 ? 'NEO-TOKYO GRANDMASTER!' :
    S.score >= 350 ? 'HIGH ROLLER JACKPOT!' :
    S.score >= 200 ? 'SHINJUKU SHARP SHOOTER' : 'FRAME COMPLETE';
  document.getElementById('mScore').textContent = S.score;
  document.getElementById('mRank').textContent = `PEAK STREAK: ${S.maxMult}X FIREBALL`;
  document.getElementById('mTix').textContent = `+${S.dispTarget} 🎟️`;
  document.getElementById('mBest').textContent = bestScore;
  document.getElementById('mWal').textContent = `🎟️ ${walletTickets.toLocaleString()}`;

  const grid = document.getElementById('mBallsGrid');
  grid.innerHTML = '';
  for (let i = 0; i < BALLS; i++) {
    const pts = S.results[i] ?? 0;
    const d = document.createElement('div');

    d.textContent = pts;
    grid.appendChild(d);
  }
  document.getElementById('modal').classList.add('show');
}

// Smooth Canvas Pull-Back-to-Shoot (Power & Angle, No Aim Lock) & Flick-Up-to-Roll
let drag = null;
function calcPullMetrics(startX, startY, clientX, clientY) {
  const refH = Math.max(320, cv.getBoundingClientRect().height);
  const pullBackPx = Math.max(0, clientY - startY);
  const maxPullPx = Math.max(90, Math.min(185, refH * 0.24));
  const isPullingBack = pullBackPx >= 8;
  const pullPower = isPullingBack
    ? clamp((pullBackPx - 6) / Math.max(24, maxPullPx - 6), 0.08, 1.0)
    : 0;
  const targetAimX = clamp(laneXAtClient(clientX), -(LH - RB - 0.015), LH - RB - 0.015);
  // Pulling back at an angle sets the launch angle freely without any aim lock
  const dxPx = clientX - startX;
  const dyPx = Math.max(35, pullBackPx);
  const slingAng = Math.atan2(-dxPx, dyPx) * 0.48;
  const pullAng = isPullingBack
    ? clamp(S.aimAng + slingAng, -0.26, 0.26)
    : S.aimAng;
  return { refH, pullBackPx, isPullingBack, pullPower, targetAimX, pullAng };
}

cv.addEventListener('pointerdown', e => {
  Snd.init();
  if (S.resultsShown) return;
  if (S.state !== 'ready' || S.charging) return;
  cv.setPointerCapture(e.pointerId);
  cv.classList.add('drag');
  const startX = clamp(laneXAtClient(e.clientX), -(LH - RB - 0.015), LH - RB - 0.015);
  S.aimX = startX;
  drag = {
    id: e.pointerId,
    startX: e.clientX,
    startY: e.clientY,
    curX: e.clientX,
    curY: e.clientY,
    pullBackPx: 0,
    pullPower: 0,
    pullAng: S.aimAng,
    pts: [{ t: performance.now(), x: e.clientX, y: e.clientY }]
  };
});

cv.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const now = performance.now();
  drag.curX = e.clientX;
  drag.curY = e.clientY;
  drag.pts.push({ t: now, x: e.clientX, y: e.clientY });
  while (drag.pts.length > 2 && now - drag.pts[0].t > 150) drag.pts.shift();

  const pm = calcPullMetrics(drag.startX, drag.startY, e.clientX, e.clientY);
  drag.pullBackPx = pm.pullBackPx;
  drag.pullPower = pm.pullPower;
  drag.pullAng = pm.pullAng;

  if (S.state === 'ready') {
    S.aimX = pm.targetAimX;
  }
});

function flickVel(now) {
  if (!drag) return null;
  const pts = drag.pts.filter(p => now - p.t < 120);
  if (pts.length < 2) return { vx: 0, vy: 0 };
  const a = pts[0], b = pts[pts.length - 1];
  const dt = Math.max(10, b.t - a.t) / 1000;
  return { vx: (b.x - a.x) / dt, vy: (b.y - a.y) / dt };
}

function endDrag(e) {
  if (!drag || e.pointerId !== drag.id) return;
  const now = performance.now();
  drag.pts.push({ t: now, x: e.clientX, y: e.clientY });
  const v = flickVel(now);
  const totalDy = drag.startY - e.clientY;
  const totalDx = e.clientX - drag.startX;
  const pm = calcPullMetrics(drag.startX, drag.startY, e.clientX, e.clientY);
  drag = null;
  cv.classList.remove('drag');

  // Mode 1: Pull-Back Release
  if (pm.isPullingBack && pm.pullPower > 0) {
    const v0 = lerp(4.1, 8.2, pm.pullPower);
    launch(v0, pm.pullAng);
    return;
  }

  // Mode 2: Upward Swipe / Flick
  if (!v) return;
  const refH = pm.refH;
  const upSpeed = -v.vy;
  if (upSpeed < refH * 0.22 && totalDy < 35) {
    S.hintT = 1.6;
    return;
  }
  const norm = clamp(Math.max(upSpeed / (refH * 1.65), totalDy / (refH * 0.52)), 0.15, 1.0);
  const v0 = lerp(4.2, 8.15, norm);
  const ang = clamp(S.aimAng + Math.atan2(v.vx * 0.55 + totalDx * 2.5, Math.max(160, upSpeed)) * 0.42, -0.26, 0.26);
  launch(v0, ang);
}
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', e => {
  if (drag && e.pointerId === drag.id) { drag = null; cv.classList.remove('drag'); }
});

function chargePower() {
  const p = (S.chargeT / 0.95) % 2;

}

/* ============================================================================
   8. UPDATE LOOP
   ============================================================================ */
function update(dt) {
  S.time += dt;
  if (S.ticketPulse > 0) S.ticketPulse = Math.max(0, S.ticketPulse - dt * 1.4);

  if (S.state === 'ready') {
    S.rollIn = Math.min(1, S.rollIn + dt / 0.35);
    const moveDir = (keys.ArrowLeft || keys.KeyA ? -1 : 0) + (keys.ArrowRight || keys.KeyD ? 1 : 0);
    if (moveDir) {
      if (keys.ShiftLeft || keys.ShiftRight) {
        S.aimAng = clamp(S.aimAng + moveDir * dt * 0.18, -0.16, 0.16);
      } else {
        S.aimX = clamp(S.aimX + moveDir * dt * 0.32, -(LH - RB - 0.015), LH - RB - 0.015);
      }
    }
    if (S.charging) S.chargeT += dt;

    // Frame-rate independent exponential smoothing for the 3D trajectory guide (zero jitter!)
    const targetPwr = S.charging
      ? chargePower()
      : (drag && drag.pullBackPx >= 8 && drag.pullPower > 0)
        ? drag.pullPower
        : S.defaultPower;
    const targetAng = (drag && drag.pullBackPx >= 8) ? drag.pullAng : S.aimAng;
    const kSmooth = 1 - Math.exp(-dt * 24);
    S.smoothAimX = lerp(S.smoothAimX, S.aimX, kSmooth);
    S.smoothAng  = lerp(S.smoothAng, targetAng, kSmooth);
    S.smoothPwr  = lerp(S.smoothPwr, targetPwr, kSmooth);
  }

  if (S.state === 'rolling' && S.ball) {
    S.acc = (S.acc || 0) + Math.min(dt, 0.08);
    while (S.acc >= DT && S.state === 'rolling') {
      stepBall(S.ball, DT, onEvent);
      S.acc -= DT;
    }
    if (S.ball) {
      const b = S.ball;
      S.trail.push({ x: b.x, y: b.y, z: b.z, mult: S.mult });
      if (S.trail.length > 28) S.trail.shift();
      const sp = Math.hypot(b.vx, b.vy, b.vz);
      Snd.roll(b.st === 'lane' ? sp / 6.2 : (b.contact ? (sp / 4.5) * 0.65 : 0));
    }
  } else {
    Snd.roll(0);
    if (S.trail.length) S.trail.shift();
  }

  if (S.state === 'scored') {
    S.wait -= dt;
    if (S.capture) S.capture.t += dt;
    if (S.wait <= 0) nextBall();
  }

  if (S.flash) {
    S.flash.t += dt;
    if (S.flash.t > 1.1) S.flash = null;
  }

  // Animated ticket counter & dispenser chime
  if (S.dispShown < S.dispTarget) {
    const rate = Math.max(12, (S.dispTarget - S.dispShown) * 2.2);
    S.dispF += rate * dt;
    while (S.dispF >= 1 && S.dispShown < S.dispTarget) {
      S.dispF -= 1;
      S.dispShown++;
      Snd.tick();
    }
  } else {
    S.dispF = 0;
  }

  if (S.state === 'over') {
    S.overT += dt;
    if (!S.resultsShown && S.dispShown >= S.dispTarget && S.overT > 1.1) {
      S.resultsShown = true;
      showResults();
    }
  }

  // Update particles & shockwaves
  for (let i = S.particles.length - 1; i >= 0; i--) {
    const pt = S.particles[i];
    pt.life += dt;
    pt.x += pt.vx * dt;
    pt.y += pt.vy * dt;
    pt.vy += 420 * dt;
    if (pt.life >= pt.maxLife) S.particles.splice(i, 1);
  }
  for (let i = S.shockwaves.length - 1; i >= 0; i--) {
    S.shockwaves[i].t += dt;
    if (S.shockwaves[i].t > 0.65) S.shockwaves.splice(i, 1);
  }
  S.popups.forEach(p => p.t += dt);
  S.popups = S.popups.filter(p => p.t < 1.35);
  if (S.hintT > 0) S.hintT -= dt;
}

// Artwork Ring Pixel Overlay Table (matches skee_roll_84_bg_clean.jpg 1:1)
const ART_RINGS = {
  '10':    { cx: 688, cy: 305, rx: 123, ry: 87, holeX: 688, holeY: 372, col: '#ff2fd0' },
  '20':    { cx: 688, cy: 294, rx: 85,  ry: 62, holeX: 688, holeY: 338, col: '#7b68ff' },
  '30':    { cx: 688, cy: 286, rx: 48,  ry: 36, holeX: 688, holeY: 309, col: '#29e6ff' },
  '40':    { cx: 688, cy: 276, rx: 31,  ry: 23, holeX: 688, holeY: 276, col: '#ff3ad8' },
  '50':    { cx: 688, cy: 247, rx: 26,  ry: 19, holeX: 688, holeY: 247, col: '#29e6ff' },
  '100':   { cx: 688, cy: 221, rx: 24,  ry: 16, holeX: 688, holeY: 221, col: '#ff4fd8' },
  'L-100': { cx: 599, cy: 212, rx: 22,  ry: 15, holeX: 599, holeY: 212, col: '#ffd23a' },
  'R-100': { cx: 777, cy: 212, rx: 22,  ry: 15, holeX: 777, holeY: 212, col: '#ffd23a' }
};

function drawLaneChasers(g, t) {
  // Animated neon light pulses racing up the 5 lane light strips in exact perspective
  const strips = [
    { xBot: 292, xTop: 583, col: '#00f0ff' },
    { xBot: 530, xTop: 642, col: '#00f0ff' },
    { xBot: 688, xTop: 688, col: '#ff3ad8' },
    { xBot: 846, xTop: 734, col: '#00f0ff' },
    { xBot: 1084, xTop: 793, col: '#00f0ff' }
  ];
  g.save();
  g.globalCompositeOperation = 'lighter';
  strips.forEach((st, idx) => {
    for (let k = 0; k < 2; k++) {
      const ph = (t * 0.65 + k * 0.5 + idx * 0.12) % 1;
      const p0 = Math.max(0, ph - 0.14), p1 = Math.min(1, ph + 0.14);
      const y0 = lerp(665, 412, p0), y1 = lerp(665, 412, p1);
      const x0 = lerp(st.xBot, st.xTop, p0), x1 = lerp(st.xBot, st.xTop, p1);
      const gr = g.createLinearGradient(x0, y0, x1, y1);
      gr.addColorStop(0, 'rgba(0,240,255,0)');
      gr.addColorStop(0.5, st.col);
      gr.addColorStop(1, 'rgba(255,255,255,0)');
      g.strokeStyle = gr;
      g.lineWidth = lerp(7, 2.5, ph);
      g.lineCap = 'round';
      g.beginPath();
      g.moveTo(x0, y0);
      g.lineTo(x1, y1);
      g.stroke();
    }
  });
  g.restore();
}

function drawTargetBoardEffects(g, t) {
  g.save();
  g.globalCompositeOperation = 'lighter';

  // 1. Highlight active 2X BONUS TARGET ring with pulsing golden-cyan halo
  const bonus = ART_RINGS[S.bonusTarget];
  if (bonus && S.state !== 'over') {
    const pulse = 0.55 + 0.45 * Math.sin(t * 7.5);
    g.save();
    g.strokeStyle = '#ffd23a';
    g.shadowColor = '#ffd23a';
    g.shadowBlur = 18 + pulse * 14;
    g.lineWidth = 3 + pulse * 2;
    g.beginPath();
    g.ellipse(bonus.cx, bonus.cy, bonus.rx + 3, bonus.ry + 2, 0, 0, Math.PI * 2);
    g.stroke();

    // Floating "2X BONUS" micro-badge next to the lit ring
    const bx = bonus.cx + (S.bonusTarget === 'L-100' ? -36 : S.bonusTarget === 'R-100' ? 36 : bonus.rx + 28);
    const by = bonus.cy - 4;
    g.save();
    g.translate(bx, by);
    g.scale(1, getCanvasYSquash());
    g.font = '900 10px Orbitron';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillStyle = '#ffd23a';
    g.fillText('⚡2X', 0, 0);
    g.restore();
    g.restore();
  }

  // 2. Hit flash on scored ring
  if (S.flash) {
    const F = S.flash;
    const ar = ART_RINGS[F.label] || ART_RINGS[String(F.pts)];
    if (ar) {
      const a = Math.max(0, 1 - F.t / 1.1) * (0.65 + 0.35 * Math.sin(F.t * 32));
      g.save();
      g.globalAlpha = a;
      g.strokeStyle = '#ffffff';
      g.shadowColor = F.col;
      g.shadowBlur = 28;
      g.lineWidth = 5.5;
      g.beginPath();
      g.ellipse(ar.cx, ar.cy, ar.rx + 2, ar.ry + 2, 0, 0, Math.PI * 2);
      g.stroke();
      g.restore();
    }
  }

  g.restore();
}

function drawAimTrajectory(g) {
  if (S.state !== 'ready') return;
  const v0 = lerp(4.1, 8.2, S.smoothPwr);
  const pred = predictTrajectory(v0, S.smoothAng, S.smoothAimX, S.spin, Z0);
  if (pred.pts.length < 2) return;

  g.save();
  g.globalCompositeOperation = 'lighter';
  const screenPts = pred.pts.map(pt => P(pt.x, pt.y, pt.z));
  const ringInfo = pred.targetRing || { pts: 50, col: '#00f0ff', label: '50' };
  const baseCol = S.mult >= 3 ? '#ffd23a' : S.mult === 2 ? '#ff3ad8' : ringInfo.col;

  // 1. Silky continuous glowing laser ribbon along the 3D ballistic curve
  g.save();
  g.strokeStyle = baseCol;
  g.shadowColor = baseCol;
  g.shadowBlur = 12;
  g.lineWidth = 3.2;
  g.globalAlpha = 0.28;
  g.lineCap = 'round';
  g.lineJoin = 'round';
  g.beginPath();
  g.moveTo(screenPts[0].x, screenPts[0].y);
  for (let i = 1; i < screenPts.length; i++) {
    g.lineTo(screenPts[i].x, screenPts[i].y);
  }
  g.stroke();
  g.restore();

  // 2. Evenly spaced arc-length dots (zero hopping!)
  for (let i = 1; i < screenPts.length; i++) {
    const q = screenPts[i];
    const u = i / (screenPts.length - 1);
    const dotR = lerp(4.2, 2.1, u);
    g.fillStyle = baseCol;
    g.globalAlpha = 0.88 - u * 0.42;
    g.shadowColor = baseCol;
    g.shadowBlur = 10;
    g.beginPath();
    g.arc(q.x, q.y, dotR, 0, Math.PI * 2);
    g.fill();
  }

  // 3. Sub-pixel smooth Landing Reticle + Target Ring Highlight on the board
  const last = screenPts[screenPts.length - 1];
  if (last && last.y < 415) {
    const pulse = 0.6 + 0.4 * Math.sin(S.time * 7);
    g.globalAlpha = 0.92;
    g.strokeStyle = ringInfo.col;
    g.shadowColor = ringInfo.col;
    g.shadowBlur = 14;
    g.lineWidth = 2.2;
    g.beginPath();
    g.arc(last.x, last.y, 9 + pulse * 3, 0, Math.PI * 2);
    g.stroke();

    g.fillStyle = '#ffffff';
    g.beginPath();
    g.arc(last.x, last.y, 2.8, 0, Math.PI * 2);
    g.fill();
  }
  g.restore();
}

// Live aspect-ratio compensation so spheres & HUD text remain 100% round/un-stretched in full-screen mobile portrait mode
function getCanvasYSquash() {
  const rect = cv.getBoundingClientRect();
  if (!rect.width || !rect.height) return 1;
  const scaleX = rect.width / CW;
  const scaleY = rect.height / CH;
  return clamp(scaleX / Math.max(1e-4, scaleY), 0.45, 1.0);
}

function draw3DBall(g, x, y, z, scaleMul = 1, alpha = 1, isReflection = false) {
  const p = P(x, y, z);
  const ySquash = getCanvasYSquash();
  // Boost apparent ball radius slightly on portrait phones so it feels substantial and tactile
  const mobileBoost = ySquash < 0.85 ? lerp(1.22, 1.0, (ySquash - 0.45) / 0.40) : 1.0;
  const r = Math.max(4, RB * p.s * scaleMul * 0.58 * mobileBoost);
  g.save();
  g.globalAlpha = alpha;
  g.translate(p.x, p.y);
  g.scale(1, ySquash);

  if (!isReflection) {
    // Outer neon aura based on streak multiplier
    g.save();
    g.globalCompositeOperation = 'lighter';
    const haloCol = S.mult >= 3 ? 'rgba(255, 200, 40, 0.55)'
                  : S.mult === 2 ? 'rgba(255, 47, 208, 0.5)'
                  : 'rgba(0, 240, 255, 0.38)';
    const halo = g.createRadialGradient(0, 0, r * 0.6, 0, 0, r * 1.85);
    halo.addColorStop(0, haloCol);
    halo.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = halo;
    g.beginPath();
    g.arc(0, 0, r * 1.85, 0, Math.PI * 2);
    g.fill();
    g.restore();
  }

  // Main 3D metallic sphere shader
  const gr = g.createRadialGradient(-r * 0.34, -r * 0.38, r * 0.05, 0, 0, r);
  if (S.mult >= 3) {
    // 3X 24K Gold Fireball Skin
    gr.addColorStop(0, '#ffffff');
    gr.addColorStop(0.22, '#fff3a8');
    gr.addColorStop(0.55, '#ffb800');
    gr.addColorStop(0.84, '#6e3800');
    gr.addColorStop(1, '#ffe66d');
  } else if (S.mult === 2) {
    // 2X Cyber Magenta Plasma Skin
    gr.addColorStop(0, '#ffffff');
    gr.addColorStop(0.22, '#ffc4f4');
    gr.addColorStop(0.55, '#d418a8');
    gr.addColorStop(0.84, '#2d0638');
    gr.addColorStop(1, '#00f0ff');
  } else {
    // Classic 1984 Chrome & Neon Rim Skin
    gr.addColorStop(0, '#ffffff');
    gr.addColorStop(0.2, '#e8f4ff');
    gr.addColorStop(0.52, '#7d88ad');
    gr.addColorStop(0.82, '#1e1936');
    gr.addColorStop(1, '#c6b8ff');
  }

  g.fillStyle = gr;
  g.beginPath();
  g.arc(0, 0, r, 0, Math.PI * 2);
  g.fill();

  // Animated spinning equatorial energy seam so player feels ball roll & spin
  if (!isReflection) {
    const rot = S.ball ? S.ball.rotP : S.time * 1.8;
    const tilt = (S.ball ? S.ball.spin : S.spin) * 0.65;
    g.save();
    g.rotate(tilt);
    g.beginPath();
    g.arc(0, 0, r * 0.94, 0, Math.PI * 2);
    g.clip();

    g.globalCompositeOperation = 'lighter';
    const bandY = Math.sin(rot) * r * 0.62;
    g.strokeStyle = S.mult >= 3 ? 'rgba(255,240,150,0.75)' : 'rgba(0,240,255,0.65)';
    g.lineWidth = Math.max(1.5, r * 0.13);
    g.beginPath();
    g.ellipse(0, bandY, r * 0.92, Math.max(1.5, Math.abs(Math.cos(rot)) * r * 0.32), 0, 0, Math.PI * 2);
    g.stroke();

    // Dual neon cabinet rim reflections on the chrome ball
    g.strokeStyle = 'rgba(255, 58, 216, 0.7)';
    g.lineWidth = r * 0.14;
    g.beginPath();
    g.arc(0, 0, r * 0.82, Math.PI * 0.15, Math.PI * 0.82);
    g.stroke();

    g.strokeStyle = 'rgba(0, 240, 255, 0.65)';
    g.lineWidth = r * 0.12;
    g.beginPath();
    g.arc(0, 0, r * 0.84, -Math.PI * 0.82, -Math.PI * 0.18);
    g.stroke();
    g.restore();
  }

  g.restore();
  return { x: p.x, y: p.y, r: r * ySquash };
}

function drawTrail(g) {
  const T = S.trail;
  if (T.length < 2) return;
  const pts = T.map(q => P(q.x, q.y, q.z));
  g.save();
  g.globalCompositeOperation = 'lighter';
  g.lineCap = 'round';
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i], t = i / pts.length;
    const w = Math.max(2, RB * b.s * 0.85 * t);
    const hue = S.mult >= 3 ? lerp(35, 55, t) : lerp(305, 188, t);
    g.strokeStyle = `hsla(${hue}, 100%, ${55 + t * 20}%, ${t * 0.62})`;
    g.lineWidth = w;
    g.beginPath();
    g.moveTo(a.x, a.y);
    g.lineTo(b.x, b.y);
    g.stroke();

    g.strokeStyle = `rgba(255,255,255,${t * 0.55})`;
    g.lineWidth = Math.max(1, w * 0.28);
    g.stroke();
  }
  g.restore();
}

function drawPowerMeter(g, bp, power) {
  const ySq = getCanvasYSquash();
  const h = Math.round(135 * ySq), w = 16;
  const x = clamp(bp.x + bp.r / ySq + 22, 305, 1025);
  const y = bp.y - h * 0.65;
  g.save();
  // Meter housing
  g.fillStyle = 'rgba(8, 4, 24, 0.88)';
  g.strokeStyle = '#00f0ff';
  g.lineWidth = 2;
  g.beginPath();
  g.roundRect(x, y, w, h, 8);
  g.fill();
  g.stroke();

  // Target zone ticks (100 zone near top, 50 zone middle-upper)
  const fh = (h - 6) * clamp(power, 0, 1);
  const gr = g.createLinearGradient(0, y + h, 0, y);
  gr.addColorStop(0, '#00f0ff');
  gr.addColorStop(0.55, '#ff3ad8');
  gr.addColorStop(1, '#ffd23a');
  g.fillStyle = gr;
  g.shadowColor = '#ff3ad8';
  g.shadowBlur = 12;
  g.beginPath();
  g.roundRect(x + 3, y + h - 3 - fh, w - 6, Math.max(4, fh), 5);
  g.fill();

  g.shadowBlur = 0;
  [
    { lbl: '100', col: '#ffd23a', dy: 0.14 },
    { lbl: '50',  col: '#00f0ff', dy: 0.36 },
    { lbl: '30',  col: '#ff7be5', dy: 0.62 }
  ].forEach(tk => {
    g.save();
    g.translate(x + w + 6, y + h * tk.dy);
    g.scale(1, ySq);
    g.font = '900 10px Orbitron';
    g.fillStyle = tk.col;
    g.textAlign = 'left';
    g.textBaseline = 'middle';
    g.fillText(tk.lbl, 0, 0);
    g.restore();
  });
  g.restore();
}

function drawTicketShimmer(g, t) {
  // Shimmering 24K gold light sweep along the brass ticket arch on the right rail
  // whenever tickets are dispensing or pulsing!
  const active = (S.dispShown < S.dispTarget) || S.ticketPulse > 0.02;
  const intensity = active ? 0.85 : 0.25 + 0.15 * Math.sin(t * 2.5);
  g.save();
  g.globalCompositeOperation = 'lighter';
  const ph = (t * (active ? 2.4 : 0.6)) % 1;
  // Path along the golden ticket arch in skee_roll_84_bg_clean.jpg: (1018,618) -> (1120,445) -> (1228,585) -> (1245,735)
  const gx = lerp(1030, 1245, ph);
  const gy = lerp(445, 720, ph);
  const rad = g.createRadialGradient(gx, gy, 4, gx, gy, active ? 95 : 55);
  rad.addColorStop(0, `rgba(255, 245, 170, ${0.55 * intensity})`);
  rad.addColorStop(0.5, `rgba(255, 195, 35, ${0.28 * intensity})`);
  rad.addColorStop(1, 'rgba(255, 180, 0, 0)');
  g.fillStyle = rad;
  g.beginPath();
  g.arc(gx, gy, active ? 95 : 55, 0, Math.PI * 2);
  g.fill();
  g.restore();
}

function drawHUD(g) {
  // Renders crisp glowing digital numbers directly inside the exact marquee boxes of skee_roll_84_bg_clean.jpg!
  const ballNo = Math.min(BALLS, S.ballIdx + (S.state === 'over' ? 0 : 1));
  const ySquash = getCanvasYSquash();

  g.save();
  g.textAlign = 'center';
  g.textBaseline = 'middle';

  // 1. BALLS Box Center: (395, 82)
  g.save();
  g.translate(395, 82);
  g.scale(1, ySquash);
  g.font = '900 34px Orbitron';
  g.shadowColor = '#00f0ff';
  g.shadowBlur = 16;
  g.fillStyle = '#e6fcff';
  g.fillText(`${ballNo}/${BALLS}`, 0, 0);
  g.restore();

  // 2. SCORE Box Center: (988, 82)
  g.save();
  g.translate(988, 82);
  g.scale(1, ySquash);
  g.font = '900 36px Orbitron';
  g.shadowColor = '#00f0ff';
  g.shadowBlur = 16;
  g.fillStyle = '#e6fcff';
  g.fillText(String(S.score), 0, 0);
  g.restore();

  // 3. TICKETS Sub-Marquee Box Center: (965, 172) inside (x=884..1048, y=148..195)
  g.save();
  g.translate(965, 172);
  g.scale(1, ySquash);
  g.font = '900 15px Orbitron';
  g.shadowColor = '#ffb800';
  g.shadowBlur = 12;
  g.fillStyle = '#ffd84a';
  g.fillText(`TICKETS +${S.dispShown}`, 0, 0);
  g.restore();

  // 4. Live Streak & Wallet Telemetry Badge on Left Marquee Under-Hang (x=395, y=161)
  g.save();
  const wx = 310, wy = 144, ww = 195, wh = 34;
  g.fillStyle = 'rgba(10, 6, 26, 0.84)';
  g.strokeStyle = S.mult > 1 ? '#ffd23a' : 'rgba(0, 240, 255, 0.55)';
  g.lineWidth = 1.6;
  g.beginPath();
  g.roundRect(wx, wy, ww, wh, 8);
  g.fill();
  g.stroke();

  g.translate(wx + ww / 2, wy + wh / 2 + 1);
  g.scale(1, ySquash);
  g.font = '800 11.5px Orbitron';
  g.fillStyle = S.mult >= 3 ? '#ffd23a' : S.mult === 2 ? '#ff6be3' : '#9beeff';
  g.shadowColor = g.fillStyle;
  g.shadowBlur = 8;
  const statusTxt = S.mult > 1
    ? `🔥 ${S.mult}X STREAK • 🎟️ ${walletTickets}`
    : `WALLET 🎟️ ${walletTickets.toLocaleString()}`;
  g.fillText(statusTxt, 0, 0);
  g.restore();

  // 5. 9-Ball Frame Pip Indicators along the top of the lane apron (y=686)
  const pipGap = 18, pipStart = 688 - pipGap * 4;
  for (let i = 0; i < BALLS; i++) {
    const r = S.results[i];
    const px = pipStart + i * pipGap, py = 686;
    g.save();
    g.translate(px, py);
    g.scale(1, ySquash);
    g.beginPath();
    g.arc(0, 0, 5.2, 0, Math.PI * 2);
    if (r === undefined) {
      g.fillStyle = (i === S.ballIdx && S.state !== 'over') ? '#00f0ff' : 'rgba(255,255,255,0.2)';
      g.shadowBlur = (i === S.ballIdx && S.state !== 'over') ? 10 : 0;
      g.shadowColor = '#00f0ff';
    } else {
      g.fillStyle = r >= 100 ? '#ffd23a' : r >= 50 ? '#00f0ff' : '#ff3ad8';
      g.shadowColor = g.fillStyle;
      g.shadowBlur = 8;
    }
    g.fill();
    g.restore();
  }

  g.restore();
}

function render() {
  ctx.clearRect(0, 0, CW, CH);

  // 1. Draw Crisp Full-Resolution 1984 Tokyo Arcade Playfield Plate (1376 x 768)
  if (bgLoaded) {
    ctx.drawImage(bgImg, 0, 0, CW, CH);
  } else {
    ctx.fillStyle = '#090418';
    ctx.fillRect(0, 0, CW, CH);
  }

  // 2. Dynamic 3D Neon Chasers, Bonus Target Ring Halo & Ticket Dispenser Shimmer
  drawLaneChasers(ctx, S.time);
  drawTargetBoardEffects(ctx, S.time);
  drawTicketShimmer(ctx, S.time);
  drawTrail(ctx);

  // 3. Ball & Real-Time Mahogany Lane Reflection (Only a line showing power, no guide line showing where ball goes!)
  if (S.state === 'ready') {
    const pullPwr = (drag && drag.pullBackPx >= 8) ? S.smoothPwr : (S.charging ? chargePower() : 0);
    const zBase = lerp(-0.15, Z0, 1 - Math.pow(1 - S.rollIn, 3));
    const z = zBase - pullPwr * 0.22;
    const y = surf(z) + RB;
    const bx = S.smoothAimX;

    // Single straight Power Line showing ONLY power level (never showing where the ball will go)
    if (pullPwr > 0.01) {
      const pOrigin = P(bx, surf(Z0) + RB * 0.4, Z0);
      const pPulled = P(bx, surf(z) + RB * 0.4, z);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const lineCol = pullPwr > 0.8 ? '#ffd23a' : pullPwr > 0.45 ? '#ff3ad8' : '#00f0ff';
      ctx.strokeStyle = lineCol;
      ctx.shadowColor = lineCol;
      ctx.shadowBlur = 16;
      ctx.lineWidth = 5 + pullPwr * 4;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(pOrigin.x, pOrigin.y);
      ctx.lineTo(pPulled.x, pPulled.y + pullPwr * 28);
      ctx.stroke();
      ctx.restore();
    }

    // Polished mahogany reflection & soft contact shadow
    draw3DBall(ctx, bx, -y * 0.85, z, 0.95, 0.24, true);
    const sp = P(bx, surf(z), z);
    ctx.save();
    ctx.fillStyle = 'rgba(0, 0, 0, 0.58)';
    ctx.beginPath();
    ctx.ellipse(sp.x, sp.y + 8, RB * sp.s * 0.62, RB * sp.s * 0.22, 0, 0, Math.PI * 2);
    ctx.fill();

    // Pulsing launch ring under ball (no directional chevron or trajectory line)
    const pulse = 0.5 + 0.5 * Math.sin(S.time * 5.2);
    const ringCol = pullPwr > 0.75 ? '#ffd23a' : S.mult >= 3 ? '#ffd23a' : '#00f0ff';
    ctx.strokeStyle = ringCol;
    ctx.shadowColor = ringCol;
    ctx.shadowBlur = 14;
    ctx.lineWidth = 2.2;
    ctx.globalAlpha = 0.48 + pulse * 0.35;
    ctx.beginPath();
    ctx.ellipse(sp.x, sp.y + 4, RB * sp.s * (0.88 + pullPwr * 0.22), RB * sp.s * (0.32 + pullPwr * 0.08), 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();

    const bp = draw3DBall(ctx, bx, y, z, 1, 1, false);

    if (S.charging) {
      drawPowerMeter(ctx, bp, chargePower());
    } else if (drag && drag.pullBackPx >= 8) {
      drawPowerMeter(ctx, bp, S.smoothPwr);
      const ySq = getCanvasYSquash();
      ctx.save();
      ctx.translate(clamp(bp.x, 420, 956), bp.y - bp.r - 18);
      ctx.scale(1, ySq);
      ctx.font = '900 13px Orbitron';
      ctx.textAlign = 'center';
      ctx.fillStyle = S.smoothPwr > 0.8 ? '#ffd23a' : '#00f0ff';
      ctx.shadowColor = ctx.fillStyle;
      ctx.shadowBlur = 12;
      ctx.fillText(`POWER ${Math.round(S.smoothPwr * 100)}% • RELEASE TO ROLL`, 0, 0);
      ctx.restore();
    } else if (S.rollIn >= 1) {
      const ySq = getCanvasYSquash();
      ctx.save();
      ctx.translate(clamp(bp.x, 460, 916), bp.y - bp.r - 18);
      ctx.scale(1, ySq);
      ctx.font = '800 13px Orbitron';
      ctx.textAlign = 'center';
      ctx.globalAlpha = 0.68 + 0.32 * Math.sin(S.time * 3.5);
      ctx.fillStyle = S.hintT > 0 ? '#ffd23a' : '#dffcff';
      ctx.shadowColor = '#00f0ff';
      ctx.shadowBlur = 10;
      const hint = S.hintT > 0
        ? 'PULL BALL BACK (OR SWIPE UP) TO ROLL!'
        : (ySq < 0.85 ? 'PULL BALL BACK OR SWIPE UP TO ROLL' : 'PULL BALL BACK FOR POWER • OR SWIPE UP / HOLD [ROLL]');
      ctx.fillText(hint, 0, 0);
      ctx.restore();
    }
  } else if (S.ball && S.state === 'rolling') {
    const b = S.ball;
    if (b.st === 'lane') {
      draw3DBall(ctx, b.x, 2 * surf(b.z) - b.y, b.z, 0.95, 0.22, true);
      const sp = P(b.x, surf(b.z), b.z);
      ctx.save();
      ctx.fillStyle = 'rgba(0,0,0,0.52)';
      ctx.beginPath();
      ctx.ellipse(sp.x, sp.y + 5, RB * sp.s * 0.58, RB * sp.s * 0.2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    } else if (b.st === 'board') {
      // Dynamic 3D shadow on the inclined target board to show airborne ski-jump height
      const c = bc(b);
      const shW = BW(c.u, c.v, 0);
      const sp = P(shW[0], shW[1], shW[2]);
      const hLift = Math.max(0, c.h - RB);
      const shAlpha = clamp(0.48 - hLift * 1.1, 0.14, 0.48);
      const shScale = clamp(1 - hLift * 1.4, 0.5, 1);
      ctx.save();
      ctx.fillStyle = `rgba(0,0,0,${shAlpha})`;
      ctx.beginPath();
      ctx.ellipse(sp.x, sp.y + 4, RB * sp.s * 0.56 * shScale, RB * sp.s * 0.22 * shScale, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    draw3DBall(ctx, b.x, b.y, b.z, 1, 1, false);
  } else if (S.capture && S.capture.pts > 0 && S.capture.t < 0.42) {
    // Ball sinking into target pocket animation
    const c = S.capture;
    const k = Math.max(0.08, 1 - c.t / 0.42);
    draw3DBall(ctx, c.x, c.y, c.z, k, k, false);
  }

  // 4. Shockwaves & Particle Fireworks
  const ySq = getCanvasYSquash();
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  S.shockwaves.forEach(sw => {
    const u = sw.t / 0.65;
    ctx.save();
    ctx.translate(sw.x, sw.y);
    ctx.scale(1, ySq);
    ctx.strokeStyle = sw.col;
    ctx.globalAlpha = Math.max(0, 1 - u);
    ctx.lineWidth = 4 * (1 - u);
    ctx.beginPath();
    ctx.arc(0, 0, sw.maxR * u, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  });
  S.particles.forEach(pt => {
    const u = pt.life / pt.maxLife;
    ctx.save();
    ctx.translate(pt.x, pt.y);
    ctx.scale(1, ySq);
    ctx.fillStyle = pt.col;
    ctx.globalAlpha = Math.max(0, 1 - u);
    ctx.shadowColor = pt.col;
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(0, 0, pt.r * (1 - u * 0.5), 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });
  ctx.restore();

  // 5. Floating Score Popups
  S.popups.forEach(p => {
    const u = p.t / 1.35;
    const sz = (p.big ? 34 : 26) * (1 + 0.18 * Math.sin(Math.min(1, p.t * 5) * Math.PI));
    ctx.save();
    ctx.translate(clamp(p.x, 380, 996), p.y - u * 64);
    ctx.scale(1, ySq);
    ctx.globalAlpha = Math.max(0, 1 - u * u);
    ctx.font = `900 ${sz}px Orbitron`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = 6;
    ctx.strokeStyle = 'rgba(12, 3, 28, 0.92)';
    ctx.strokeText(p.txt, 0, 0);
    ctx.shadowColor = p.col;
    ctx.shadowBlur = 18;
    ctx.fillStyle = p.col;
    ctx.fillText(p.txt, 0, 0);
    ctx.restore();
  });

  // 6. Marquee Digital HUD
  drawHUD(ctx);
}

let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.08, (now - lastT) / 1000);
  lastT = now;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ============================================================================
   10. AUTOMATED TEST & DEBUG HOOKS (window.__skee)
   ============================================================================ */
window.__skee = {
  simulate,
  launch: (v0, ang = 0, x = 0, spin = 0) => {
    S.aimX = x; S.spin = spin; S.rollIn = 1;
    launch(v0, ang);
  },
  state: () => ({
    state: S.state,
    ball: S.ballIdx,
    score: S.score,
    streak: S.streak,
    mult: S.mult,
    bonusTarget: S.bonusTarget,
    results: S.results.slice(),
    tickets: S.dispShown,
    wallet: walletTickets
  }),
  sweep(opts = {}) {
    const counts = {}, byPts = {};
    let tot = 0;
    const v0s = opts.v0s || [4.0, 8.2, 0.15];
    const angs = opts.angs || [-0.14, 0.14, 0.02];
    const xs = opts.xs || [-0.15, 0, 0.15];
    for (let v0 = v0s[0]; v0 <= v0s[1] + 1e-9; v0 += v0s[2]) {
      for (let a = angs[0]; a <= angs[1] + 1e-9; a += angs[2]) {
        for (const x0 of xs) {
          const r = simulate(v0, a, x0, 0);
          tot++;
          counts[r.pts] = (counts[r.pts] || 0) + 1;
          const k = r.pts;
          if (!byPts[k]) byPts[k] = { min: v0, max: v0, ex: [+v0.toFixed(2), +a.toFixed(2), x0] };
          byPts[k].min = Math.min(byPts[k].min, v0);
          byPts[k].max = Math.max(byPts[k].max, v0);
        }
      }
    }
    return { tot, counts, byPts };
  },
  endGame: () => {
    while (S.results.length < BALLS) {
      S.results.push(50);
      S.score += 50;
      S.dispTarget = Math.floor(S.score / 100);
    }
    S.ballIdx = BALLS;
    endGame();
  }
};
})();
