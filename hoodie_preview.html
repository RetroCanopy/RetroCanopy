<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Retrocanopy (EST. 1994) — Official Merch Showroom | Black Edition Capsule (#01, #12, #18, #19)</title>
  <link rel="icon" type="image/png" href="assets/logo.png?v=250">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="merch_minimal.css?v=250">
  <link rel="stylesheet" href="merch_zoom.css?v=250">
  <script src="assets/merch/store_catalog_1994.js?v=250"></script>
  <script src="auth_hub.js?v=250" defer></script>
  <script src="merch_zoom.js?v=250" defer></script>
  <style>

    :root {
      --bg-dark: #05060a;
      --molten-orange: #ff7b00;
      --molten-amber: #ffbe42;
      --molten-copper: #b8540a;
      --neon-cyan: #00f0ff;
      --text-white: #ffffff;
      --text-gold-muted: #d2bda1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background: #040508;
      color: #ffffff;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow-x: hidden;
      user-select: none;
    }

    body.rc-fresh14-store-body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(8px, 1.2vh, 16px) clamp(10px, 1.8vw, 28px);
      background:
        radial-gradient(ellipse at 50% 0%, rgba(255, 115, 15, 0.14) 0%, transparent 55%),
        radial-gradient(ellipse at 50% 100%, rgba(255, 100, 10, 0.12) 0%, transparent 55%),
        #040508;
    }

    /* Hide legacy floating elements from merch_minimal.css */
    .hud-stack,
    .showroom-3d-controls,
    #shop-chloe-stage,
    #shop-chloe-dialogue {
      display: none !important;
    }

    /* ── OUTER 3D MOLTEN-ORANGE & OBSIDIAN LIQUID GLASS SHELL ─────────── */
    .f14-store-outer-shell {
      position: relative;
      width: min(1320px, 98vw);
      min-height: calc(100vh - clamp(16px, 2.4vh, 32px));
      border-radius: 30px;
      padding: clamp(14px, 1.8vh, 22px) clamp(18px, 2.4vw, 34px) clamp(16px, 2vh, 24px);
      background:
        radial-gradient(ellipse at 50% 12%, rgba(255, 95, 25, 0.16) 0%, rgba(8, 9, 14, 0.96) 46%, #05060a 100%);
      border: 3px solid rgba(255, 150, 45, 0.65);
      box-shadow:
        0 0 0 6px #07080d,
        0 0 0 8px rgba(255, 140, 40, 0.25),
        0 26px 70px rgba(0, 0, 0, 0.96),
        0 0 42px rgba(255, 115, 15, 0.28),
        inset 0 0 38px rgba(255, 110, 15, 0.22),
        inset 0 2px 3px rgba(255, 235, 180, 0.75),
        inset 0 -3px 6px rgba(255, 125, 20, 0.65);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    /* Top & Bottom Glowing Molten-Orange Liquid Glass Light Pipes */
    .f14-store-outer-shell::before {
      content: '';
      position: absolute;
      left: 3%;
      right: 3%;
      top: 0;
      height: 7px;
      border-radius: 0 0 12px 12px;
      background: linear-gradient(90deg,
        transparent 0%,
        #ff6a00 12%,
        #ffd478 32%,
        #ff8811 52%,
        #ffd478 74%,
        #ff6a00 90%,
        transparent 100%);
      box-shadow:
        0 0 18px #ff8811,
        0 2px 26px rgba(255, 125, 20, 0.85);
      pointer-events: none;
      z-index: 5;
    }

    .f14-store-outer-shell::after {
      content: '';
      position: absolute;
      left: 3%;
      right: 3%;
      bottom: 0;
      height: 7px;
      border-radius: 12px 12px 0 0;
      background: linear-gradient(90deg,
        transparent 0%,
        #ff6a00 14%,
        #ffc85c 38%,
        #ff7b00 55%,
        #ffc85c 76%,
        #ff6a00 90%,
        transparent 100%);
      box-shadow:
        0 0 18px #ff8811,
        0 -2px 26px rgba(255, 125, 20, 0.85);
      pointer-events: none;
      z-index: 5;
    }

    /* Left & Right Vertical Molten-Orange Glass Wall Tubes */
    .f14-side-light-left,
    .f14-side-light-right {
      position: absolute;
      top: 4%;
      bottom: 4%;
      width: 6px;
      background: linear-gradient(180deg,
        transparent 0%,
        #ff7b00 12%,
        #ffd478 28%,
        #b34800 50%,
        #ffd478 74%,
        #ff7b00 90%,
        transparent 100%);
      box-shadow: 0 0 18px rgba(255, 130, 20, 0.8);
      pointer-events: none;
      z-index: 5;
    }
    .f14-side-light-left { left: 0; border-radius: 0 8px 8px 0; }
    .f14-side-light-right { right: 0; border-radius: 8px 0 0 8px; }

    /* ── TOP HEADER BAR (HOME, CENTER SYNTHWAVE TREE LOGO, OWNER HUB & CART) ── */
    .f14-store-header {
      position: relative;
      z-index: 10;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: start;
      width: 100%;
      padding-top: 2px;
    }

    .f14-header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-top: 8px;
    }

    .f14-home-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(16, 18, 28, 0.82);
      border: 1.5px solid rgba(255, 175, 75, 0.42);
      color: #f3e5d0;
      text-decoration: none;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.75), inset 0 1px 1px rgba(255, 255, 255, 0.22);
      transition: all 0.22s ease;
    }

    .f14-home-pill:hover {
      border-color: #ffbe42;
      color: #ffffff;
      box-shadow: 0 0 18px rgba(255, 165, 40, 0.55);
      transform: translateY(-1px);
    }

    /* Center Tree + RETROCANOPY Wordmark */
    .f14-brand-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      margin-top: -6px;
    }

    .f14-tree-logo {
      width: clamp(68px, 7.6vh, 92px);
      height: clamp(68px, 7.6vh, 92px);
      object-fit: contain;
      /* clean RGBA logo */
      filter: drop-shadow(0 0 18px rgba(255, 75, 120, 0.45));
    }

    .f14-wordmark {
      position: relative;
      margin-top: -4px;
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1.45rem, 2.5vw, 2.25rem);
      font-weight: 900;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      background: linear-gradient(180deg, #ffb84d 0%, #ff6438 55%, #ff2d7a 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 22px rgba(255, 90, 35, 0.65));
    }

    .f14-wordmark::after {
      content: 'RETROCANOPY';
      position: absolute;
      left: 0;
      right: 0;
      top: 84%;
      transform: scaleY(-0.52);
      transform-origin: center top;
      opacity: 0.20;
      filter: blur(2px);
      background: linear-gradient(to bottom, #ff5522 0%, transparent 85%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      pointer-events: none;
    }

    /* Top-Right Owner Hub & Cart Badge Pills */
    .f14-header-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      padding-top: 8px;
    }

    .f14-owner-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 16px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(58, 38, 12, 0.78) 0%, rgba(26, 16, 5, 0.92) 100%);
      border: 1.5px solid rgba(255, 185, 65, 0.72);
      color: #f8e7c8;
      text-decoration: none;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.70rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      box-shadow: 0 0 16px rgba(255, 165, 35, 0.28), inset 0 1px 1px rgba(255, 235, 180, 0.35);
      transition: all 0.22s ease;
    }

    .f14-owner-pill:hover {
      border-color: #ffd478;
      color: #ffffff;
      box-shadow: 0 0 22px rgba(255, 180, 45, 0.58);
      transform: translateY(-1px);
    }

    .f14-owner-shield {
      color: #5b9dff;
      font-size: 0.82rem;
    }

    .f14-cart-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px 6px 14px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(10, 32, 34, 0.85) 0%, rgba(5, 16, 20, 0.95) 100%);
      border: 1.5px solid rgba(0, 235, 190, 0.68);
      box-shadow: 0 0 16px rgba(0, 235, 190, 0.26), inset 0 1px 1px rgba(180, 255, 240, 0.3);
      color: #ffffff;
      cursor: pointer;
      transition: all 0.22s ease;
    }

    .f14-cart-pill:hover {
      border-color: #58ffdf;
      box-shadow: 0 0 22px rgba(0, 240, 200, 0.55);
      transform: translateY(-1px);
    }

    .f14-cart-icon {
      font-size: 0.92rem;
      color: #b47cff;
      filter: drop-shadow(0 0 6px rgba(180, 124, 255, 0.65));
    }

    .f14-cart-count-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 22px;
      height: 22px;
      padding: 0 6px;
      border-radius: 50%;
      background: linear-gradient(180deg, #ffbe42 0%, #d96b00 100%);
      color: #090602;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.70rem;
      font-weight: 900;
      box-shadow: 0 0 10px rgba(255, 165, 30, 0.75);
    }

    /* ── TOP & BOTTOM CATEGORY FILTER PILL BARS (ALL | HATS | HOODIES | VAULT) ── */
    .f14-filter-bar-wrap {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      margin: clamp(6px, 1vh, 12px) 0;
    }

    .f14-filter-bar-wrap.top-filter-wrap::before,
    .f14-filter-bar-wrap.top-filter-wrap::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, rgba(255, 150, 50, 0.12), rgba(255, 165, 65, 0.42));
      margin: 0 16px;
    }
    .f14-filter-bar-wrap.top-filter-wrap::after {
      background: linear-gradient(90deg, rgba(255, 165, 65, 0.42), rgba(255, 150, 50, 0.12));
    }

    .f14-filter-bar {
      display: inline-flex;
      align-items: center;
      gap: clamp(8px, 1vw, 14px);
    }

    .f14-filter-pill {
      padding: clamp(6px, 0.85vh, 9px) clamp(18px, 1.8vw, 26px);
      border-radius: 999px;
      background: rgba(16, 19, 28, 0.86);
      border: 1.5px solid rgba(145, 160, 188, 0.30);
      color: #c5cedf;
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(0.68rem, 0.84vw, 0.80rem);
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.22s ease;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.14), 0 4px 12px rgba(0, 0, 0, 0.65);
    }

    .f14-filter-pill:hover {
      border-color: rgba(255, 185, 75, 0.65);
      color: #ffffff;
    }

    .f14-filter-pill.active {
      background: linear-gradient(180deg, rgba(168, 96, 18, 0.72) 0%, rgba(78, 38, 6, 0.92) 100%);
      border-color: #ffbe48;
      color: #ffffff;
      box-shadow:
        0 0 18px rgba(255, 150, 25, 0.58),
        inset 0 1.5px 2px rgba(255, 235, 175, 0.65);
    }

    /* ── CENTER 2-CARD PEDESTAL SHOWROOM GRID ─────────────────────────── */
    .f14-showroom-inner-frame {
      position: relative;
      z-index: 8;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: clamp(4px, 0.8vh, 10px) 0;
    }

    .f14-cards-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(280px, 500px));
      gap: clamp(16px, 2.2vw, 32px);
      width: 100%;
      justify-content: center;
      align-items: stretch;
    }

    .f14-cards-grid.single-card-mode {
      grid-template-columns: minmax(300px, 520px);
    }

    .f14-product-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(180deg, rgba(10, 12, 18, 0.75) 0%, rgba(6, 7, 11, 0.92) 100%);
      border: 1px solid rgba(255, 165, 75, 0.22);
      border-radius: 22px;
      padding: clamp(12px, 1.5vh, 18px) clamp(14px, 1.6vw, 22px) clamp(16px, 2vh, 24px);
      box-shadow:
        0 18px 44px rgba(0, 0, 0, 0.88),
        inset 0 1px 1px rgba(255, 225, 180, 0.16);
      transition: transform 0.28s ease, border-color 0.28s ease, box-shadow 0.28s ease;
    }

    .f14-product-card:hover {
      border-color: rgba(255, 175, 65, 0.48);
      box-shadow:
        0 22px 52px rgba(0, 0, 0, 0.94),
        0 0 28px rgba(255, 130, 20, 0.15),
        inset 0 1px 2px rgba(255, 230, 175, 0.28);
    }

    /* Upper Pedestal Well */
    .f14-pedestal-well {
      position: relative;
      width: 100%;
      height: clamp(250px, 37vh, 370px);
      border-radius: 18px;
      background:
        radial-gradient(circle at 50% 36%, rgba(0, 230, 255, 0.18) 0%, rgba(0, 150, 210, 0.05) 38%, rgba(4, 6, 10, 0.96) 70%),
        #04060a;
      border: 1px solid rgba(255, 255, 255, 0.09);
      box-shadow: inset 0 0 28px rgba(0, 0, 0, 0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: zoom-in;
    }

    .f14-pedestal-img {
      width: 94%;
      height: 96%;
      object-fit: contain;
      object-position: center bottom;
      display: block;
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), filter 0.35s ease;
      filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.85));
    }

    .f14-pedestal-well:hover .f14-pedestal-img {
      transform: scale(1.035) translateY(-3px);
      filter: drop-shadow(0 16px 30px rgba(0, 0, 0, 0.92)) drop-shadow(0 0 18px rgba(255, 140, 25, 0.24));
    }

    /* Subtle Front/Back View Toggle on Hoodie Card */
    .f14-view-toggle-group {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 6;
      display: inline-flex;
      gap: 4px;
      background: rgba(8, 10, 16, 0.86);
      border: 1px solid rgba(255, 175, 70, 0.42);
      border-radius: 999px;
      padding: 3px;
      backdrop-filter: blur(8px);
    }

    .f14-view-toggle-btn {
      padding: 4px 10px;
      border-radius: 999px;
      border: none;
      background: transparent;
      color: #b8c4d8;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.58rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .f14-view-toggle-btn.active {
      background: linear-gradient(180deg, rgba(175, 100, 18, 0.85) 0%, rgba(90, 44, 6, 0.95) 100%);
      color: #ffffff;
      box-shadow: 0 0 10px rgba(255, 150, 25, 0.55);
    }

    /* Product Meta: Title, Price, Circular Size Pills, ADD TO BAG */
    .f14-card-meta {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      margin-top: clamp(10px, 1.4vh, 16px);
      gap: clamp(8px, 1.1vh, 13px);
    }

    .f14-product-title {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(1.18rem, 1.55vw, 1.48rem);
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.01em;
      text-align: center;
    }

    .f14-product-price {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(1.02rem, 1.25vw, 1.22rem);
      font-weight: 600;
      color: var(--text-gold-muted);
      margin-top: -4px;
    }

    /* Circular Size Selector Pills (S | M | L | XL) */
    .f14-size-row {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 2px 0;
    }

    .f14-size-pill {
      width: clamp(34px, 3.8vh, 40px);
      height: clamp(34px, 3.8vh, 40px);
      border-radius: 50%;
      background: rgba(16, 20, 30, 0.88);
      border: 1.5px solid rgba(145, 160, 188, 0.32);
      color: #c5cedf;
      font-family: 'Outfit', sans-serif;
      font-size: 0.86rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.12);
    }

    .f14-size-pill:hover {
      border-color: rgba(255, 185, 75, 0.72);
      color: #ffffff;
    }

    .f14-size-pill.active {
      background: linear-gradient(180deg, rgba(165, 95, 18, 0.78) 0%, rgba(75, 38, 6, 0.95) 100%);
      border-color: #ffbe48;
      color: #ffffff;
      box-shadow:
        0 0 16px rgba(255, 150, 25, 0.62),
        inset 0 1.5px 2px rgba(255, 235, 175, 0.65);
    }

    /* Glowing Amber-Gold Liquid Glass ADD TO BAG Pill Button */
    .f14-add-bag-btn {
      width: min(82%, 270px);
      padding: clamp(10px, 1.35vh, 14px) 24px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(145, 80, 14, 0.62) 0%, rgba(58, 28, 4, 0.92) 100%);
      border: 1.5px solid #ffba42;
      color: #ffffff;
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(0.76rem, 0.94vw, 0.88rem);
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow:
        0 0 24px rgba(255, 140, 20, 0.45),
        inset 0 1.5px 2px rgba(255, 235, 175, 0.62),
        inset 0 -2px 6px rgba(255, 120, 10, 0.35);
      transition: all 0.24s ease;
    }

    .f14-add-bag-btn:hover {
      background: linear-gradient(180deg, rgba(185, 105, 20, 0.78) 0%, rgba(82, 40, 6, 0.96) 100%);
      border-color: #ffd97d;
      box-shadow:
        0 0 32px rgba(255, 155, 30, 0.78),
        inset 0 2px 3px rgba(255, 245, 200, 0.82);
      transform: translateY(-2px);
    }

    @media (max-width: 820px) {
      .f14-store-header {
        grid-template-columns: 1fr;
        justify-items: center;
        gap: 8px;
      }
      .f14-header-left {
        order: 2;
        padding-top: 0;
      }
      .f14-brand-center {
        order: 1;
      }
      .f14-header-right {
        order: 3;
        padding-top: 0;
      }
      .f14-cards-grid {
        grid-template-columns: 1fr;
      }
      .f14-pedestal-well {
        height: 260px;
      }
    }

    /* v229: Continuous gentle hover animation on Store Pedestal items + Mobile Polish */
    @keyframes f14StoreItemHover {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    .f14-pedestal-img {
      animation: f14StoreItemHover 3.4s ease-in-out infinite;
    }
    @media (max-width: 640px) {
      body.rc-fresh14-store-body {
        padding: 6px;
        align-items: flex-start;
      }
      .f14-store-outer-shell {
        width: 100%;
        border-radius: 20px;
        padding: 12px 12px 18px;
      }
      .f14-tree-logo {
        width: 56px;
        height: 56px;
      }
      .f14-wordmark {
        font-size: 1.25rem;
      }
      .f14-filter-bar {
        flex-wrap: wrap;
        justify-content: center;
        gap: 6px;
      }
      .f14-filter-pill {
        padding: 6px 14px;
        font-size: 0.62rem;
      }
      .f14-pedestal-well {
        height: 230px;
      }
    }

  

    /* ── STAGE 4 UPGRADE: 4-CATEGORY GRID, COLLECTION #01-#20 BAR & BLACK/WHITE TOGGLES ── */
    .f14-cards-grid {
      grid-template-columns: repeat(3, minmax(260px, 380px));
      gap: clamp(12px, 1.35vw, 20px);
      max-width: 1260px;
    }
    @media (max-width: 1120px) {
      .f14-cards-grid { grid-template-columns: repeat(2, minmax(250px, 1fr)); }
    }
    @media (max-width: 640px) {
      .f14-cards-grid { grid-template-columns: 1fr; }
    }
    .f14-cards-grid.single-card-mode {
      grid-template-columns: minmax(300px, 480px);
    }

    .f14-collection-bar {
      position: relative;
      z-index: 10;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 2px auto 10px;
      padding: 8px 14px;
      width: 100%;
      max-width: 1260px;
      border-radius: 18px;
      background: rgba(10, 12, 19, 0.88);

        <button type="button" class="f14-filter-pill" data-filter="shirts">SHIRTS</button>

  <script>
    const STORE = window.RC_STORE_1994;
    const VALID_SETS = [1, 12, 18, 19];
    const state = {
      setNum: 1,
      filter: 'all',
      sides: { shirts: 'back', hoodies: 'back' }
    };

    // Size Pill Selection per Card
    document.querySelectorAll('.f14-product-card').forEach((card) => {
      const buyBtn = card.querySelector('.f14-add-bag-btn');
      const pills = card.querySelectorAll('.f14-size-pill');
      pills.forEach((pill) => {
        pill.addEventListener('click', () => {
          pills.forEach((p) => p.classList.remove('active'));
          pill.classList.add('active');
          if (buyBtn) buyBtn.setAttribute('data-size-val', pill.getAttribute('data-size') || 'L');
        });
      });
    });

    let activeZoomCat = 'hoodies';

    function withCacheBust(url) {
      if (!url) return '';
      const base = String(url).split('?')[0];
      return `${base}?v=250`;
    }

    function renderAllCards() {
      if (!STORE) return;
      STORE.rebuildCatalogPrices();

      document.querySelectorAll('[data-set-pill]').forEach((btn) => {
        btn.classList.toggle('active', parseInt(btn.getAttribute('data-set-pill'), 10) === state.setNum);
      });

      ['hats', 'shirts', 'hoodies'].forEach((cat) => {
        const sku = STORE.getSkuFor(cat, state.setNum);
        const item = STORE.CATALOG[sku];
        if (!item) return;

        const imgEl = document.getElementById(`img_${cat}`);
        const titleEl = document.getElementById(`title_${cat}`);
        const priceEl = document.getElementById(`price_${cat}`);
        const buyBtn = document.getElementById(`buy_${cat}`);

        let photoUrl = item.heroPhotoUrl;
        if (cat === 'shirts' || cat === 'hoodies') {
          photoUrl = (state.sides[cat] === 'front') ? item.frontPhotoUrl : item.backPhotoUrl;
          document.getElementById(`side_${cat}_back`)?.classList.toggle('active', state.sides[cat] === 'back');
          document.getElementById(`side_${cat}_front`)?.classList.toggle('active', state.sides[cat] === 'front');
        }
        photoUrl = withCacheBust(photoUrl);

        if (imgEl) imgEl.src = photoUrl;
        if (titleEl) titleEl.textContent = item.title;
        if (priceEl) priceEl.textContent = `$${Number(item.price).toFixed(2)}`;
        if (buyBtn) buyBtn.setAttribute('data-model-code', sku);
      });

      // Keep hidden HUD state & open 2K Zoom Modal synced when stepping arrows!
      const syncCat = (state.filter !== 'all' && ['hats', 'shirts', 'hoodies'].includes(state.filter))
        ? state.filter
        : (activeZoomCat || 'hoodies');
      const syncSku = STORE.getSkuFor(syncCat, state.setNum);
      const syncItem = STORE.CATALOG[syncSku];
      if (syncItem) {
        const activeUrl = withCacheBust((syncCat === 'shirts' || syncCat === 'hoodies')
          ? ((state.sides[syncCat] === 'front') ? syncItem.frontPhotoUrl : syncItem.backPhotoUrl)
          : syncItem.frontPhotoUrl);
        const hatImgEl = document.getElementById('hatImg');
        const kickerEl = document.getElementById('hudKicker');
        const titleEl = document.getElementById('hudTitle');
        const priceEl = document.getElementById('hudPrice');
        if (hatImgEl) hatImgEl.src = activeUrl;
        if (kickerEl) kickerEl.textContent = `${syncItem.model} • $${Number(syncItem.price).toFixed(2)}`;
        if (titleEl) titleEl.textContent = syncItem.title;
        if (priceEl) priceEl.textContent = `$${Number(syncItem.price).toFixed(2)}`;

        const zoomOverlay = document.getElementById('rcZoomOverlay');
        if (zoomOverlay && zoomOverlay.classList.contains('open')) {
          zoomCard(syncCat);
        }
      }
    }

    function setStoreSet(n) {
      state.setNum = VALID_SETS.includes(n) ? n : 1;
      renderAllCards();
    }

    function stepStoreSet(dir) {
      const idx = VALID_SETS.indexOf(state.setNum);
      const nextIdx = (idx + dir + VALID_SETS.length) % VALID_SETS.length;
      setStoreSet(VALID_SETS[nextIdx]);
    }
    window.stepItem = stepStoreSet;

    function setCardSide(cat, side) {
      state.sides[cat] = side;
      renderAllCards();
    }

    function applyF14Filter(filterKey) {
      const valid = ['all', 'hats', 'shirts', 'hoodies'];
      const f = valid.includes(filterKey) ? filterKey : 'all';
      state.filter = f;
      document.querySelectorAll('.f14-filter-pill[data-filter]').forEach((btn) => {
        btn.classList.toggle('active', btn.getAttribute('data-filter') === f);
      });
      const grid = document.getElementById('f14CardsGrid');
      const map = {
        hats: document.getElementById('f14CardHat'),
        shirts: document.getElementById('f14CardShirt'),
        hoodies: document.getElementById('f14CardHoodie')
      };
      Object.entries(map).forEach(([k, el]) => {
        if (el) el.style.display = (f === 'all' || f === k) ? 'flex' : 'none';
      });
      if (grid) grid.classList.toggle('single-card-mode', f !== 'all');
    }

    document.querySelectorAll('.f14-filter-pill[data-filter]').forEach((btn) => {
      btn.addEventListener('click', () => applyF14Filter(btn.getAttribute('data-filter') || 'all'));
    });

    function zoomCard(cat) {
      if (!STORE) return;
      activeZoomCat = cat || activeZoomCat || 'hoodies';
      const sku = STORE.getSkuFor(activeZoomCat, state.setNum);
      const item = STORE.CATALOG[sku];
      if (!item) return;
      const activeUrl = withCacheBust((activeZoomCat === 'shirts' || activeZoomCat === 'hoodies')
        ? ((state.sides[activeZoomCat] === 'front') ? item.frontPhotoUrl : item.backPhotoUrl)
        : item.frontPhotoUrl);

      const hatImgEl = document.getElementById('hatImg');
      const kickerEl = document.getElementById('hudKicker');
      const titleEl = document.getElementById('hudTitle');
      if (hatImgEl) hatImgEl.src = activeUrl;
      if (kickerEl) kickerEl.textContent = `${item.model} • $${Number(item.price).toFixed(2)}`;
      if (titleEl) titleEl.textContent = item.title;

      const zoomOverlay = document.getElementById('rcZoomOverlay');
      const zoomImg = document.getElementById('rcZoomImg');
      const zoomKicker = document.getElementById('rcZoomKicker');
      const zoomTitle = document.getElementById('rcZoomTitle');
      const sideGroup = document.getElementById('rcSideGroup');
      const btnFront = document.getElementById('rcBtnFront');
      const btnBack = document.getElementById('rcBtnBack');
      const btnPrev = document.getElementById('rcZoomPrev');
      const btnNext = document.getElementById('rcZoomNext');

      if (zoomOverlay && zoomImg) {
        if (btnPrev) btnPrev.style.display = 'flex';
        if (btnNext) btnNext.style.display = 'flex';
        if (zoomKicker) zoomKicker.textContent = `${item.model} • $${Number(item.price).toFixed(2)}`;
        if (zoomTitle) zoomTitle.textContent = item.title;
        zoomImg.src = activeUrl;
        if (sideGroup && btnFront && btnBack) {
          if (item.backPhotoUrl) {
            sideGroup.style.display = 'inline-flex';
            const isFront = state.sides[activeZoomCat] === 'front';
            btnFront.classList.toggle('active', isFront);
            btnBack.classList.toggle('active', !isFront);
          } else {
            sideGroup.style.display = 'none';
          }
        }
        zoomOverlay.classList.add('open');
      }
    }

    window.rcCustomZoomStep = function(dir) {
      stepStoreSet(dir);
    };

    window.rcCustomZoomSide = function(side) {
      if (activeZoomCat === 'shirts' || activeZoomCat === 'hoodies') {
        setCardSide(activeZoomCat, side);
      }
    };

    // Keyboard Left / Right arrow support on the showroom
    window.addEventListener('keydown', (e) => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT')) return;
      if (e.key === 'ArrowLeft') {
        stepStoreSet(-1);
      } else if (e.key === 'ArrowRight') {
        stepStoreSet(1);
      }
    });

    (function initFromQuery() {
      try {
        const sp = new URLSearchParams(window.location.search);
        const qFilter = sp.get('filter');
        const qSet = parseInt(sp.get('set') || '1', 10);
        const qSide = sp.get('side');
        if (VALID_SETS.includes(qSet)) state.setNum = qSet;
        if (qSide === 'front' || qSide === 'back') {
          state.sides.shirts = qSide;
          state.sides.hoodies = qSide;
        }
        applyF14Filter(qFilter || 'all');
        renderAllCards();
      } catch (_) {
        renderAllCards();
      }
    })();
  </script>
</body>
</html>
