<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Apex Wreckers: 3D Battle Cars</title>
  <style>
    body {
      margin: 0;
      min-height: 100dvh;
      background: #07080c;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .box {
      max-width: 360px;
      background: rgba(15, 23, 42, 0.92);
      border: 1.5px solid rgba(56, 189, 248, 0.4);
      border-radius: 18px;
      padding: 24px;
    }
    h1 { margin: 0 0 8px; font-size: 1.1rem; letter-spacing: 0.08em; color: #fbbf24; }
    p { margin: 0 0 18px; font-size: 0.92rem; color: #cbd5e1; line-height: 1.45; }
    button {
      background: linear-gradient(180deg, #38bdf8, #0284c7);
      border: none;
      color: #041019;
      font-weight: 800;
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 0.92rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>APEX WRECKERS: 3D BATTLE CARS</h1>
    <p>Connecting to the Apex Wreckers Arena servers. Check your internet connection if this screen stays visible.</p>
    <button type="button" onclick="window.location.replace('https://retrocanopy.com/shibuya_bot_pit.html?app=1')">RETRY CONNECTION</button>
  </div>
</body>
</html>
