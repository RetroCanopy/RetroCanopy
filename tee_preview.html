<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Retrocanopy â€” Heavyweight Boxy Streetwear Tees | Vault Drop</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800;900&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #000000;
      --neon-pink: #ff2d95;
      --neon-purple: #9d4edd;
      --neon-blue: #00d4ff;
      --sunset-orange: #ffae00;
      --text-color: #ffffff;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      min-height: 100vh;
      background: #000000;
      color: #ffffff;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow-x: hidden;
      user-select: none;
    }

    /* â”€â”€ 1. MINIMAL FLOATING SITE HEADER â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
    .site-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 300;
      padding: 18px 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(to bottom, rgba(0,0,0,0.88) 0%, rgba(0,0,0,0) 100%);
      pointer-events: none;
    }

    .site-header > * { pointer-events: auto; }

    .brand-link {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .nav-logo {
      width: 38px; height: 38px;
      object-fit: contain;
      mix-blend-mode: screen;
      transition: transform 0.3s ease;
    }

    .brand-link:hover .nav-logo { transform: scale(1.08); }

    .nav-wordmark {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.12rem;
      font-weight: 900;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .brand-text-base {
      background: linear-gradient(to bottom, var(--sunset-orange) 10%, var(--neon-pink) 90%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 10px rgba(255, 45, 149, 0.5));
    }

    .flicker-letter {
      background: linear-gradient(to bottom, var(--sunset-orange) 10%, var(--neon-pink) 90%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 10px rgba(255, 45, 149, 0.5));
      animation: smooth-neon-pulse 6s infinite ease-in-out;
    }

    @keyframes smooth-neon-pulse {
      0%, 100% { opacity: 1; }
      48% { opacity: 0.95; }
      51% { opacity: 0.42; }
      54% { opacity: 0.78; }
      57% { opacity: 0.48; }
      62% { opacity: 1; }
    }

    .nav-center {
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(10, 12, 22, 0.72);
      backdrop-filter: blur(12px);
      padding: 8px 20px;
      border-radius: 999px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .nav-center a {
      color: var(--muted);
      text-decoration: none;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.64rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: color 0.2s ease, text-shadow 0.2s ease;
    }

    .nav-center a:hover,
    .nav-center a.active {
      color: #ffffff;
      text-shadow: 0 0 12px rgba(255, 45, 149, 0.8);
    }

    .cart-pill {
      background: rgba(255, 45, 149, 0.14);
      color: #ffffff;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      padding: 8px 16px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
    }

    /* â”€â”€ 2. CENTER-STAGE FLOATING SHOWROOM (FRONT & BACK PAIR) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
    .showroom-viewport {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      perspective: 1300px;
      overflow: hidden;
    }

    .ambient-aura {
      position: absolute;
      width: 760px; height: 500px;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(255, 45, 149, 0.08) 0%, rgba(0, 212, 255, 0.04) 45%, transparent 72%);
      filter: blur(45px);
      pointer-events: none;
      z-index: 1;
    }

    .glide-arrow {
      position: fixed;
      top: 45%;
      transform: translateY(-50%);
      z-index: 260;
      width: 52px; height: 52px;
      border-radius: 50%;
      background: rgba(12, 15, 26, 0.65);
      backdrop-filter: blur(10px);
      border: none;
      color: #cbd5e1;
      font-family: 'Orbitron', sans-serif;
      font-size: 1.15rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.22s ease;
    }

    .glide-arrow:hover {
      color: #ffffff;
      background: rgba(255, 45, 149, 0.25);
      box-shadow: 0 0 22px rgba(255, 45, 149, 0.45);
      transform: translateY(-50%) scale(1.08);
    }

    .glide-prev { left: 32px; }
    .glide-next { right: 32px; }

    .pair-stage {
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 44px;
      margin-bottom: 92px;
    }

    .garment-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .garment-unit.hidden { display: none; }

    .levitate-front {
      animation: floatLevitate 4.1s ease-in-out infinite;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .levitate-back {
      animation: floatLevitate 4.1s ease-in-out infinite;
      animation-delay: -1.8s;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .garment-img {
      width: min(38vw, 420px);
      max-height: 60vh;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 38px 48px rgba(0, 0, 0, 0.96));
      transition: transform 0.16s ease-out, width 0.28s ease;
      pointer-events: none;
    }

    .pair-stage.solo-mode .garment-img {
      width: min(68vw, 510px);
      max-height: 64vh;
    }

    .view-tag {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.42);
    }

    @keyframes floatLevitate {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-18px); }
    }

    /* â”€â”€ 3. FLOATING BOTTOM HUD DOCK â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
    .hud-stack {
      position: fixed;
      bottom: 22px;
      z-index: 250;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .hud-selector-strip {
      display: flex;
      align-items: center;
      gap: 18px;
      background: rgba(10, 12, 20, 0.68);
      backdrop-filter: blur(16px);
      padding: 8px 20px;
      border-radius: 999px;
    }

    .view-switch { display: flex; align-items: center; gap: 6px; }

    .view-pill {
      background: transparent;
      border: none;
      color: var(--muted);
      font-family: 'Orbitron', sans-serif;
      font-size: 0.66rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 7px 13px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .view-pill:hover { color: #ffffff; }
    .view-pill.active {
      background: rgba(255, 45, 149, 0.22);
      color: #ffffff;
      box-shadow: 0 0 14px rgba(255, 45, 149, 0.35);
    }

    .strip-divider {
      width: 1px; height: 22px;
      background: rgba(255, 255, 255, 0.12);
    }

    .mini-thumbs { display: flex; align-items: center; gap: 16px; }

    .mini-thumb {
      cursor: pointer;
      opacity: 0.4;
      transition: all 0.22s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .mini-thumb:hover { opacity: 0.85; transform: translateY(-2px); }
    .mini-thumb.active { opacity: 1; transform: translateY(-3px); }

    .mini-thumb-pair { display: flex; align-items: center; gap: 2px; }
    .mini-thumb img { height: 36px; width: auto; object-fit: contain; }

    .mini-bar { width: 18px; height: 2px; border-radius: 2px; background: transparent; }
    .mini-thumb.active .mini-bar {
      background: var(--neon-blue);
      box-shadow: 0 0 8px var(--neon-blue);
    }

    .hud-dock {
      display: flex;
      align-items: center;
      gap: 28px;
      background: rgba(10, 12, 20, 0.78);
      backdrop-filter: blur(18px);
      padding: 13px 28px;
      border-radius: 999px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.88);
    }

    .hud-info { display: flex; flex-direction: column; gap: 2px; min-width: 260px; }
    .hud-kicker {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.62rem; font-weight: 700;
      letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--neon-blue);
    }

    .hud-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.95rem; font-weight: 800;
      letter-spacing: 0.06em; text-transform: uppercase;
      color: #ffffff;
    }

    .hud-specs { display: flex; align-items: center; gap: 14px; font-size: 0.8rem; color: var(--muted); }
    .hud-divider { width: 1px; height: 28px; background: rgba(255, 255, 255, 0.1); }

    .hud-price {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.25rem; font-weight: 900;
      background: linear-gradient(to right, var(--sunset-orange), var(--neon-pink));
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hud-buy-btn {
      background: linear-gradient(135deg, var(--sunset-orange) 0%, var(--neon-pink) 100%);
      border: none; color: #000000;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.74rem; font-weight: 900;
      letter-spacing: 0.14em; text-transform: uppercase;
      padding: 12px 24px; border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 45, 149, 0.45);
    }
  </style>
  <link rel="stylesheet" href="merch_minimal.css?v=85">
  <link rel="stylesheet" href="merch_zoom.css?v=4">
  <script src="merch_zoom.js?v=75" defer></script>
</head>
<body>

  <header class="site-header">
    <a href="index.html" class="brand-link">
      <img src="assets/logo.png" alt="Retrocanopy Logo" class="nav-logo">
      <div class="nav-wordmark">
        <span class="brand-text-base">RETROCAN</span><span class="flicker-letter">O</span><span class="brand-text-base">PY</span>
      </div>
    </a>

    <nav class="nav-center">
      <a href="index.html" class="nav-home-btn">&#8962; Home</a>
      <a href="hat_preview.html">Hat</a>
      <a href="deskmat_preview.html">Desk Mats</a>
      <a href="hoodie_preview.html">Hoodies</a>
      <a href="tee_preview.html" class="active">Tees</a>
      <a href="joggers_preview.html">Joggers</a>
      <a href="longsleeve_preview.html">Long-Sleeves</a>
      <a href="gearbag_preview.html">Misc</a>
    </nav>

    <div class="nav-right">
      <a href="index.html" class="nav-home-pill">&#8962; Home</a>
      <button class="cart-pill" id="bagBtn">Bag (0)</button>
    </div>
  </header>

  <main class="showroom-viewport">
    <div class="ambient-aura"></div>
    <button class="glide-arrow glide-prev" onclick="stepItem(-1)" aria-label="Previous Tee">&#8592;</button>

    <div class="pair-stage" id="pairStage">
      <div class="garment-unit" id="frontUnit" onclick="toggleSolo('front')">
        <div class="levitate-front">
          <img class="garment-img" id="frontImg" src="assets/merch/tee_opt1_front.png?v=1" alt="Tee Front View">
        </div>
        <span class="view-tag">FRONT</span>
      </div>

      <div class="garment-unit" id="backUnit" onclick="toggleSolo('back')">
        <div class="levitate-back">
          <img class="garment-img" id="backImg" src="assets/merch/tee_opt1_back.png?v=1" alt="Tee Back View">
        </div>
        <span class="view-tag">BACK</span>
      </div>
    </div>

    <button class="glide-arrow glide-next" onclick="stepItem(1)" aria-label="Next Tee">&#8594;</button>
  </main>

  <footer class="hud-stack">
    <div class="hud-selector-strip">
      <div class="view-switch">
        <button class="view-pill active" id="pillBoth" onclick="setViewMode('both')">Front &amp; Back</button>
        <button class="view-pill" id="pillFront" onclick="setViewMode('front')">Front Only</button>
        <button class="view-pill" id="pillBack" onclick="setViewMode('back')">Back Only</button>
      </div>
      <div class="strip-divider"></div>
      <div class="mini-thumbs" id="thumbStrip"></div>
    </div>

    <div class="hud-dock">
      <div class="hud-info">
        <span class="hud-kicker" id="hudKicker">RC-404</span>
        <span class="hud-title" id="hudTitle">Analog Cassette Mixtape Vol. 01 Tee</span>
      </div>
      <div class="hud-divider"></div>
      <div class="hud-specs" id="hudSpecs">
        <span>Front: Breast-Pocket Crest</span><span>â€¢</span><span>Back: Oversized Full Emblem</span><span>â€¢</span><span>Blank Sleeves</span>
      </div>
      <div class="hud-divider"></div>
      <div class="hud-price">$36</div>
      <button class="hud-buy-btn" onclick="addToBag(this)">Add to Bag</button>
    </div>
  </footer>

  <script>
    const teeOptions = [
      {
        model: 'RC-401',
        title: '86 Outrun Turbo Gullwing Tee',
        specs: '<span>Front: Turbo RPM Crest</span><span>â€¢</span><span>Back: Gullwing Supercar &amp; Sunset Tree</span><span>â€¢</span><span>Blank Sleeves</span>',
        front: 'assets/merch/tee_opt1_front.png?v=6',
        back: 'assets/merch/tee_opt1_back.png?v=6'
      },
      {
        model: 'RC-402',
        title: '16-Bit Arcade Cabinet Blueprint Tee',
        specs: '<span>Front: Insert Coin 25Â¢ Crest</span><span>â€¢</span><span>Back: Isometric Coin-Op Schematic</span><span>â€¢</span><span>Blank Sleeves</span>',
        front: 'assets/merch/tee_opt2_front.png?v=6',
        back: 'assets/merch/tee_opt2_back.png?v=6'
      },
      {
        model: 'RC-403',
        title: 'Tokyo Shibuya Cyber-Shrine Tee',
        specs: '<span>Front: Cyber Torii Hanko Seal</span><span>â€¢</span><span>Back: Neo-Tokyo Torii &amp; Sunset Tree</span><span>â€¢</span><span>Blank Sleeves</span>',
        front: 'assets/merch/tee_opt3_front.png?v=6',
        back: 'assets/merch/tee_opt3_back.png?v=6'
      },
      {
        model: 'RC-404',
        title: 'Analog Cassette Mixtape Vol. 01 Tee',
        specs: '<span>Front: C-90 Cassette Emblem (No Tree)</span><span>â€¢</span><span>Back: Chrome Cassette &amp; Neon Tape Ribbons</span><span>â€¢</span><span>Blank Sleeves</span>',
        front: 'assets/merch/tee_opt4_front.png?v=11',
        back: 'assets/merch/tee_opt4_back.png?v=11'
      },
      {
        model: 'RC-405',
        title: 'Boss Level Mecha-Valkyrie Tee',
        specs: '<span>Front: Cyber Visor Crest</span><span>â€¢</span><span>Back: Final-Boss Winged Mecha Guardian</span><span>â€¢</span><span>Blank Sleeves</span>',
        front: 'assets/merch/tee_opt5_front.png?v=6',
        back: 'assets/merch/tee_opt5_back.png?v=6'
      }
    ];

    let currentIdx = 3;
    let viewMode = 'both';
    let bagCount = 0;

    const pairStage = document.getElementById('pairStage');
    const frontUnit = document.getElementById('frontUnit');
    const backUnit = document.getElementById('backUnit');
    const frontImg = document.getElementById('frontImg');
    const backImg = document.getElementById('backImg');
    const hudKicker = document.getElementById('hudKicker');
    const hudTitle = document.getElementById('hudTitle');
    const hudSpecs = document.getElementById('hudSpecs');
    const thumbStrip = document.getElementById('thumbStrip');
    const pillBoth = document.getElementById('pillBoth');
    const pillFront = document.getElementById('pillFront');
    const pillBack = document.getElementById('pillBack');
    const bagBtn = document.getElementById('bagBtn');

    function updateShowroom() {
      const item = teeOptions[currentIdx];
      frontImg.src = item.front;
      backImg.src = item.back;
      hudKicker.textContent = item.model;
      hudTitle.textContent = item.title;
      hudSpecs.innerHTML = item.specs;

      frontUnit.classList.toggle('hidden', viewMode === 'back');
      backUnit.classList.toggle('hidden', viewMode === 'front');
      pairStage.classList.toggle('solo-mode', viewMode !== 'both');

      pillBoth.classList.toggle('active', viewMode === 'both');
      pillFront.classList.toggle('active', viewMode === 'front');
      pillBack.classList.toggle('active', viewMode === 'back');

      thumbStrip.innerHTML = '';
      teeOptions.forEach((it, idx) => {
        const div = document.createElement('div');
        div.className = 'mini-thumb' + (idx === currentIdx ? ' active' : '');
        div.title = `${it.model} â€” ${it.title}`;
        div.onclick = () => { currentIdx = idx; updateShowroom(); };
        thumbStrip.appendChild(div);
      });
    }

    function setViewMode(mode) { viewMode = mode; updateShowroom(); }
    function toggleSolo(which) { viewMode = (viewMode === which) ? 'both' : which; updateShowroom(); }
    function stepItem(dir) { currentIdx = (currentIdx + dir + teeOptions.length) % teeOptions.length; updateShowroom(); }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') stepItem(1);
      if (e.key === 'ArrowLeft') stepItem(-1);
    });

    window.addEventListener('mousemove', (e) => {
      const x = (e.clientX / window.innerWidth - 0.5) * 2;
      const y = (e.clientY / window.innerHeight - 0.5) * 2;
      frontImg.style.transform = `rotateY(${x * 8}deg) rotateX(${-y * 6}deg)`;
      backImg.style.transform = `rotateY(${x * 8}deg) rotateX(${-y * 6}deg)`;
    });

    function addToBag(btn) {
      bagCount++;
      bagBtn.textContent = `Bag (${bagCount})`;
      const orig = btn.textContent;
      btn.textContent = 'Added âœ“';
      setTimeout(() => { btn.textContent = orig; }, 900);
    }

    updateShowroom();
  </script>
</body>
</html>
