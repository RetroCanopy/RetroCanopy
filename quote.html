<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RetroCanopy — Official Project Quote &amp; Stripe Portal</title>
  <link rel="icon" type="image/png" href="assets/logo.png?v=275">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    @page {
      size: letter portrait;
      margin: 0.25in;
    }
    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 118, 20, 0.22), transparent 48%),
        radial-gradient(circle at 12% 45%, rgba(255, 94, 0, 0.11), transparent 42%),
        radial-gradient(circle at 88% 82%, rgba(255, 128, 24, 0.14), transparent 44%),
        #060508;
      color: #ffffff;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 22px 14px 48px;
      line-height: 1.4;
    }

    /* Top Floating Client/Owner Action Bar (Hidden when Printing PDF) */
    .top-action-dock {
      max-width: 920px;
      margin: 0 auto 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 10px 16px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(32, 24, 22, 0.88), rgba(12, 11, 16, 0.94));
      border: 1px solid rgba(255, 138, 38, 0.55);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.65), 0 0 22px rgba(255, 110, 16, 0.16);
      backdrop-filter: blur(18px);
    }
    .dock-pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 15px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.24);
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      font-family: 'Outfit', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }
    .dock-pill-btn:hover {
      transform: translateY(-1px);
      border-color: #ff9838;
      box-shadow: 0 6px 18px rgba(255, 118, 20, 0.28);
    }
    .dock-pill-btn.primary-pay {
      border: 1.5px solid #ffc285;
      background: linear-gradient(135deg, #ff9d33 0%, #ff5500 100%);
      color: #ffffff;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      box-shadow: 0 0 24px rgba(255, 102, 0, 0.48), inset 0 1px 0 rgba(255, 255, 255, 0.45);
    }

    /* =====================================================================
       CONCEPT #1: MOLTEN OBSIDIAN LIQUID GLASS EXECUTIVE QUOTE SHEET
       ===================================================================== */
    .c1-obsidian-sheet {
      max-width: 920px;
      margin: 0 auto;
      position: relative;
      background:
        radial-gradient(rgba(255, 255, 255, 0.036) 1px, transparent 1px) 0 0 / 6px 6px,
        radial-gradient(rgba(0, 0, 0, 0.55) 1px, transparent 1px) 3px 3px / 6px 6px,
        linear-gradient(180deg, #131218 0%, #0a090e 52%, #08070b 100%);
      border: 1.5px solid #ff8a26;
      border-radius: 28px;
      padding: 22px;
      box-shadow:
        0 34px 90px rgba(0, 0, 0, 0.92),
        0 0 54px rgba(255, 108, 12, 0.30),
        0 0 14px rgba(255, 138, 38, 0.35),
        inset 0 1.5px 0 rgba(255, 214, 168, 0.42),
        inset 0 -1px 0 rgba(255, 115, 16, 0.25);
    }

    /* Tier 1: Smoked Refractive Liquid Glass Header Banner */
    .c1-header-glass {
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
      background:
        linear-gradient(124deg, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0.05) 34%, rgba(18, 17, 23, 0.92) 45%, rgba(14, 13, 19, 0.96) 76%, rgba(42, 24, 14, 0.88) 100%);
      border: 1px solid rgba(255, 255, 255, 0.26);
      border-top-color: rgba(255, 255, 255, 0.42);
      border-radius: 20px;
      padding: 18px 24px;
      box-shadow:
        0 14px 34px rgba(0, 0, 0, 0.65),
        inset 0 1px 0 rgba(255, 255, 255, 0.36);
    }
    .c1-brand-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .c1-logo-ring {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      padding: 3px;
      background: radial-gradient(circle at 30% 25%, rgba(255, 200, 120, 0.55), rgba(255, 112, 16, 0.25) 60%, transparent 75%);
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 0 16px rgba(255, 122, 24, 0.52));
      flex-shrink: 0;
    }
    .c1-logo-ring img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 50%;
    }
    .c1-wordmark {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1.35rem, 3.2vw, 1.92rem);
      font-weight: 900;
      letter-spacing: 0.06em;
      background: linear-gradient(180deg, #ffe09e 0%, #ffa03a 48%, #ff5e00 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 18px rgba(255, 115, 0, 0.42));
    }
    .c1-header-right {
      text-align: right;
    }
    .c1-doc-title {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1.1rem, 2.4vw, 1.42rem);
      font-weight: 800;
      letter-spacing: 0.06em;
      color: #ffffff;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
    }
    .c1-ticket-row {
      margin-top: 6px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 0.82rem;
      color: rgba(255, 255, 255, 0.86);
    }
    .c1-ticket-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 152, 56, 0.88);
      background: linear-gradient(90deg, rgba(255, 122, 24, 0.26), rgba(34, 18, 8, 0.92));
      color: #ffd49e;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-decoration: none;
      box-shadow: 0 0 14px rgba(255, 118, 20, 0.30);
    }
    .c1-ticket-badge:hover {
      border-color: #ffffff;
      color: #ffffff;
    }

    /* Tier 2: Capabilities Glowing Neon-Orange Stadium Pill */
    .c1-capabilities-pill {
      margin-top: 13px;
      padding: 10px 20px;
      border-radius: 999px;
      border: 1.5px solid #ff8c28;
      background:
        linear-gradient(90deg, rgba(255, 115, 18, 0.22) 0%, rgba(19, 17, 24, 0.95) 28%, rgba(19, 17, 24, 0.95) 72%, rgba(255, 115, 18, 0.22) 100%);
      box-shadow:
        0 0 22px rgba(255, 110, 16, 0.30),
        inset 0 0 16px rgba(255, 128, 28, 0.16);
      text-align: center;
      font-size: 0.88rem;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: 0.02em;
    }

    /* Tier 3: Client & Project Ticket Bar */
    .c1-client-bar {
      margin-top: 11px;
      padding: 10px 18px;
      border-radius: 14px;
      border: 1.5px solid rgba(255, 138, 38, 0.82);
      background:
        linear-gradient(90deg, rgba(255, 108, 16, 0.14) 0%, rgba(17, 16, 22, 0.95) 50%, rgba(255, 108, 16, 0.14) 100%);
      box-shadow: 0 0 18px rgba(255, 110, 16, 0.20);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      text-align: center;
      font-size: 0.84rem;
      color: #f8fafc;
    }

    /* Verified Paid Banner (Shown Automatically When Quote Is Paid!) */
    .c1-paid-verified-banner {
      margin-top: 14px;
      padding: 16px 20px;
      border-radius: 18px;
      border: 1.5px solid #22f59b;
      background:
        radial-gradient(circle at 20% 0%, rgba(34, 245, 155, 0.24), transparent 60%),
        linear-gradient(135deg, rgba(12, 52, 36, 0.88), rgba(9, 24, 19, 0.96));
      box-shadow: 0 0 28px rgba(34, 245, 155, 0.24), inset 0 1px 0 rgba(255, 255, 255, 0.28);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    /* Tier 4: 50/50 Projected Finished Item + Overall Breakdown Per Item */
    .c1-mid-grid {
      display: grid;
      grid-template-columns: 1.04fr 0.96fr;
      gap: 15px;
      margin-top: 15px;
    }
    @media (max-width: 820px) {
      .c1-mid-grid,
      .c1-bottom-grid {
        grid-template-columns: 1fr !important;
      }
    }

    .c1-smoked-card {
      position: relative;
      background:
        linear-gradient(155deg, rgba(54, 52, 66, 0.46) 0%, rgba(24, 23, 31, 0.88) 38%, rgba(14, 13, 19, 0.96) 100%);
      border: 1px solid rgba(255, 255, 255, 0.20);
      border-top-color: rgba(255, 255, 255, 0.36);
      border-radius: 20px;
      padding: 16px 18px;
      box-shadow:
        0 14px 32px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.26);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .c1-card-heading {
      text-align: center;
      font-size: 0.84rem;
      font-weight: 800;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: #ffffff;
      margin-bottom: 12px;
    }
    .c1-mockup-frame {
      background: radial-gradient(circle at 50% 42%, rgba(255, 132, 34, 0.14), rgba(12, 11, 16, 0.92) 72%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .c1-mockup-frame img {
      width: 100%;
      max-height: 285px;
      object-fit: contain;
      display: block;
      border-radius: 10px;
      cursor: zoom-in;
    }

    .c1-kpi-2x2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .c1-kpi-box {
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 132, 32, 0.28), transparent 72%),
        linear-gradient(180deg, rgba(44, 28, 18, 0.90) 0%, rgba(19, 15, 14, 0.96) 100%);
      border: 1.5px solid #ff8c28;
      border-radius: 15px;
      padding: 15px 10px;
      text-align: center;
      box-shadow:
        0 0 18px rgba(255, 110, 16, 0.24),
        inset 0 0 14px rgba(255, 128, 28, 0.14);
    }
    .c1-kpi-number {
      font-family: 'Outfit', sans-serif;
      font-size: 1.72rem;
      font-weight: 800;
      color: #ffa23e;
      line-height: 1.08;
      text-shadow: 0 0 16px rgba(255, 128, 24, 0.42);
    }
    .c1-kpi-caption {
      font-size: 0.78rem;
      color: #e2e8f0;
      margin-top: 4px;
      font-weight: 500;
    }

    /* Tier 4.5: Authentic Item Description & Garment Specifications Card */
    .c1-item-desc-card {
      margin-top: 14px;
      background:
        linear-gradient(135deg, rgba(42, 34, 34, 0.55) 0%, rgba(17, 16, 22, 0.95) 100%);
      border: 1px solid rgba(255, 142, 44, 0.48);
      border-radius: 18px;
      padding: 14px 18px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.20);
    }
    .c1-desc-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 10px;
      margin-top: 8px;
    }
    .c1-desc-item {
      background: rgba(9, 8, 13, 0.76);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-left: 3px solid #ff8c28;
      border-radius: 12px;
      padding: 10px 13px;
    }

    /* Tier 5: Full Line-by-Line Itemized Table with Glowing Molten Laser Rules */
    .c1-table-shell {
      margin-top: 15px;
      background:
        linear-gradient(180deg, rgba(38, 37, 48, 0.68) 0%, rgba(14, 13, 19, 0.96) 100%);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-top-color: rgba(255, 255, 255, 0.36);
      border-radius: 20px;
      padding: 15px 0 6px;
      overflow: hidden;
      box-shadow:
        0 14px 32px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.24);
    }
    .c1-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.83rem;
    }
    .c1-table thead th {
      padding: 10px 13px;
      color: #ffffff;
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      border-top: 1px solid rgba(255, 255, 255, 0.14);
      border-bottom: 2px solid #ff8a24;
      box-shadow: 0 3px 12px rgba(255, 122, 24, 0.34);
      text-align: left;
    }
    .c1-table tbody td {
      padding: 10px 13px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      color: #f8fafc;
      vertical-align: middle;
    }
    .c1-table tbody tr.c1-laser-divider td {
      border-top: 1.5px solid #ff8a24;
      box-shadow: inset 0 4px 10px -4px rgba(255, 128, 24, 0.45);
    }
    .c1-line-subdesc {
      font-size: 0.69rem;
      color: rgba(255, 214, 174, 0.74);
      margin-top: 2px;
      line-height: 1.3;
    }

    /* Tier 6: Bottom Available S&S Colors + Stripe QR & Totals */
    .c1-bottom-grid {
      display: grid;
      grid-template-columns: 0.95fr 1.15fr;
      gap: 15px;
      margin-top: 15px;
    }
    .c1-orbs-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      padding: 4px 2px;
    }
    .c1-orb {
      width: 27px;
      height: 27px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.38);
      box-shadow:
        inset -3px -4px 6px rgba(0, 0, 0, 0.56),
        inset 3px 3px 6px rgba(255, 255, 255, 0.45),
        0 3px 7px rgba(0, 0, 0, 0.58);
      flex-shrink: 0;
    }
    .c1-orb.selected {
      outline: 2.5px solid #ff9436;
      outline-offset: 2px;
      box-shadow:
        0 0 14px rgba(255, 136, 36, 0.85),
        inset -3px -4px 6px rgba(0, 0, 0, 0.52),
        inset 3px 3px 6px rgba(255, 255, 255, 0.5);
    }

    .c1-qr-totals-split {
      display: grid;
      grid-template-columns: 148px minmax(0, 1fr);
      gap: 15px;
      align-items: center;
    }
    @media (max-width: 560px) {
      .c1-qr-totals-split {
        grid-template-columns: 1fr;
      }
    }
    .c1-qr-card {
      background: linear-gradient(160deg, rgba(36, 24, 16, 0.94), rgba(12, 10, 15, 0.98));
      border: 1.5px solid #ff8c28;
      border-radius: 15px;
      padding: 10px;
      text-align: center;
      box-shadow: 0 0 20px rgba(255, 110, 16, 0.25);
    }
    .c1-qr-card img {
      width: 118px;
      height: 118px;
      border-radius: 8px;
      display: block;
      margin: 0 auto;
      background: #ffffff;
    }
    .c1-disc-pill {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 14px;
      border-radius: 999px;
      border: 1.5px solid #ff8c28;
      background: linear-gradient(90deg, rgba(255, 118, 18, 0.20), rgba(28, 18, 12, 0.94));
      box-shadow: 0 0 16px rgba(255, 110, 16, 0.24);
      font-size: 0.85rem;
      font-weight: 600;
      margin: 7px 0;
    }
    .c1-grand-pill {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 18px;
      border-radius: 999px;
      border: 1.5px solid #ff9838;
      background: linear-gradient(90deg, rgba(255, 122, 20, 0.30), rgba(42, 20, 8, 0.96), rgba(255, 122, 20, 0.30));
      box-shadow:
        0 0 24px rgba(255, 106, 0, 0.42),
        inset 0 0 14px rgba(255, 148, 54, 0.24);
      margin-top: 8px;
    }

    .c1-approve-pay-cta {
      margin-top: 12px;
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 12px 20px;
      border-radius: 999px;
      border: 1.5px solid #ffc994;
      background: linear-gradient(135deg, #ffa036 0%, #ff5500 100%);
      color: #ffffff;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 0 26px rgba(255, 102, 0, 0.48), inset 0 1px 0 rgba(255, 255, 255, 0.45);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .c1-approve-pay-cta:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 34px rgba(255, 118, 20, 0.68), inset 0 1px 0 rgba(255, 255, 255, 0.6);
    }

    .spinner {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 3px solid rgba(255, 140, 42, 0.24);
      border-top-color: #ff8c24;
      margin: 0 auto 14px;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Zoom Lightbox for Projected Finished Item */
    .zoom-modal {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(4, 3, 7, 0.92);
      backdrop-filter: blur(12px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      cursor: zoom-out;
    }
    .zoom-modal.open { display: flex; }
    .zoom-modal img {
      max-width: 95vw;
      max-height: 90vh;
      border-radius: 18px;
      border: 1.5px solid #ff8c28;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.9), 0 0 40px rgba(255, 112, 16, 0.35);
    }

    @media print {
      body { padding: 0; background: #08070b; }
      .no-print { display: none !important; }
      .c1-obsidian-sheet { max-width: 100%; box-shadow: none; padding: 16px; }
    }

    /* Dynamic Poured-Resin Glossy Liquid Glass Surface Reflections */
    @keyframes moltenPulseSheet {
      0%, 100% {
        box-shadow:
          0 34px 95px rgba(0, 0, 0, 0.92),
          0 0 46px rgba(255, 108, 12, 0.32),
          inset 0 2px 1px rgba(255, 255, 255, 0.48);
      }
      50% {
        box-shadow:
          0 38px 110px rgba(0, 0, 0, 0.95),
          0 0 68px rgba(255, 132, 24, 0.50),
          inset 0 2px 2px rgba(255, 255, 255, 0.64);
      }
    }
    .c1-obsidian-sheet {
      overflow: hidden;
      animation: moltenPulseSheet 5.5s ease-in-out infinite;
    }
    .c1-obsidian-sheet::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(640px circle at var(--mx, 30%) var(--my, 16%), rgba(255, 216, 174, 0.16), transparent 58%),
        linear-gradient(122deg, rgba(255,255,255,0.17) 0%, rgba(255,255,255,0.04) 24%, transparent 45%);
      z-index: 0;
    }
    .c1-obsidian-sheet > * { position: relative; z-index: 1; }
    .c1-header-glass,
    .c1-smoked-card,
    .c1-item-desc-card,
    .c1-table-shell {
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 112%, rgba(255, 126, 22, 0.18), transparent 62%),
        linear-gradient(162deg, rgba(68, 64, 84, 0.82) 0%, rgba(22, 20, 30, 0.93) 48%, rgba(12, 11, 17, 0.98) 100%) !important;
      backdrop-filter: blur(28px) saturate(200%);
      -webkit-backdrop-filter: blur(28px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, 0.30) !important;
      box-shadow:
        0 18px 42px rgba(0, 0, 0, 0.62),
        inset 0 1.8px 1px rgba(255, 255, 255, 0.56),
        inset 0 -1px 14px rgba(255, 118, 20, 0.14) !important;
    }
    .c1-header-glass::before,
    .c1-smoked-card::before,
    .c1-item-desc-card::before,
    .c1-table-shell::before {
      content: "";
      position: absolute;
      top: 0;
      left: -8%;
      right: -8%;
      height: 45%;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(255,255,255,0.20) 0%, rgba(255,255,255,0.045) 58%, rgba(255,255,255,0) 100%);
      border-bottom-left-radius: 55% 32%;
      border-bottom-right-radius: 45% 24%;
    }
    .c1-header-glass > *,
    .c1-smoked-card > *,
    .c1-item-desc-card > *,
    .c1-table-shell > * { position: relative; z-index: 1; }
    .c1-kpi-box,
    .c1-capabilities-pill,
    .c1-disc-pill,
    .c1-grand-pill,
    .c1-qr-card {
      position: relative;
      overflow: hidden;
      box-shadow:
        0 10px 26px rgba(255, 102, 0, 0.28),
        inset 0 1.8px 1px rgba(255, 255, 255, 0.58),
        inset 0 -4px 12px rgba(255, 112, 16, 0.24) !important;
    }
    .c1-kpi-box::before,

          { v: 3,  dcw: 44,  ecPerBlock: 26, b1: 1, c1: 44, b2: 0, c2: 0,  align: [6, 22] },
          { v: 4,  dcw: 64,  ecPerBlock: 18, b1: 2, c1: 32, b2: 0, c2: 0,  align: [6, 26] },
          { v: 5,  dcw: 86,  ecPerBlock: 24, b1: 2, c1: 43, b2: 0, c2: 0,  align: [6, 30] },
          { v: 6,  dcw: 108, ecPerBlock: 16, b1: 4, c1: 27, b2: 0, c2: 0,  align: [6, 34] },
          { v: 7,  dcw: 124, ecPerBlock: 18, b1: 4, c1: 31, b2: 0, c2: 0,  align: [6, 22, 38] },

        ];
        let spec = VERSIONS_M[10];
        for (let v = 1; v <= 10; v++) {
          const lenBits = v <= 9 ? 8 : 16;
          if (bytes.length <= Math.floor((VERSIONS_M[v].dcw * 8 - 4 - lenBits) / 8)) {
            spec = VERSIONS_M[v];
            break;
          }
        }
        const safeBytes = bytes.slice(0, 210);
        const bits = [];
        const pushBits = (val, n) => { for (let i = n - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
        pushBits(0b0100, 4);
        pushBits(safeBytes.length, spec.v <= 9 ? 8 : 16);

        const dataCw = [];

        const gfExp = new Uint8Array(512), gfLog = new Uint8Array(256);
        let x = 1;
        for (let i = 0; i < 255; i++) { gfExp[i] = x; gfLog[x] = i; x <<= 1; if (x & 0x100) x ^= 0x11d; }

        const gfMul = (a, b) => (a === 0 || b === 0) ? 0 : gfExp[gfLog[a] + gfLog[b]];

        for (let i = 0; i < spec.ecPerBlock; i++) {
          const next = new Array(poly.length + 1).fill(0);

          }

        for (let ar of spec.align) for (let ac of spec.align) {

        return cv.toDataURL('image/png');

      function qRoundRect(ctx, x, y, w, h, r) {
        const rr = Math.max(0, Math.min(r, w / 2, h / 2));
        ctx.beginPath();
        ctx.moveTo(x + rr, y);
        ctx.lineTo(x + w - rr, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
        ctx.lineTo(x + w, y + h - rr);
        ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
        ctx.lineTo(x + rr, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
        ctx.lineTo(x, y + rr);
        ctx.quadraticCurveTo(x, y, x + rr, y);
        ctx.closePath();

      function qLiquidGlass(ctx, x, y, w, h, r, opts = {}) {
        ctx.save();

        ctx.shadowBlur = opts.moltenGlow ? 30 : 22;
        ctx.shadowOffsetY = opts.moltenGlow ? 5 : 10;
        qRoundRect(ctx, x, y, w, h, r);
        const bodyGrad = ctx.createLinearGradient(x, y, x + w * 0.32, y + h);
        bodyGrad.addColorStop(0, opts.topFill || 'rgba(64, 60, 78, 0.88)');
        bodyGrad.addColorStop(0.42, opts.midFill || 'rgba(21, 20, 29, 0.93)');
        bodyGrad.addColorStop(1, opts.botFill || 'rgba(11, 10, 16, 0.97)');
        ctx.fillStyle = bodyGrad;
        ctx.fill();
        ctx.shadowColor = 'transparent';
        ctx.shadowBlur = 0;
        ctx.shadowOffsetY = 0;
        qRoundRect(ctx, x, y, w, h, r);
        ctx.clip();

        const bottomGlow = ctx.createRadialGradient(x + w * 0.52, y + h * 1.06, 6, x + w * 0.52, y + h * 1.02, Math.max(w, h) * 0.72);
        bottomGlow.addColorStop(0, opts.warmCore || 'rgba(255, 132, 28, 0.24)');
        bottomGlow.addColorStop(0.50, 'rgba(255, 98, 10, 0.07)');
        bottomGlow.addColorStop(1, 'rgba(255, 98, 10, 0)');
        ctx.fillStyle = bottomGlow;
        ctx.fillRect(x, y, w, h);

        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + w, y);
        ctx.lineTo(x + w, y + h * 0.25);
        ctx.bezierCurveTo(x + w * 0.68, y + h * 0.14, x + w * 0.34, y + h * 0.52, x, y + h * 0.41);
        ctx.closePath();
        const glossGrad = ctx.createLinearGradient(x, y, x, y + h * 0.52);
        glossGrad.addColorStop(0, 'rgba(255, 255, 255, 0.27)');
        glossGrad.addColorStop(0.42, 'rgba(255, 255, 255, 0.085)');
        glossGrad.addColorStop(1, 'rgba(255, 255, 255, 0.008)');
        ctx.fillStyle = glossGrad;
        ctx.fill();

        const topLip = ctx.createLinearGradient(x, y, x + w, y);
        topLip.addColorStop(0, 'rgba(255, 255, 255, 0.18)');
        topLip.addColorStop(0.24, 'rgba(255, 255, 255, 0.76)');
        topLip.addColorStop(0.62, 'rgba(255, 226, 192, 0.44)');
        topLip.addColorStop(1, 'rgba(255, 152, 56, 0.24)');

        ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.moveTo(x + r * 0.55, y + 1.2);
        ctx.lineTo(x + w - r * 0.55, y + 1.2);
        ctx.stroke();
        ctx.restore();

        ctx.save();
        qRoundRect(ctx, x, y, w, h, r);
        if (opts.orangeBorder) {
          const bGrad = ctx.createLinearGradient(x, y, x + w, y + h);
          bGrad.addColorStop(0, '#ffd296');
          bGrad.addColorStop(0.32, '#ff9228');
          bGrad.addColorStop(0.72, '#ff5e00');
          bGrad.addColorStop(1, '#ffb45c');

        const descCardsHtml = descList.map((d) => `
          <div class="c1-desc-item">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px;">
              <strong style="color:#ffd089;font-size:0.83rem;">${esc(d.title || '')}</strong>
              ${d.badge ? `<span style="font-family:'Orbitron',sans-serif;font-size:0.65rem;padding:2px 8px;border-radius:999px;background:rgba(255,136,36,0.2);border:1px solid rgba(255,148,54,0.65);color:#ffb36b;">${esc(d.badge)}</span>` : ''}
            </div>
            <p style="font-size:0.75rem;color:rgba(255,255,255,0.82);line-height:1.42;">${esc(d.description || '')}</p>
          </div>
        `).join('');

        // Build Line-by-Line Table Rows with Item Description & Glowing Laser Dividers
        const getTier = (it) => it.isPrintOnly ? 'print' : (it.isYouth || /^Y/i.test(String(it.size || '')) ? 'youth' : 'adult');
        const tableRowsHtml = items.map((it, idx) => {
          const prev = idx > 0 ? items[idx - 1] : null;
          const laser = prev && (getTier(prev) !== getTier(it) || prev.sku !== it.sku || prev.colorName !== it.colorName);
          const szRaw = String(it.size || 'STD');
          const szDisp = it.isPrintOnly || szRaw === 'PRINT ONLY'
            ? 'PRINT ONLY'
            : (/^Y/i.test(szRaw) ? szRaw.replace(/^Y/i, 'Youth ') : (szRaw === 'S' ? 'Adult S' : szRaw));
          const key = it.isPrintOnly ? 'PRINT' : (String(it.sku || '').includes('CE10L') ? 'CE10L' : 'TT11');
          const lineDesc = it.itemDescription || FALLBACK_DESCRIPTIONS[key];

          return `
            <tr class="${laser ? 'c1-laser-divider' : ''}">
              <td style="text-align:center;color:rgba(255,255,255,0.78);font-weight:700;">${it.lineNumber || (idx + 1)}</td>
              <td>
                <div style="display:flex;align-items:center;gap:8px;">
                  <span style="width:12px;height:12px;border-radius:50%;background:${esc(it.colorHex || '#18181b')};border:1px solid rgba(255,255,255,0.6);display:inline-block;flex-shrink:0;"></span>
                  <strong style="color:#ffffff;">${esc(it.sku ? `${it.sku} — ${it.colorName || it.name || ''}` : (it.name || 'Custom Item'))}</strong>
                </div>
                <div class="c1-line-subdesc">${esc(lineDesc)}</div>
              </td>
              <td style="color:rgba(255,255,255,0.85);font-size:0.76rem;">${esc(it.printSpecs || 'Custom DTF Print')}</td>
              <td style="text-align:center;font-weight:700;color:${szDisp === 'PRINT ONLY' ? '#ff9d3b' : '#ffffff'};">${esc(szDisp)}</td>
              <td style="text-align:center;font-weight:700;">${Number(it.qty) || 1}</td>
              <td style="text-align:right;font-weight:600;">${money(it.priceUsd)}</td>
              <td style="text-align:right;font-weight:800;color:#ffffff;">${money(it.lineTotalUsd || ((Number(it.priceUsd) || 0) * (Number(it.qty) || 1)))}</td>
            </tr>
          `;
        }).join('');

        // Available Colors Orbs
        const colorsList = Array.isArray(meta.availableColors) && meta.availableColors.length > 0 ? meta.availableColors : DEFAULT_COLORS;
        const activeColors = new Set(items.map((i) => i.colorName).filter(Boolean));
        const orbsHtml = colorsList.map((col) => `
          <span
            class="c1-orb ${activeColors.has(col.name) ? 'selected' : ''}"
            style="background:radial-gradient(circle at 32% 28%, rgba(255,255,255,0.55) 0%, ${esc(col.hex)} 44%, #09080c 100%);"
            title="${esc(col.name)}"
          ></span>
        `).join('');

        const payPortalUrl = `https://axavvrqyzpwsczpiwmua.supabase.co/functions/v1/retrocanopy-stripe-checkout?q=${encodeURIComponent(resolvedTicket)}&amt=${grandTotal.toFixed(2)}`;
        const qrDataUrl = encodeQrMatrix(payPortalUrl);

        dynamicEl.style.padding = '0';
        dynamicEl.style.textAlign = 'left';
        dynamicEl.innerHTML = `
          <div class="c1-client-bar">
            <span><strong style="color:#ffd089;">PREPARED FOR:</strong> ${esc(clientDisplay)}</span>
            <span style="color:rgba(255,138,38,0.8);">|</span>
            <span><strong style="color:#ffd089;">PROJECT:</strong> ${esc(projectDisplay)}</span>
            <span style="color:rgba(255,138,38,0.8);">|</span>
            <span><strong style="color:#ffd089;">PROJECT TICKET:</strong> <a href="admin.html?tab=bulkquote&ticket=${encodeURIComponent(resolvedTicket)}" style="color:#ffb36b;font-weight:800;text-decoration:underline;">#${esc(resolvedTicket)}</a></span>
            ${contactParts ? `<div style="width:100%;font-size:0.76rem;color:rgba(255,255,255,0.76);margin-top:2px;">${esc(contactParts)}</div>` : ''}
            ${meta.customerNotesText ? `<div style="width:100%;font-size:0.76rem;color:#ffd089;margin-top:2px;"><strong>Project Notes:</strong> ${esc(meta.customerNotesText)}</div>` : ''}
          </div>

          ${paidBannerHtml}

          <!-- TIER 4: PROJECTED FINISHED ITEM + OVERALL BREAKDOWN PER ITEM -->
          <div class="c1-mid-grid">
            <div class="c1-smoked-card">
              <div class="c1-card-heading">PROJECTED FINISHED ITEM</div>
              <div class="c1-mockup-frame">
                <img src="${esc(mockupImgSrc)}" alt="Projected Finished Garment" id="qProjectedFinishImg" title="Click to enlarge Projected Finished Item">
              </div>
              <div style="text-align:center;font-size:0.7rem;color:rgba(255,210,164,0.75);margin-top:8px;">
                Photorealistic S&amp;S Dri-Fit Finish &bull; Click image to inspect full-size detail
              </div>
            </div>

            <div class="c1-smoked-card">
              <div>
                <div class="c1-card-heading">OVERALL BREAKDOWN PER ITEM</div>
                <div class="c1-kpi-2x2">
                  <div class="c1-kpi-box">
                    <div class="c1-kpi-number">${totalShirts}</div>
                    <div class="c1-kpi-caption">Total Items</div>
                  </div>
                  <div class="c1-kpi-box">
                    <div class="c1-kpi-number">${money(basePerItem)}</div>
                    <div class="c1-kpi-caption">Base/Item</div>
                  </div>
                  <div class="c1-kpi-box">
                    <div class="c1-kpi-number">${discountPct}%</div>
                    <div class="c1-kpi-caption">${discountPct > 0 ? esc(discountLabel) : 'Discount'}</div>
                  </div>
                  <div class="c1-kpi-box">
                    <div class="c1-kpi-number">${money(finalPerItem)}</div>
                    <div class="c1-kpi-caption">Final/Item</div>
                  </div>
                </div>
              </div>
              ${miniGroupHtml ? `<div style="display:flex;flex-direction:column;gap:6px;margin-top:11px;">${miniGroupHtml}</div>` : ''}
            </div>
          </div>

          <!-- TIER 4.5: ITEM DESCRIPTION & GARMENT SPECIFICATIONS -->
          ${descCardsHtml ? `
            <div class="c1-item-desc-card">
              <div class="c1-card-heading" style="margin-bottom:4px;">ITEM DESCRIPTION &amp; GARMENT SPECIFICATIONS</div>
              <div class="c1-desc-grid">
                ${descCardsHtml}
              </div>
            </div>
          ` : ''}

          <!-- TIER 5: FULL LINE-BY-LINE ITEMIZED BREAKDOWN -->
          <div class="c1-table-shell">
            <div class="c1-card-heading" style="margin-bottom:8px;">ITEMIZED QUOTE BREAKDOWN (LINE BY LINE)</div>
            <div style="overflow-x:auto;">
              <table class="c1-table">
                <thead>
                  <tr>
                    <th style="width:52px;text-align:center;">Line</th>
                    <th>Garment, Color &amp; Item Description</th>
                    <th>Print Specs</th>
                    <th style="text-align:center;">Size</th>
                    <th style="text-align:center;">Qty</th>
                    <th style="text-align:right;">Unit Price</th>
                    <th style="text-align:right;">Line Total</th>
                  </tr>
                </thead>
                <tbody>
                  ${tableRowsHtml}
                </tbody>
              </table>
            </div>
          </div>

          <!-- TIER 6: AVAILABLE S&S COLORS + LIVE STRIPE QR & TOTALS -->
          <div class="c1-bottom-grid">
            <div class="c1-smoked-card">
              <div>
                <div class="c1-card-heading" style="margin-bottom:4px;">AVAILABLE S&amp;S COLORS</div>
                <div style="text-align:center;font-size:0.72rem;color:rgba(255,210,164,0.82);margin-bottom:10px;">
                  ${esc(meta.primaryStyleLabel || `Official S&S Performance Palette (${colorsList.length} Colors)`)}
                </div>
                <div class="c1-orbs-grid">
                  ${orbsHtml}
                </div>
              </div>
              <div style="text-align:center;font-size:0.69rem;color:rgba(255,255,255,0.58);margin-top:10px;">
                Selected order color(s) highlighted in molten orange
              </div>
            </div>

            <div class="c1-smoked-card">
              <div class="c1-qr-totals-split">
                <div class="c1-qr-card">
                  <a href="${esc(payPortalUrl)}" target="_blank" rel="noopener noreferrer" title="Scan or click for Live Stripe Checkout">
                    <img src="${qrDataUrl}" alt="Scan for Stripe Checkout">
                  </a>
                  <div style="font-family:'Orbitron',sans-serif;font-size:0.63rem;font-weight:800;color:#ffb36b;margin-top:7px;letter-spacing:0.05em;">
                    SCAN TO PAY (STRIPE)
                  </div>
                  <div style="font-size:0.62rem;color:${isPaid ? '#22f59b' : '#ffd089'};margin-top:2px;font-weight:700;">
                    ${isPaid ? '&#10003; PAID IN FULL' : '&#9679; Card / Apple Pay'}
                  </div>
                </div>

                <div>
                  <div style="display:flex;justify-content:space-between;align-items:center;padding:4px 6px;font-size:0.9rem;color:#f1f5f9;">
                    <span>Subtotal:</span>
                    <strong>${money(subtotalBefore)}</strong>
                  </div>

                  <div class="c1-disc-pill">
                    <span>${discountPct}% OFF ${esc(discountLabel)}:</span>
                    <strong style="color:#ffa23e;">${discountAmt > 0 ? '&minus;' + money(discountAmt) : '$0.00'}</strong>
                  </div>

                  <div style="display:flex;justify-content:space-between;align-items:center;padding:4px 6px;font-size:0.88rem;color:#f1f5f9;">
                    <span>${includeTax ? `Tax Included (${taxRatePct.toFixed(2)}%):` : 'Tax Excluded:'}</span>
                    <strong>${money(taxAmt)}</strong>
                  </div>

                  <div class="c1-grand-pill">
                    <span style="font-family:'Orbitron',sans-serif;font-size:0.88rem;font-weight:800;color:#ffffff;">GRAND TOTAL:</span>
                    <span style="font-family:'Orbitron',sans-serif;font-size:1.22rem;font-weight:900;color:#ffa23e;">${money(grandTotal)}</span>
                  </div>

                  ${!isPaid ? `
                    <button type="button" class="c1-approve-pay-cta no-print js-pay-quote-trigger" id="sheetApprovePayBtn">
                      &#128179; Approve &amp; Pay Quote (${money(grandTotal)}) via Stripe
                    </button>
                  ` : ''}
                </div>
              </div>
            </div>
          </div>
        `;

        document.getElementById('qProjectedFinishImg')?.addEventListener('click', (ev) => {
          const zModal = document.getElementById('mockupZoomModal');
          const zImg = document.getElementById('mockupZoomImg');
          if (zModal && zImg) {
            zImg.src = ev.currentTarget.src;
            zModal.classList.add('open');
          }
        });

        document.getElementById('sheetApprovePayBtn')?.addEventListener('click', triggerStripePayment);
      }

      async function loadQuoteDossier() {
        if (!ticketId) {
          dynamicEl.innerHTML = `
            <h2 style="font-family:'Orbitron',sans-serif;font-size:1.05rem;color:#ff9e6b;">Missing Project Ticket Number</h2>
            <p style="font-size:0.86rem;color:rgba(255,255,255,0.75);margin-top:8px;">Open this page from your official RetroCanopy Quote link or scan the QR code on your quote sheet.</p>
          `;
          return;
        }

        // If returning from Stripe Checkout success, verify payment first so cloud DB + Owner's Hub update immediately!
        if (isSuccess && sessionId) {
          try {
            const vRes = await fetch(EDGE_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                action: 'verify_session',
                sessionId,
                ticketId,
                quoteId: ticketId
              })
            });
            const vData = await vRes.json();
            if (vRes.ok && vData && vData.paid) sendPaidQuoteOwnerAlert(vData);
          } catch (_) {}
        }

        try {
          const res = await fetch(EDGE_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              action: 'get_quote_by_ticket',
              ticketId
            })
          });
          const data = await res.json();
          if (!res.ok || !data.ok) {
            throw new Error(data.error || `Ticket #${ticketId} could not be found.`);
          }
          renderDossier(data);
        } catch (err) {
          dynamicEl.innerHTML = `
            <h2 style="font-family:'Orbitron',sans-serif;font-size:1.05rem;color:#ff9e6b;">Unable to Load Ticket #${esc(ticketId)}</h2>
            <p style="font-size:0.85rem;color:rgba(255,255,255,0.74);margin-top:8px;">${esc(err.message || String(err))}</p>
          `;
        }
      }

      loadQuoteDossier();
    })();
  </script>
</body>
</html>
