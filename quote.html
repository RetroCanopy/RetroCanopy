<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RetroCanopy — Official Project Quote &amp; Stripe Portal</title>
  <link rel="icon" type="image/png" href="assets/logo.png?v=275">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    @page {
      size: letter portrait;
      margin: 0.25in;
    }
    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 118, 20, 0.22), transparent 48%),
        radial-gradient(circle at 12% 45%, rgba(255, 94, 0, 0.11), transparent 42%),
        radial-gradient(circle at 88% 82%, rgba(255, 128, 24, 0.14), transparent 44%),
        #060508;
      color: #ffffff;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 22px 14px 48px;
      line-height: 1.4;
    }

    /* Top Floating Client/Owner Action Bar (Hidden when Printing PDF) */
    .top-action-dock {
      max-width: 920px;
      margin: 0 auto 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 10px 16px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(32, 24, 22, 0.88), rgba(12, 11, 16, 0.94));
      border: 1px solid rgba(255, 138, 38, 0.55);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.65), 0 0 22px rgba(255, 110, 16, 0.16);
      backdrop-filter: blur(18px);
    }
    .dock-pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 15px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.24);
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      font-family: 'Outfit', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }
    .dock-pill-btn:hover {
      transform: translateY(-1px);
      border-color: #ff9838;
      box-shadow: 0 6px 18px rgba(255, 118, 20, 0.28);
    }
    .dock-pill-btn.primary-pay {
      border: 1.5px solid #ffc285;
      background: linear-gradient(135deg, #ff9d33 0%, #ff5500 100%);
      color: #ffffff;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      box-shadow: 0 0 24px rgba(255, 102, 0, 0.48), inset 0 1px 0 rgba(255, 255, 255, 0.45);
    }

    /* =====================================================================
       CONCEPT #1: MOLTEN OBSIDIAN LIQUID GLASS EXECUTIVE QUOTE SHEET
       ===================================================================== */
    .c1-obsidian-sheet {
      max-width: 920px;
      margin: 0 auto;
      position: relative;
      background:
        radial-gradient(rgba(255, 255, 255, 0.036) 1px, transparent 1px) 0 0 / 6px 6px,
        radial-gradient(rgba(0, 0, 0, 0.55) 1px, transparent 1px) 3px 3px / 6px 6px,
        linear-gradient(180deg, #131218 0%, #0a090e 52%, #08070b 100%);
      border: 1.5px solid #ff8a26;
      border-radius: 28px;
      padding: 22px;
      box-shadow:
        0 34px 90px rgba(0, 0, 0, 0.92),
        0 0 54px rgba(255, 108, 12, 0.30),
        0 0 14px rgba(255, 138, 38, 0.35),
        inset 0 1.5px 0 rgba(255, 214, 168, 0.42),
        inset 0 -1px 0 rgba(255, 115, 16, 0.25);
    }

    /* Tier 1: Smoked Refractive Liquid Glass Header Banner */
    .c1-header-glass {
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
      background:
        linear-gradient(124deg, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0.05) 34%, rgba(18, 17, 23, 0.92) 45%, rgba(14, 13, 19, 0.96) 76%, rgba(42, 24, 14, 0.88) 100%);
      border: 1px solid rgba(255, 255, 255, 0.26);
      border-top-color: rgba(255, 255, 255, 0.42);
      border-radius: 20px;
      padding: 18px 24px;
      box-shadow:
        0 14px 34px rgba(0, 0, 0, 0.65),
        inset 0 1px 0 rgba(255, 255, 255, 0.36);
    }
    .c1-brand-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .c1-logo-ring {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      padding: 3px;
      background: radial-gradient(circle at 30% 25%, rgba(255, 200, 120, 0.55), rgba(255, 112, 16, 0.25) 60%, transparent 75%);
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 0 16px rgba(255, 122, 24, 0.52));
      flex-shrink: 0;
    }
    .c1-logo-ring img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 50%;
    }
    .c1-wordmark {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1.35rem, 3.2vw, 1.92rem);
      font-weight: 900;
      letter-spacing: 0.06em;
      background: linear-gradient(180deg, #ffe09e 0%, #ffa03a 48%, #ff5e00 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 18px rgba(255, 115, 0, 0.42));
    }
    .c1-header-right {
      text-align: right;
    }
    .c1-doc-title {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1.1rem, 2.4vw, 1.42rem);
      font-weight: 800;
      letter-spacing: 0.06em;
      color: #ffffff;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
    }
    .c1-ticket-row {
      margin-top: 6px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 0.82rem;
      color: rgba(255, 255, 255, 0.86);
    }
    .c1-ticket-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 152, 56, 0.88);
      background: linear-gradient(90deg, rgba(255, 122, 24, 0.26), rgba(34, 18, 8, 0.92));
      color: #ffd49e;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-decoration: none;
      box-shadow: 0 0 14px rgba(255, 118, 20, 0.30);
    }
    .c1-ticket-badge:hover {
      border-color: #ffffff;
      color: #ffffff;
    }

    /* Tier 2: Capabilities Glowing Neon-Orange Stadium Pill */
    .c1-capabilities-pill {
      margin-top: 13px;
      padding: 10px 20px;
      border-radius: 999px;
      border: 1.5px solid #ff8c28;
      background:
        linear-gradient(90deg, rgba(255, 115, 18, 0.22) 0%, rgba(19, 17, 24, 0.95) 28%, rgba(19, 17, 24, 0.95) 72%, rgba(255, 115, 18, 0.22) 100%);
      box-shadow:
        0 0 22px rgba(255, 110, 16, 0.30),
        inset 0 0 16px rgba(255, 128, 28, 0.16);
      text-align: center;
      font-size: 0.88rem;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: 0.02em;
    }

    /* Tier 3: Client & Project Ticket Bar */
    .c1-client-bar {
      margin-top: 11px;
      padding: 10px 18px;
      border-radius: 14px;
      border: 1.5px solid rgba(255, 138, 38, 0.82);
      background:
        linear-gradient(90deg, rgba(255, 108, 16, 0.14) 0%, rgba(17, 16, 22, 0.95) 50%, rgba(255, 108, 16, 0.14) 100%);
      box-shadow: 0 0 18px rgba(255, 110, 16, 0.20);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      text-align: center;
      font-size: 0.84rem;
      color: #f8fafc;
    }

    /* Verified Paid Banner (Shown Automatically When Quote Is Paid!) */
    .c1-paid-verified-banner {
      margin-top: 14px;
      padding: 16px 20px;
      border-radius: 18px;
      border: 1.5px solid #22f59b;
      background:
        radial-gradient(circle at 20% 0%, rgba(34, 245, 155, 0.24), transparent 60%),
        linear-gradient(135deg, rgba(12, 52, 36, 0.88), rgba(9, 24, 19, 0.96));
      box-shadow: 0 0 28px rgba(34, 245, 155, 0.24), inset 0 1px 0 rgba(255, 255, 255, 0.28);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    /* Tier 4: 50/50 Projected Finished Item + Overall Breakdown Per Item */
    .c1-mid-grid {
      display: grid;
      grid-template-columns: 1.04fr 0.96fr;
      gap: 15px;
      margin-top: 15px;
    }
    @media (max-width: 820px) {
      .c1-mid-grid,
      .c1-bottom-grid {
        grid-template-columns: 1fr !important;
      }
    }

    .c1-smoked-card {
      position: relative;
      background:
        linear-gradient(155deg, rgba(54, 52, 66, 0.46) 0%, rgba(24, 23, 31, 0.88) 38%, rgba(14, 13, 19, 0.96) 100%);
      border: 1px solid rgba(255, 255, 255, 0.20);
      border-top-color: rgba(255, 255, 255, 0.36);
      border-radius: 20px;
      padding: 16px 18px;
      box-shadow:
        0 14px 32px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.26);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .c1-card-heading {
      text-align: center;
      font-size: 0.84rem;
      font-weight: 800;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: #ffffff;
      margin-bottom: 12px;
    }
    .c1-mockup-frame {
      background: radial-gradient(circle at 50% 42%, rgba(255, 132, 34, 0.14), rgba(12, 11, 16, 0.92) 72%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .c1-mockup-frame img {
      width: 100%;
      max-height: 285px;
      object-fit: contain;
      display: block;
      border-radius: 10px;
      cursor: zoom-in;
    }

    .c1-kpi-2x2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .c1-kpi-box {
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 132, 32, 0.28), transparent 72%),
        linear-gradient(180deg, rgba(44, 28, 18, 0.90) 0%, rgba(19, 15, 14, 0.96) 100%);
      border: 1.5px solid #ff8c28;
      border-radius: 15px;
      padding: 15px 10px;
      text-align: center;
      box-shadow:
        0 0 18px rgba(255, 110, 16, 0.24),
        inset 0 0 14px rgba(255, 128, 28, 0.14);
    }
    .c1-kpi-number {
      font-family: 'Outfit', sans-serif;
      font-size: 1.72rem;
      font-weight: 800;
      color: #ffa23e;
      line-height: 1.08;
      text-shadow: 0 0 16px rgba(255, 128, 24, 0.42);
    }
    .c1-kpi-caption {
      font-size: 0.78rem;
      color: #e2e8f0;
      margin-top: 4px;
      font-weight: 500;
    }

    /* Tier 4.5: Authentic Item Description & Garment Specifications Card */
    .c1-item-desc-card {
      margin-top: 14px;
      background:
        linear-gradient(135deg, rgba(42, 34, 34, 0.55) 0%, rgba(17, 16, 22, 0.95) 100%);
      border: 1px solid rgba(255, 142, 44, 0.48);
      border-radius: 18px;
      padding: 14px 18px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.20);
    }
    .c1-desc-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 10px;
      margin-top: 8px;
    }
    .c1-desc-item {
      background: rgba(9, 8, 13, 0.76);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-left: 3px solid #ff8c28;
      border-radius: 12px;
      padding: 10px 13px;
    }

    /* Tier 5: Full Line-by-Line Itemized Table with Glowing Molten Laser Rules */
    .c1-table-shell {
      margin-top: 15px;
      background:
        linear-gradient(180deg, rgba(38, 37, 48, 0.68) 0%, rgba(14, 13, 19, 0.96) 100%);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-top-color: rgba(255, 255, 255, 0.36);
      border-radius: 20px;
      padding: 15px 0 6px;
      overflow: hidden;
      box-shadow:
        0 14px 32px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.24);
    }
    .c1-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.83rem;
    }
    .c1-table thead th {
      padding: 10px 13px;
      color: #ffffff;
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      border-top: 1px solid rgba(255, 255, 255, 0.14);
      border-bottom: 2px solid #ff8a24;
      box-shadow: 0 3px 12px rgba(255, 122, 24, 0.34);
      text-align: left;
    }
    .c1-table tbody td {
      padding: 10px 13px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      color: #f8fafc;
      vertical-align: middle;
    }
    .c1-table tbody tr.c1-laser-divider td {
      border-top: 1.5px solid #ff8a24;
      box-shadow: inset 0 4px 10px -4px rgba(255, 128, 24, 0.45);
    }
    .c1-line-subdesc {
      font-size: 0.69rem;
      color: rgba(255, 214, 174, 0.74);
      margin-top: 2px;
      line-height: 1.3;
    }

    /* Tier 6: Bottom Available S&S Colors + Stripe QR & Totals */
    .c1-bottom-grid {
      display: grid;
      grid-template-columns: 0.95fr 1.15fr;
      gap: 15px;
      margin-top: 15px;
    }
    .c1-orbs-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      padding: 4px 2px;
    }
    .c1-orb {
      width: 27px;
      height: 27px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.38);
      box-shadow:
        inset -3px -4px 6px rgba(0, 0, 0, 0.56),
        inset 3px 3px 6px rgba(255, 255, 255, 0.45),
        0 3px 7px rgba(0, 0, 0, 0.58);
      flex-shrink: 0;
    }
    .c1-orb.selected {
      outline: 2.5px solid #ff9436;
      outline-offset: 2px;
      box-shadow:
        0 0 14px rgba(255, 136, 36, 0.85),
        inset -3px -4px 6px rgba(0, 0, 0, 0.52),
        inset 3px 3px 6px rgba(255, 255, 255, 0.5);
    }

    .c1-qr-totals-split {
      display: grid;
      grid-template-columns: 148px minmax(0, 1fr);
      gap: 15px;
      align-items: center;
    }
    @media (max-width: 560px) {
      .c1-qr-totals-split {
        grid-template-columns: 1fr;
      }
    }
    .c1-qr-card {
      background: linear-gradient(160deg, rgba(36, 24, 16, 0.94), rgba(12, 10, 15, 0.98));
      border: 1.5px solid #ff8c28;
      border-radius: 15px;
      padding: 10px;
      text-align: center;
      box-shadow: 0 0 20px rgba(255, 110, 16, 0.25);
    }
    .c1-qr-card img {
      width: 118px;
      height: 118px;
      border-radius: 8px;
      display: block;
      margin: 0 auto;
      background: #ffffff;
    }
    .c1-disc-pill {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 14px;
      border-radius: 999px;
      border: 1.5px solid #ff8c28;
      background: linear-gradient(90deg, rgba(255, 118, 18, 0.20), rgba(28, 18, 12, 0.94));
      box-shadow: 0 0 16px rgba(255, 110, 16, 0.24);
      font-size: 0.85rem;
      font-weight: 600;
      margin: 7px 0;
    }
    .c1-grand-pill {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 18px;
      border-radius: 999px;
      border: 1.5px solid #ff9838;
      background: linear-gradient(90deg, rgba(255, 122, 20, 0.30), rgba(42, 20, 8, 0.96), rgba(255, 122, 20, 0.30));
      box-shadow:
        0 0 24px rgba(255, 106, 0, 0.42),
        inset 0 0 14px rgba(255, 148, 54, 0.24);
      margin-top: 8px;
    }

    .c1-approve-pay-cta {
      margin-top: 12px;
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 12px 20px;
      border-radius: 999px;
      border: 1.5px solid #ffc994;
      background: linear-gradient(135deg, #ffa036 0%, #ff5500 100%);
      color: #ffffff;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 0 26px rgba(255, 102, 0, 0.48), inset 0 1px 0 rgba(255, 255, 255, 0.45);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .c1-approve-pay-cta:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 34px rgba(255, 118, 20, 0.68), inset 0 1px 0 rgba(255, 255, 255, 0.6);
    }

    .spinner {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 3px solid rgba(255, 140, 42, 0.24);
      border-top-color: #ff8c24;
      margin: 0 auto 14px;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Zoom Lightbox for Projected Finished Item */
    .zoom-modal {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(4, 3, 7, 0.92);
      backdrop-filter: blur(12px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      cursor: zoom-out;
    }
    .zoom-modal.open { display: flex; }
    .zoom-modal img {
      max-width: 95vw;
      max-height: 90vh;
      border-radius: 18px;
      border: 1.5px solid #ff8c28;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.9), 0 0 40px rgba(255, 112, 16, 0.35);
    }

    @media print {
      body { padding: 0; background: #08070b; }
      .no-print { display: none !important; }
      .c1-obsidian-sheet { max-width: 100%; box-shadow: none; padding: 16px; }
    }
  </style>
</head>
<body>
  <!-- Top Interactive Controls Bar -->
  <nav class="top-action-dock no-print" id="topActionDock">
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
      <a href="index.html" class="dock-pill-btn">&larr; RetroCanopy.com</a>
      <a href="admin.html?tab=bulkquote" id="dockProjectTicketStudioLink" class="dock-pill-btn" style="border-color:rgba(255,152,56,0.65);color:#ffd099;" title="Open this Project Ticket directly in Owner's Hub Studio">
        &#127915; Open Project Ticket
      </a>
    </div>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
      <button type="button" class="dock-pill-btn" id="dockCopyLinkBtn">&#128279; Copy Quote Link</button>
      <button type="button" class="dock-pill-btn" onclick="window.print()">&#128424; Print / Save PDF</button>
      <button type="button" class="dock-pill-btn primary-pay" id="dockPayStripeBtn" style="display:none;">&#128179; Pay via Stripe</button>
    </div>
  </nav>

  <!-- Main Concept #1 Molten Obsidian Executive Quote Sheet -->
  <main class="c1-obsidian-sheet" id="quoteSheetRoot">
    <header class="c1-header-glass">
      <div class="c1-brand-left">
        <div class="c1-logo-ring">
          <img src="assets/logo.png" alt="RetroCanopy Official Logo">
        </div>
        <div class="c1-wordmark">RETROCANOPY</div>
      </div>
      <div class="c1-header-right">
        <div class="c1-doc-title" id="qDocTitle">OFFICIAL QUOTE</div>
        <div class="c1-ticket-row">
          <a href="#" id="qTicketBadge" class="c1-ticket-badge" title="Official Project Ticket Link">TICKET #LOADING</a>
          <span id="qIssuedDate">Loading project...</span>
        </div>
      </div>
    </header>

    <div class="c1-capabilities-pill">
      Apparel &bull; Websites &bull; Marketing &bull; Apps &bull; Games &bull; Custom 3D Prints
    </div>

    <div id="quoteDynamicContent" style="padding:38px 18px;text-align:center;">
      <div class="spinner"></div>
      <h2 style="font-family:'Orbitron',sans-serif;font-size:1.05rem;color:#ffd089;">Loading Official Project Dossier...</h2>
      <p style="font-size:0.84rem;color:rgba(255,255,255,0.7);margin-top:6px;">Retrieving itemized specifications, finished garment preview &amp; live Stripe checkout.</p>
    </div>
  </main>

  <div class="zoom-modal no-print" id="mockupZoomModal" onclick="this.classList.remove('open')">
    <img id="mockupZoomImg" src="" alt="Zoomed Projected Finished Item">
  </div>

  <script>
    (function () {
      const EDGE_URL = 'https://axavvrqyzpwsczpiwmua.supabase.co/functions/v1/retrocanopy-stripe-checkout';
      const params = new URLSearchParams(window.location.search);
      const ticketId = (params.get('ticket') || params.get('q') || params.get('order_id') || '').trim();
      const isSuccess = params.get('stripe_quote_success') === '1';
      const sessionId = (params.get('session_id') || '').trim();

      const dynamicEl = document.getElementById('quoteDynamicContent');

      // Compact ISO/IEC 18004 QR Encoder (Versions 1..10, ECC M)
      function encodeQrMatrix(text) {
        const bytes = Array.from(new TextEncoder().encode(String(text || '')));
        const VERSIONS_M = [
          null,
          { v: 1,  dcw: 16,  ecPerBlock: 10, b1: 1, c1: 16, b2: 0, c2: 0,  align: [] },
          { v: 2,  dcw: 28,  ecPerBlock: 16, b1: 1, c1: 28, b2: 0, c2: 0,  align: [6, 18] },
          { v: 3,  dcw: 44,  ecPerBlock: 26, b1: 1, c1: 44, b2: 0, c2: 0,  align: [6, 22] },
          { v: 4,  dcw: 64,  ecPerBlock: 18, b1: 2, c1: 32, b2: 0, c2: 0,  align: [6, 26] },
          { v: 5,  dcw: 86,  ecPerBlock: 24, b1: 2, c1: 43, b2: 0, c2: 0,  align: [6, 30] },
          { v: 6,  dcw: 108, ecPerBlock: 16, b1: 4, c1: 27, b2: 0, c2: 0,  align: [6, 34] },
          { v: 7,  dcw: 124, ecPerBlock: 18, b1: 4, c1: 31, b2: 0, c2: 0,  align: [6, 22, 38] },
          { v: 8,  dcw: 154, ecPerBlock: 22, b1: 2, c1: 38, b2: 2, c2: 39, align: [6, 24, 42] },
          { v: 9,  dcw: 182, ecPerBlock: 22, b1: 3, c1: 36, b2: 2, c2: 37, align: [6, 26, 46] },
          { v: 10, dcw: 216, ecPerBlock: 26, b1: 4, c1: 43, b2: 1, c2: 44, align: [6, 28, 50] }
        ];
        let spec = VERSIONS_M[10];
        for (let v = 1; v <= 10; v++) {
          const lenBits = v <= 9 ? 8 : 16;
          if (bytes.length <= Math.floor((VERSIONS_M[v].dcw * 8 - 4 - lenBits) / 8)) {
            spec = VERSIONS_M[v];
            break;
          }
        }
        const safeBytes = bytes.slice(0, 210);
        const bits = [];
        const pushBits = (val, n) => { for (let i = n - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
        pushBits(0b0100, 4);
        pushBits(safeBytes.length, spec.v <= 9 ? 8 : 16);
        for (let i = 0; i < safeBytes.length; i++) pushBits(safeBytes[i], 8);
        pushBits(0, Math.min(4, spec.dcw * 8 - bits.length));
        while (bits.length % 8 !== 0) bits.push(0);
        const dataCw = [];
        for (let i = 0; i < bits.length; i += 8) {
          let b = 0;
          for (let j = 0; j < 8; j++) b = (b << 1) | bits[i + j];
          dataCw.push(b);
        }
        const pads = [0xec, 0x11];
        for (let p = 0; dataCw.length < spec.dcw; p++) dataCw.push(pads[p % 2]);

        const gfExp = new Uint8Array(512), gfLog = new Uint8Array(256);
        let x = 1;
        for (let i = 0; i < 255; i++) { gfExp[i] = x; gfLog[x] = i; x <<= 1; if (x & 0x100) x ^= 0x11d; }
        for (let i = 255; i < 512; i++) gfExp[i] = gfExp[i - 255];
        const gfMul = (a, b) => (a === 0 || b === 0) ? 0 : gfExp[gfLog[a] + gfLog[b]];

        let poly = [1];
        for (let i = 0; i < spec.ecPerBlock; i++) {
          const next = new Array(poly.length + 1).fill(0);
          for (let j = 0; j < poly.length; j++) { next[j] ^= poly[j]; next[j + 1] ^= gfMul(poly[j], gfExp[i]); }
          poly = next;
        }
        const rsEncode = (blk) => {
          const ecLen = poly.length - 1, rem = new Uint8Array(ecLen);
          for (let i = 0; i < blk.length; i++) {
            const f = blk[i] ^ rem[0];
            for (let j = 0; j < ecLen - 1; j++) rem[j] = rem[j + 1];
            rem[ecLen - 1] = 0;
            if (f !== 0) for (let j = 0; j < ecLen; j++) rem[j] ^= gfMul(poly[j + 1], f);
          }
          return Array.from(rem);
        };
        const dBlocks = [], eBlocks = [];
        let off = 0;
        for (let i = 0; i < spec.b1; i++) { const b = dataCw.slice(off, off + spec.c1); off += spec.c1; dBlocks.push(b); eBlocks.push(rsEncode(b)); }
        for (let i = 0; i < spec.b2; i++) { const b = dataCw.slice(off, off + spec.c2); off += spec.c2; dBlocks.push(b); eBlocks.push(rsEncode(b)); }
        const finalCw = [];
        for (let c = 0; c < Math.max(spec.c1, spec.c2); c++) for (let b = 0; b < dBlocks.length; b++) if (c < dBlocks[b].length) finalCw.push(dBlocks[b][c]);
        for (let c = 0; c < spec.ecPerBlock; c++) for (let b = 0; b < eBlocks.length; b++) finalCw.push(eBlocks[b][c]);

        const size = spec.v * 4 + 17;
        const mod = Array.from({ length: size }, () => new Uint8Array(size));
        const isFunc = Array.from({ length: size }, () => new Uint8Array(size));
        const setF = (r, c, d) => { if (r >= 0 && r < size && c >= 0 && c < size) { mod[r][c] = d ? 1 : 0; isFunc[r][c] = 1; } };
        const finder = (tr, lc) => {
          for (let dr = -1; dr <= 7; dr++) for (let dc = -1; dc <= 7; dc++) {
            const r = tr + dr, c = lc + dc;
            if (r < 0 || r >= size || c < 0 || c >= size) continue;
            const inO = dr >= 0 && dr <= 6 && dc >= 0 && dc <= 6;
            setF(r, c, inO && (dr === 0 || dr === 6 || dc === 0 || dc === 6 || (dr >= 2 && dr <= 4 && dc >= 2 && dc <= 4)));
          }
        };
        finder(0, 0); finder(0, size - 7); finder(size - 7, 0);
        for (let i = 8; i < size - 8; i++) { setF(6, i, i % 2 === 0); setF(i, 6, i % 2 === 0); }
        for (let ar of spec.align) for (let ac of spec.align) {
          if ((ar < 9 && ac < 9) || (ar < 9 && ac > size - 10) || (ar > size - 10 && ac < 9)) continue;
          for (let dr = -2; dr <= 2; dr++) for (let dc = -2; dc <= 2; dc++) {
            setF(ar + dr, ac + dc, Math.max(Math.abs(dr), Math.abs(dc)) !== 1);
          }
        }
        setF(size - 8, 8, true);
        for (let i = 0; i < 9; i++) { if (i !== 6) { isFunc[8][i] = 1; isFunc[i][8] = 1; } }
        for (let i = 0; i < 8; i++) { isFunc[8][size - 1 - i] = 1; isFunc[size - 1 - i][8] = 1; }
        if (spec.v >= 7) {
          let rem = spec.v;
          for (let i = 0; i < 12; i++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1f25);
          const vBits = (spec.v << 12) | rem;
          for (let i = 0; i < 18; i++) {
            const bit = ((vBits >>> i) & 1) === 1;
            const a = size - 11 + (i % 3), b = Math.floor(i / 3);
            setF(b, a, bit); setF(a, b, bit);
          }
        }
        const cwBits = [];
        finalCw.forEach((cw) => { for (let i = 7; i >= 0; i--) cwBits.push((cw >>> i) & 1); });
        let bitIdx = 0, upward = true;
        for (let right = size - 1; right >= 1; right -= 2) {
          if (right === 6) right = 5;
          for (let v = 0; v < size; v++) {
            const r = upward ? (size - 1 - v) : v;
            for (let j = 0; j < 2; j++) {
              const c = right - j;
              if (!isFunc[r][c]) { mod[r][c] = bitIdx < cwBits.length ? cwBits[bitIdx++] : 0; }
            }
          }
          upward = !upward;
        }
        const writeFmt = (mat, mask) => {
          const data = (0b00 << 3) | mask;
          let rem = data;
          for (let i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
          const bits15 = ((data << 10) | rem) ^ 0x5412;
          const getB = (i) => (bits15 >>> i) & 1;
          for (let i = 0; i <= 5; i++) mat[i][8] = getB(i);
          mat[7][8] = getB(6); mat[8][8] = getB(7); mat[8][7] = getB(8);
          for (let i = 9; i < 15; i++) mat[8][14 - i] = getB(i);
          for (let i = 0; i < 8; i++) mat[8][size - 1 - i] = getB(i);
          for (let i = 8; i < 15; i++) mat[size - 15 + i][8] = getB(i);
          mat[size - 8][8] = 1;
        };
        const cand = mod.map((row, r) => Uint8Array.from(row, (v, c) => (!isFunc[r][c] && ((r + c) % 2 === 0)) ? (v ^ 1) : v));
        writeFmt(cand, 0);
        const quiet = 4, scale = 5, px = (size + quiet * 2) * scale;
        const cv = document.createElement('canvas');
        cv.width = px; cv.height = px;
        const ctx = cv.getContext('2d');
        ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, px, px);
        ctx.fillStyle = '#09080e';
        for (let r = 0; r < size; r++) for (let c = 0; c < size; c++) if (cand[r][c]) ctx.fillRect((c + quiet) * scale, (r + quiet) * scale, scale, scale);
        return cv.toDataURL('image/png');
      }

            <span><strong style="color:#ffd089;">PROJECT TICKET:</strong> <a href="admin.html?tab=bulkquote&ticket=${encodeURIComponent(resolvedTicket)}" style="color:#ffb36b;font-weight:800;text-decoration:underline;">#${esc(resolvedTicket)}</a></span>
            ${contactParts ? `<div style="width:100%;font-size:0.76rem;color:rgba(255,255,255,0.76);margin-top:2px;">${esc(contactParts)}</div>` : ''}
            ${meta.customerNotesText ? `<div style="width:100%;font-size:0.76rem;color:#ffd089;margin-top:2px;"><strong>Project Notes:</strong> ${esc(meta.customerNotesText)}</div>` : ''}
          </div>

          ${paidBannerHtml}

          <!-- TIER 4: PROJECTED FINISHED ITEM + OVERALL BREAKDOWN PER ITEM -->
          <div class="c1-mid-grid">
            <div class="c1-smoked-card">
              <div class="c1-card-heading">PROJECTED FINISHED ITEM</div>
              <div class="c1-mockup-frame">
                <img src="${esc(mockupImgSrc)}" alt="Projected Finished Garment" id="qProjectedFinishImg" title="Click to enlarge Projected Finished Item">
              </div>
              <div style="text-align:center;font-size:0.7rem;color:rgba(255,210,164,0.75);margin-top:8px;">
                Photorealistic S&amp;S Dri-Fit Finish &bull; Click image to inspect full-size detail
              </div>
            </div>

            <div class="c1-smoked-card">
              <div>
                <div class="c1-card-heading">OVERALL BREAKDOWN PER ITEM</div>
                <div class="c1-kpi-2x2">
                  <div class="c1-kpi-box">
                    <div class="c1-kpi-number">${totalShirts}</div>
                    <div class="c1-kpi-caption">Total Items</div>
                  </div>
                  <div class="c1-kpi-box">
                    <div class="c1-kpi-number">${money(basePerItem)}</div>
                    <div class="c1-kpi-caption">Base/Item</div>
                  </div>
                  <div class="c1-kpi-box">
                    <div class="c1-kpi-number">${discountPct}%</div>
                    <div class="c1-kpi-caption">${discountPct > 0 ? esc(discountLabel) : 'Discount'}</div>
                  </div>
                  <div class="c1-kpi-box">
                    <div class="c1-kpi-number">${money(finalPerItem)}</div>
                    <div class="c1-kpi-caption">Final/Item</div>
                  </div>
                </div>
              </div>
              ${miniGroupHtml ? `<div style="display:flex;flex-direction:column;gap:6px;margin-top:11px;">${miniGroupHtml}</div>` : ''}
            </div>
          </div>

          <!-- TIER 4.5: ITEM DESCRIPTION & GARMENT SPECIFICATIONS -->
          ${descCardsHtml ? `
            <div class="c1-item-desc-card">
              <div class="c1-card-heading" style="margin-bottom:4px;">ITEM DESCRIPTION &amp; GARMENT SPECIFICATIONS</div>
              <div class="c1-desc-grid">
                ${descCardsHtml}
              </div>
            </div>
          ` : ''}

          <!-- TIER 5: FULL LINE-BY-LINE ITEMIZED BREAKDOWN -->
          <div class="c1-table-shell">
            <div class="c1-card-heading" style="margin-bottom:8px;">ITEMIZED QUOTE BREAKDOWN (LINE BY LINE)</div>
            <div style="overflow-x:auto;">
              <table class="c1-table">
                <thead>
                  <tr>
                    <th style="width:52px;text-align:center;">Line</th>
                    <th>Garment, Color &amp; Item Description</th>
                    <th>Print Specs</th>
                    <th style="text-align:center;">Size</th>
                    <th style="text-align:center;">Qty</th>
                    <th style="text-align:right;">Unit Price</th>
                    <th style="text-align:right;">Line Total</th>
                  </tr>
                </thead>
                <tbody>
                  ${tableRowsHtml}
                </tbody>
              </table>
            </div>
          </div>

          <!-- TIER 6: AVAILABLE S&S COLORS + LIVE STRIPE QR & TOTALS -->
          <div class="c1-bottom-grid">
            <div class="c1-smoked-card">
              <div>
                <div class="c1-card-heading" style="margin-bottom:4px;">AVAILABLE S&amp;S COLORS</div>
                <div style="text-align:center;font-size:0.72rem;color:rgba(255,210,164,0.82);margin-bottom:10px;">
                  ${esc(meta.primaryStyleLabel || `Official S&S Performance Palette (${colorsList.length} Colors)`)}
                </div>
                <div class="c1-orbs-grid">
                  ${orbsHtml}
                </div>
              </div>
              <div style="text-align:center;font-size:0.69rem;color:rgba(255,255,255,0.58);margin-top:10px;">
                Selected order color(s) highlighted in molten orange
              </div>
            </div>

            <div class="c1-smoked-card">
              <div class="c1-qr-totals-split">
                <div class="c1-qr-card">
                  <a href="${esc(payPortalUrl)}" target="_blank" rel="noopener noreferrer" title="Scan or click for Live Stripe Checkout">
                    <img src="${qrDataUrl}" alt="Scan for Stripe Checkout">
                  </a>
                  <div style="font-family:'Orbitron',sans-serif;font-size:0.63rem;font-weight:800;color:#ffb36b;margin-top:7px;letter-spacing:0.05em;">
                    SCAN TO PAY (STRIPE)
                  </div>
                  <div style="font-size:0.62rem;color:${isPaid ? '#22f59b' : '#ffd089'};margin-top:2px;font-weight:700;">
                    ${isPaid ? '&#10003; PAID IN FULL' : '&#9679; Card / Apple Pay'}
                  </div>
                </div>

                <div>
                  <div style="display:flex;justify-content:space-between;align-items:center;padding:4px 6px;font-size:0.9rem;color:#f1f5f9;">
                    <span>Subtotal:</span>
                    <strong>${money(subtotalBefore)}</strong>
                  </div>

                  <div class="c1-disc-pill">
                    <span>${discountPct}% OFF ${esc(discountLabel)}:</span>
                    <strong style="color:#ffa23e;">${discountAmt > 0 ? '&minus;' + money(discountAmt) : '$0.00'}</strong>
                  </div>

                  <div style="display:flex;justify-content:space-between;align-items:center;padding:4px 6px;font-size:0.88rem;color:#f1f5f9;">
                    <span>${includeTax ? `Tax Included (${taxRatePct.toFixed(2)}%):` : 'Tax Excluded:'}</span>
                    <strong>${money(taxAmt)}</strong>
                  </div>

                  <div class="c1-grand-pill">
                    <span style="font-family:'Orbitron',sans-serif;font-size:0.88rem;font-weight:800;color:#ffffff;">GRAND TOTAL:</span>
                    <span style="font-family:'Orbitron',sans-serif;font-size:1.22rem;font-weight:900;color:#ffa23e;">${money(grandTotal)}</span>
                  </div>

                  ${!isPaid ? `
                    <button type="button" class="c1-approve-pay-cta no-print js-pay-quote-trigger" id="sheetApprovePayBtn">
                      &#128179; Approve &amp; Pay Quote (${money(grandTotal)}) via Stripe
                    </button>
                  ` : ''}
                </div>
              </div>
            </div>
          </div>
        `;

        document.getElementById('qProjectedFinishImg')?.addEventListener('click', (ev) => {
          const zModal = document.getElementById('mockupZoomModal');
          const zImg = document.getElementById('mockupZoomImg');
          if (zModal && zImg) {
            zImg.src = ev.currentTarget.src;
            zModal.classList.add('open');
          }
        });

        document.getElementById('sheetApprovePayBtn')?.addEventListener('click', triggerStripePayment);
      }

      async function loadQuoteDossier() {
        if (!ticketId) {
          dynamicEl.innerHTML = `
            <h2 style="font-family:'Orbitron',sans-serif;font-size:1.05rem;color:#ff9e6b;">Missing Project Ticket Number</h2>
            <p style="font-size:0.86rem;color:rgba(255,255,255,0.75);margin-top:8px;">Open this page from your official RetroCanopy Quote link or scan the QR code on your quote sheet.</p>
          `;
          return;
        }

        // If returning from Stripe Checkout success, verify payment first so cloud DB + Owner's Hub update immediately!
        if (isSuccess && sessionId) {
          try {
            await fetch(EDGE_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                action: 'verify_session',
                sessionId,
                ticketId,
                quoteId: ticketId
              })
            });
          } catch (_) {}
        }

        try {
          const res = await fetch(EDGE_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              action: 'get_quote_by_ticket',
              ticketId
            })
          });
          const data = await res.json();
          if (!res.ok || !data.ok) {
            throw new Error(data.error || `Ticket #${ticketId} could not be found.`);
          }
          renderDossier(data);
        } catch (err) {
          dynamicEl.innerHTML = `
            <h2 style="font-family:'Orbitron',sans-serif;font-size:1.05rem;color:#ff9e6b;">Unable to Load Ticket #${esc(ticketId)}</h2>
            <p style="font-size:0.85rem;color:rgba(255,255,255,0.74);margin-top:8px;">${esc(err.message || String(err))}</p>
          `;
        }
      }

      loadQuoteDossier();
    })();
  </script>
</body>
</html>
